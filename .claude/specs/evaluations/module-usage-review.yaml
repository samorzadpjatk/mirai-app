name: module_usage_review
version: 1.0.0
description: |
  Comprehensive evaluation specification for reviewing large module files
  to validate all defined items are actively used and properly integrated.

  This spec cross-references module definitions with their consumers,
  identifies orphaned code, redundancy, and consolidation opportunities.

use_cases:
  - analyzing_large_module_files
  - identifying_orphaned_dependencies
  - validating_di_registration
  - finding_consolidation_opportunities
  - module_cleanup_assessment

applies_to:
  file_patterns:
    - "**/modules/*Module.ts"
    - "**/modules/*Module.tsx"
    - "**/index.ts"
    - "**/registry.ts"
  min_lines: 500
  typical_content:
    - dependency_injection_registrations
    - use_case_definitions
    - controller_mappings
    - service_registrations
    - repository_bindings

context_gathering:
  required_files:
    - target_module_file:
        description: "The module file being reviewed"
        extract:
          - all_registered_names
          - registration_patterns
          - di_configuration
          - lifetime_scopes

    - consumer_files:
        description: "Files that import or use the module's exports"
        patterns:
          - "**/controllers/**/*.ts"
          - "**/routers/**/*.ts"
          - "**/handlers/**/*.ts"
          - "**/*.test.ts"
          - "**/*.spec.ts"
        extract:
          - import_statements
          - container_resolve_calls
          - direct_usage_references

    - related_modules:
        description: "Sibling or dependent modules for cross-reference"
        patterns:
          - "**/modules/*.ts"

  code_extraction_rules:
    registrations:
      pattern: 'asClass\(|asFunction\(|asValue\('
      capture: "registered_identifier"

    container_resolutions:
      pattern: 'container\.resolve\(|resolve\("|resolve\(''\'
      capture: "resolved_identifier"

    imports:
      pattern: 'import.*from.*modules/|require\(.*modules/'
      capture: "imported_module"

    test_references:
      pattern: 'describe\(|it\(|test\(|mock\('
      context_window: 5

evaluation_criteria:
  category: module_integrity
  dimensions:
    - id: usage_coverage
      name: "Active Usage Coverage"
      weight: 35
      max_score: 5.0
      rubric:
        5.0: "All registered items actively used; zero orphans"
        4.0: "90%+ items used; minimal orphans with documented reasons"
        3.0: "75%+ items used; some orphans but non-critical"
        2.0: "50%+ items used; notable orphans requiring cleanup"
        1.0: "Under 50% usage; significant cleanup needed"
        0.0: "Majority unused; immediate attention required"
      checks:
        - name: "orphan_detection"
          description: "Identify items registered but never resolved/used"
          method: |
            Compare registered_names vs resolved_names + imported_names
            Item is ORPHAN if:
              - Not in any container.resolve() call
              - Not in any test file
              - Not re-exported from barrel files
              - No route/controller references
          output:
            - orphan_list: "Array of {name, registration_location, registration_line}"
            - confidence_score: "High/Medium/Low based on search completeness"

        - name: "consumer_trace"
          description: "Trace each used item to its ultimate consumer"
          method: |
            Build usage graph: Module -> Router/Controller -> Route/Handler
            For each used item, identify:
              - Direct consumers (controllers, tests)
              - Indirect consumers (routes, handlers)
              - Consumer count
          output:
            - usage_graph: "Map of item -> consumers[]"
            - single_consumer_items: "Items with only one consumer (consolidation candidates)"

    - id: redundancy_analysis
      name: "Redundancy and Similarity"
      weight: 25
      max_score: 5.0
      rubric:
        5.0: "No redundancy; each use case uniquely scoped"
        4.0: "Minor overlaps with clear distinction"
        3.0: "Some similar use cases; consolidation possible"
        2.0: "Notable duplication; consolidation recommended"
        1.0: "Significant redundancy; merge candidates identified"
        0.0: "Heavy duplication; architectural review needed"
      checks:
        - name: "semantic_similarity"
          description: "Detect use cases with similar names or purposes"
          method: |
            Extract use case names and normalize:
              - Remove prefixes (Get/Create/Update/Delete/Handle)
              - Tokenize by camelCase/snake_case
              - Compare token overlap
            Flag pairs with >70% token similarity
          thresholds:
            high: 85
            medium: 70
          output:
            - similar_pairs: "Array of {name1, name2, similarity_score, suggested_action}"

        - name: "purpose_overlap"
          description: "Detect use cases handling same domain entity/operation"
          method: |
            Group use cases by:
              - Target entity (extract from name)
              - Operation type (CRUD + custom)
              - Input/output DTO overlap
            Flag groups with multiple use cases
          output:
            - entity_groups: "Map of entity -> use_cases[]"
            - consolidation_candidates: "Use cases that could be unified"

    - id: di_configuration
      name: "DI Configuration Quality"
      weight: 20
      max_score: 5.0
      rubric:
        5.0: "All registrations use correct lifetime; proper dependency chain"
        4.0: "Minor lifetime issues; easily corrected"
        3.0: "Some scope mismatches or missing dependencies"
        2.0: "Notable DI anti-patterns present"
        1.0: "Significant configuration issues"
        0.0: "Critical DI problems; registration logic broken"
      checks:
        - name: "lifetime_consistency"
          description: "Verify lifetime scopes match usage patterns"
          guidelines:
            SINGLETON: "Stateless, thread-safe, expensive to create"
            SCOPED: "Request-scoped, depends on request context"
            TRANSIENT: "Stateful per-injection, lightweight"
          validation:
            - stateful_singletons: "Flag if singleton holds mutable state"
            - scoped_without_request: "Flag scoped outside request flow"
            - transient_heavy: "Flag excessive transient creation"
          output:
            - lifetime_issues: "Array of {item, current_lifetime, suggested_lifetime, reason}"

        - name: "dependency_chain"
          description: "Verify all dependencies are registered"
          method: |
            For each class registration:
              - Extract constructor dependencies
              - Verify each dependency is registered
              - Check for circular dependencies
          output:
            - missing_dependencies: "Array of {item, missing_dep, constructor_line}"
            - circular_deps: "Array of detected cycles"

    - id: code_organization
      name: "Code Organization"
      weight: 20
      max_score: 5.0
      rubric:
        5.0: "Clean structure; logical grouping; clear naming"
        4.0: "Minor organization improvements possible"
        3.0: "Some structural issues; inconsistent patterns"
        2.0: "Notable organization problems"
        1.0: "Poor structure; hinders maintainability"
        0.0: "Chaotic organization; rewrite recommended"
      checks:
        - name: "naming_conventions"
          description: "Verify consistent naming patterns"
          patterns:
            use_case: "*UseCase or *Interactor"
            controller: "*Controller"
            repository: "*Repository"
            service: "*Service"
          output:
            - naming_violations: "Array of {item, expected_pattern, actual_name}"

        - name: "grouping_logic"
          description: "Check for logical grouping by domain/feature"
          expectations:
            - "Related use cases grouped together"
            - "Comments indicate grouping purpose"
            - "Consistent ordering (alphabetical or by feature)"
          output:
            - grouping_suggestions: "Recommendations for reorganization"
            - structural_score: "1-5 rating"

calculation_method:
  formula: weighted_average
  dimensions:
    - usage_coverage: 35
    - redundancy_analysis: 25
    - di_configuration: 20
    - code_organization: 20

  final_score:
    excellent: 4.5
    good: 3.5
    acceptable: 2.5
    needs_improvement: 1.5
    critical: 0.0

output_schema:
  summary:
    total_items: integer
    active_items: integer
    orphaned_items: integer
    usage_percentage: float
    consolidation_candidates: integer

  orphans:
    - name: string
      line: integer
      registration_type: string
      confidence: "High|Medium|Low"
      suggested_action: "Remove|Investigate|Keep"

  similar_items:
    - group_name: string
      items: list_of_strings
      similarity_type: "Name|Purpose|Entity"
      consolidation_difficulty: "Easy|Medium|Hard"
      recommendation: string

  di_issues:
    - item: string
      issue_type: string
      severity: "High|Medium|Low"
      suggestion: string

  organization:
    - issue: string
      location: string
      recommendation: string

  cleanup_recommendations:
    - priority: "High|Medium|Low"
      action: string
      estimated_effort: string
      affected_items: list_of_strings

reporting_template: |
  # Module Usage Review: {module_name}

  ## Executive Summary
  - **Overall Score:** {final_score}/5.0 ({rating})
  - **Total Items:** {total_items}
  - **Active Usage:** {active_items} ({usage_percentage}%)
  - **Orphaned Items:** {orphaned_items}
  - **Consolidation Opportunities:** {consolidation_candidates}

  ## Orphaned Items (Require Attention)
  {orphans_table}

  ## Similar/Redundant Items
  {similarity_analysis}

  ## DI Configuration Issues
  {di_issues_list}

  ## Cleanup Recommendations
  {prioritized_actions}

  ## Next Steps
  1. {top_priority_action}
  2. {secondary_actions}

meta:
  created: "2026-04-09"
  version: "1.0.0"
  author: "module-review-agent"
  reusable: true
  tags:
    - module-analysis
    - dead-code-detection
    - di-validation
    - code-cleanup
    - use-case-review
    - dependency-analysis

  customization_points:
    min_lines_threshold: "Adjust minimum file size for triggering review"
    similarity_threshold: "Adjust percentage for flagging similar items"
    lifetime_rules: "Customize DI lifetime expectations per project"
    naming_patterns: "Adapt naming conventions to project standards"
