# Domain Layer Test Fix Evaluation Specification
# Reusable spec for evaluating fixes to domain entity tests after business logic changes
#
# Usage: Apply this spec when reviewing test fixes for domain layer entities
# Target: packages/domain/src/entities/*.test.ts

evaluation_id: domain-test-fix-evaluation
version: 1.0.0
created: 2026-04-12
applies_to:
  - packages/domain/src/entities/*.test.ts
  - packages/domain/src/value-objects/*.test.ts
  - packages/domain/src/domain-services/*.test.ts

triggers:
  - Business logic changes requiring test updates
  - Test failures in domain layer after implementation changes
  - Refactoring that affects entity behavior

focus_areas:
  primary: test_fixes_only
  secondary: preserve_test_intent
  constraint: no_business_logic_changes

domain_patterns:
  error_handling: Result<T,E>
  success_variant: ok
  error_variant: err
  test_access_pattern: result.kind === "ok" | result.kind === "err"

evaluation_criteria:
  # 1. Correctness: Tests pass with current implementation
  correctness:
    weight: 30
    description: Test assertions match current business logic implementation
    checks:
      - All tests pass when run with `bun test <filepath>`
      - Assertions reflect actual return values from entity methods
      - Result<T,E> pattern properly validated (kind checks before value access)
      - No test assertions contradict implementation behavior
    failure_patterns:
      - Hardcoded values that don't match current logic
      - Missing kind checks on Result<T,E> before accessing value/error
      - Assertions checking removed/renamed properties
      - Wrong error types in assertions

  # 2. Intent Preservation: Original test purpose maintained
  intent_preservation:
    weight: 25
    description: Test still validates the intended behavior/scenario
    checks:
      - Test scenario/context remains relevant ( Given-When-Then structure )
      - Original edge cases and boundary conditions preserved
      - Test description accurately describes what's being tested
      - Test coverage equivalent or improved (not reduced)
    failure_patterns:
      - Test repurposed to validate different behavior
      - Edge cases removed without justification
      - Test name/description doesn't match actual assertions
      - Valid scenarios removed because they "don't work anymore"

  # 3. Completeness: All failure modes covered
  completeness:
    weight: 20
    description: Tests cover success paths and relevant error paths
    checks:
      - Happy path tested with valid inputs
      - Validation errors tested with invalid inputs
      - Boundary conditions tested (empty strings, max lengths, etc.)
      - All public entity methods have corresponding tests
    failure_patterns:
      - Only error cases tested (missing success case)
      - Only success case tested (missing validation errors)
      - New business rules lack test coverage
      - Removed tests without equivalent replacement

  # 4. Pattern Compliance: Follows domain layer conventions
  pattern_compliance:
    weight: 15
    description: Follows established domain layer testing patterns
    checks:
      - Uses Result<T,E> assertion pattern correctly
      - No async/await in domain tests (pure synchronous logic)
      - No mocking or external dependencies
      - Test file co-located with source (Entity.test.ts beside Entity.ts)
      - Error tag constants used (e.g., error._tag === "ValidationError")
    failure_patterns:
      - Using try/catch instead of Result<T,E> pattern
      - async/await in domain tests
      - Mocking domain dependencies
      - Direct property access without kind check

  # 5. Code Quality: Clean, maintainable test code
  code_quality:
    weight: 10
    description: Tests are readable and maintainable
    checks:
      - Clear arrange-act-assert structure
      - Descriptive test names (describe/it with clear intent)
      - No redundant or duplicate assertions
      - No leftover debug code (console.log, etc.)
      - Type safety maintained
    failure_patterns:
      - Cryptic variable names
      - Duplicate test code without purpose
      - Debug console.log left in tests
      - Mixed concerns in single test

specific_checks:
  # Domain-specific Result<T,E> pattern validation
  result_pattern:
    - pattern: "result.kind === 'ok' before accessing result.value"
      severity: critical
      reason: Type safety guard required
    - pattern: "result.kind === 'err' before accessing result.error"
      severity: critical
      reason: Type safety guard required
    - pattern: "error._tag === 'ExpectedErrorType'"
      severity: high
      reason: Specific error type validation
    - pattern: "Result<T,E> return type in static factory methods"
      severity: high
      reason: Domain entities must use functional error handling

  # Entity creation pattern
  entity_creation:
    - pattern: "Entity.create() called with valid props"
      severity: high
      reason: Standard factory method pattern
    - pattern: "Entity.create() returns Result<Entity, ValidationError>"
      severity: critical
      reason: Domain purity - no exceptions in domain

  # Test structure
  test_structure:
    - pattern: "describe('[UNIT] EntityName') block present"
      severity: medium
      reason: Test tagging convention
    - pattern: "Test names describe behavior, not implementation"
      severity: medium
      reason: Maintainability

prohibited_changes:
  - description: "Do not change business logic to make tests pass"
    severity: critical
    unless: "Bug found in implementation with clear evidence"
  - description: "Do not remove tests solely because they fail"
    severity: high
    unless: "Feature removed and tests truly obsolete"
  - description: "Do not convert Result<T,E> to exceptions"
    severity: critical
  - description: "Do not add async to domain tests"
    severity: high
  - description: "Do not add external dependencies to domain tests"
    severity: high

allowed_fixes:
  - description: "Update assertion expected values"
    example: "expect(result.value.name).toBe('NewExpectedValue')"
  - description: "Add missing kind checks on Result<T,E>"
    example: "if (result.kind === 'ok') { expect(result.value...) }"
  - description: "Update error type assertions"
    example: "expect(result.error._tag).toBe('NewErrorType')"
  - description: "Update test data to match new validation rules"
    example: "Change input from { name: '' } to { name: 'valid' }"
  - description: "Update property access for renamed fields"
    example: "result.value.newField instead of result.value.oldField"
  - description: "Add missing test coverage for new behavior"
    example: "New test case for added validation rule"

scoring:
  minimum_pass: 4.0
  excellent: 4.5
  perfect: 5.0

  rubric:
    5.0:
      - All tests pass
      - Intent fully preserved
      - Complete coverage
      - Perfect pattern compliance
      - Clean, readable code
    4.5:
      - All tests pass
      - Intent preserved
      - Minor coverage gaps acceptable
      - Minor style issues acceptable
    4.0:
      - All tests pass
      - Intent mostly preserved
      - Some coverage gaps
      - Minor pattern deviations
    3.5:
      - All tests pass
      - Intent partially changed
      - Significant coverage gaps
      - Pattern compliance issues
    3.0:
      - Tests pass but intent significantly altered
      - OR critical pattern violations
    below_3.0:
      - Tests still failing
      - OR business logic changed
      - OR tests removed without justification

reporting_template:
  summary: |
    ## Domain Test Fix Evaluation: {filename}

    **Score:** {score}/5.0
    **Status:** {pass|fail|needs_revision}

    ### Correctness ({correctness_score}/5)
    - Tests pass: {yes/no}
    - Assertions match implementation: {yes/no with details}

    ### Intent Preservation ({intent_score}/5)
    - Original test purpose maintained: {yes/no with details}
    - Edge cases preserved: {yes/no with details}

    ### Completeness ({completeness_score}/5)
    - Success paths tested: {yes/no}
    - Error paths tested: {yes/no}
    - New behavior covered: {yes/no}

    ### Pattern Compliance ({pattern_score}/5)
    - Result<T,E> pattern correct: {yes/no with details}
    - No async in domain: {yes/no}
    - No external deps: {yes/no}

    ### Code Quality ({quality_score}/5)
    - Clear structure: {yes/no}
    - Descriptive names: {yes/no}
    - No debug code: {yes/no}

    ### Required Actions
    {list of specific fixes needed}

    ### Issues Found
    {detailed list of any violations}

verification_commands:
  run_tests: "bun test {filepath}"
  run_with_logs: "ENABLE_TEST_LOGS=1 bun test {filepath}"
  coverage_check: "bun test --coverage {filepath}"

example_valid_fix:
  before: |
    // OLD TEST - failing because business logic changed
    it("creates entity", () => {
      const result = User.create({ id: "1", name: "", createdAt: new Date() });
      expect(result.kind).toBe("ok");  // Now fails - empty name invalid
    });

  after: |
    // CORRECTED TEST - preserves intent (tests creation), matches new logic
    it("creates entity with valid name", () => {
      const result = User.create({ id: "1", name: "John", createdAt: new Date() });
      expect(result.kind).toBe("ok");
      if (result.kind === "ok") {
        expect(result.value.name).toBe("John");
      }
    });

    it("fails with empty name", () => {
      const result = User.create({ id: "1", name: "", createdAt: new Date() });
      expect(result.kind).toBe("err");
      if (result.kind === "err") {
        expect(result.error._tag).toBe("ValidationError");
      }
    });

example_invalid_fix:
  description: "WRONG - Changed business logic to match old test"
  code: |
    // BAD: Modified implementation to accept empty name
    // This violates "fix tests, not business logic" rule
    static create(props) {
      // Removed validation to make test pass - DON'T DO THIS
      return ok(new User(props.id, props.name, props.createdAt));
    }
