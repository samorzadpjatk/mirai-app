# Notes for evaluators
notes: |
  This is a Phase 3 refactoring of the Event entity to use Phase 1 utilities.
  Event is a simple entity without state machine - it uses direct Result returns.

  Key changes:
  1. Replace VALIDATION_RULES with validate.*() calls
  2. Replace manual Date creation with timestamps() helper
  3. Replace manual validation with validate.id(), validate.string(), validate.dateRange(), validate.array()
  4. Change Result<Event, string> to Result<Event, ValidationError>
  5. Replace update methods with updateEntity() helper
  6. Update tests to check for ValidationError instances

  Expected final structure:
  - Event.create(): Validates using validate.*() helpers, creates timestamps using timestamps()
  - updateDetails(): Uses updateEntity() with partial updates
  - updateTimes(): Uses updateEntity() with time validation via validate.dateRange()
  - assignToGroup(): Uses updateEntity() with validate.id() for groupId
  - addFile(): Uses updateEntity() with validate.array() for file limits
