# Validation constraints (must be preserved)
validation_constraints:
  title:
    minLength: 1
    maxLength: 200
    required: true
    trim: true
  location:
    minLength: 1
    maxLength: 300
    required: true
    trim: true
  description:
    minLength: 1
    maxLength: 2000
    required: true
    trim: true
  files:
    maxItems: 10
  time_range:
    start_must_be_before_end: true

