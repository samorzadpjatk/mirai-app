# Location Subscriptions
# GraphQL subscriptions for real-time location updates
# ============================================

# Subscribe to location updates for a specific user
# Emits when the specified user updates their location
subscription LocationUpdated($userId: ID!) {
  locationUpdated(userId: $userId) {
    id
    userId
    tripId
    latitude
    longitude
    accuracy
    altitude
    altitudeAccuracy
    heading
    speed
    isSharingLocation
    batteryLevel
    timestamp
    createdAt
  }
}

# Subscribe to friend location updates for a trip
# Emits when friends in the trip update their locations
subscription FriendLocationsUpdated($tripId: ID!) {
  friendLocationsUpdated(tripId: $tripId) {
    userId
    latitude
    longitude
    accuracy
    isSharing
    lastUpdated
    user {
      id
      firstName
      lastName
      nickname
      avatarUrl
    }
  }
}
