type Mutation {
  addGroupCoins(input: AddGroupCoinsInput!): AddCoinsResult
  banUser(input: BanUserInput!): BanUserResult
  bulkAssignUsers(input: BulkAssignUsersInput!): BulkAssignResult
  cancelJoinRequest(groupId: String!): LeaveGroupResult
  castVote(input: CastVoteInput!): VoteResult
  createChallenge(input: CreateChallengeInput!): ChallengeResult
  createGroup(input: CreateGroupInput!): CreateGroupResult
  createReward(
    coinCost: Int!
    description: String
    name: String!
    quantity: Int
    tripId: String!
  ): Reward
  createSubmission(input: CreateSubmissionInput!): SubmissionResult
  createTrip(input: CreateTripInput!): CreateTripResult
  createUser(input: CreateUserInput!): CreateUserResult
  deleteChallenge(input: DeleteChallengeInput!): ChallengeResult
  deleteFile(path: String!): StorageDeleteResult
  deleteGroup(input: DeleteGroupInput!): LeaveGroupResult
  deleteMyGroup(groupId: String!): LeaveGroupResult
  deleteTrip(input: DeleteTripInput!): DeleteTripResult
  deleteUser(input: DeleteUserInput!): DeleteUserResult
  forceCloseVoting(id: String!, tripId: String!): ForceCloseVotingResult
  joinGroup(input: JoinGroupInput!): JoinGroupResult
  leaveGroup(groupId: String!): LeaveGroupResult
  markAllNotificationsRead: MarkAllReadResult
  markNotificationRead(id: String!): Notification
  redeemReward(input: RedeemRewardInput!): RedeemedReward
  removeHouseNumber(tripId: String!, userId: String!): ParticipantNumberResult
  removeUserFromGroup(tripId: String!, userId: String!): JoinGroupResult
  removeVote(submissionId: String!): VoteResult
  removeWristNumber(tripId: String!, userId: String!): ParticipantNumberResult
  requestJoinGroup(input: RequestJoinGroupInput!): JoinGroupResult
  respondToJoinRequest(input: RespondJoinRequestInput!): JoinRequestResponse
  reviewSubmission(input: ReviewSubmissionInput!): SubmissionResult
  updateAvatar(input: UpdateAvatarInput!): AvatarUpdateResult
  updateChallenge(input: UpdateChallengeInput!): ChallengeResult
  updateGroup(input: UpdateGroupInput!): UpdateGroupResult
  updateHouseNumber(input: UpdateHouseNumberInput!): ParticipantNumberResult
  updateMyProfile(input: UpdateUserProfileInput!): UpdateProfileResult
  updateNotificationPreferences(
    input: UpdateNotificationPreferencesInput!
  ): UpdatePreferencesResult
  updateTrip(input: UpdateTripInput!): UpdateTripResult
  updateUserName(input: UpdateUserNameInput!): UpdateUserResult
  updateUserRole(input: UpdateUserRoleInput!): UpdateUserResult
  updateWristNumber(input: UpdateWristNumberInput!): ParticipantNumberResult
}

