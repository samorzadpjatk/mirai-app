type Query {
  activityFeed(
    after: String
    first: Int
    tripId: String!
  ): ActivityFeedConnection
  adminNames: [AdminName!]
  allChallenges: [Challenge!]
  allRewards: [Reward!]
  banStatusByEmail(input: GetUserByEmailInput!): BanStatus
  challenge(id: String!, tripId: String!): Challenge
  challenges(after: String, first: Int, tripId: String!): ChallengeConnection
  group(id: String!): GroupWithDetails
  groupActivity(
    after: String
    first: Int
    groupId: String!
  ): ActivityFeedConnection
  groupGallery(groupId: String!): [GroupGallerySubmission!]
  groupList(tripId: String!): [Group!]
  groupRanking(tripId: String!): GroupRankingResult
  groupSubmissions(
    after: String
    challengeId: String!
    first: Int
    tripId: String!
  ): SubmissionConnection
  groupTransactions(
    after: String
    first: Int
    groupId: String!
  ): CoinTransactionConnection
  groups(after: String, first: Int, tripId: String!): GroupConnection
  me: UserProfile
  myBanStatus: BanStatus
  myGroup(tripId: String!): GroupWithDetails
  myGroupBalance(tripId: String!): CoinBalance
  myGroupInfo(tripId: String!): UserWithGroupInfo
  myJoinRequest(groupId: String!): GroupJoinRequest
  myNotifications(after: String, first: Int): NotificationConnection
  myRedeemedRewards(tripId: String!): [RedeemedReward!]
  mySubmissions(
    after: String
    first: Int
    tripId: String!
  ): SubmissionConnection
  myTrips(after: String, first: Int): TripConnection
  myVotes(challengeId: String!): [ChallengeVote!]
  notificationPreferences: NotificationPreferences
  pendingJoinRequests(groupId: String!): [GroupJoinRequest!]
  pendingSubmissions(
    after: String
    first: Int
    tripId: String!
  ): SubmissionConnection
  rewards(after: String, first: Int, tripId: String!): RewardConnection
  searchUsers(
    after: String
    field: String!
    first: Int
    searchTerm: String
    tripId: String!
  ): UserConnection
  sponsors: [Sponsor!]
  submissionVotes(submissionId: String!): [ChallengeVote!]
  trip(id: String!): TripWithParticipants
  tripAdmin(id: String!): TripWithParticipants
  tripParticipant(tripId: String!, userId: String!): TripParticipantInfo
  tripResources(tripId: String!): TripResourcesResult
  uploadUrl(input: GetUploadUrlInput!): StorageUploadUrl
  user(id: String!): User
  userWithGroup(id: String!, tripId: String!): UserWithGroupInfo
  users(after: String, first: Int, tripId: String!): UserConnection
}

