# Location Operations - Mirai App API
# GraphQL operations for Location domain
# ============================================

fragment LocationFields on Location {
  id
  userId
  tripId
  latitude
  longitude
  accuracy
  altitude
  altitudeAccuracy
  speed
  heading
  timestamp
  isSharingLocation
  batteryLevel
  createdAt
}

fragment LocationEdgeFields on LocationEdge {
  cursor
  node {
    ...LocationFields
  }
}

fragment PageInfoFields on PageInfo {
  endCursor
  hasNextPage
  hasPreviousPage
  startCursor
}

fragment LocationConnectionFields on LocationConnection {
  edges {
    ...LocationEdgeFields
  }
  nodes {
    ...LocationFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

# Get my current location
query GetMyLocation {
  myLocation {
    ...LocationFields
  }
}

# Get locations by trip with pagination
query GetLocationsByTrip($tripId: ID!, $first: Int, $after: String) {
  locationsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...LocationConnectionFields
  }
}
