# Coin Operations
# GraphQL operations for coin transactions in the Mirai App API
# These operations allow fetching paginated coin transaction data for trips and managing coins.

# ============================================
# FRAGMENTS
# ============================================

fragment CoinPageInfoFields on PageInfo {
  hasNextPage
  hasPreviousPage
  startCursor
  endCursor
}

fragment CoinTransactionAdminFields on CoinTransactionAdmin {
  id
  firstName
  lastName
}

fragment CoinTransactionGroupFields on CoinTransactionGroup {
  id
  name
  coins
}

fragment CoinTransactionFields on CoinTransaction {
  id
  amount
  reason
  adminId
  groupId
  createdAt
  updatedAt
  admin {
    ...CoinTransactionAdminFields
  }
  group {
    ...CoinTransactionGroupFields
  }
}

fragment CoinTransactionEdgeFields on CoinTransactionEdge {
  cursor
  node {
    ...CoinTransactionFields
  }
}

fragment CoinTransactionConnectionFields on CoinTransactionConnection {
  totalCount
  pageInfo {
    ...CoinPageInfoFields
  }
  edges {
    ...CoinTransactionEdgeFields
  }
  nodes {
    ...CoinTransactionFields
  }
}

# ============================================
# QUERIES
# ============================================

# Get paginated coin transactions for a trip
# Supports optional groupId filter and Relay-style pagination (first, after)
query GetCoinTransactions(
  $tripId: ID!
  $groupId: ID
  $first: Int
  $after: String
) {
  coinTransactions(
    tripId: $tripId
    groupId: $groupId
    first: $first
    after: $after
  ) {
    ...CoinTransactionConnectionFields
  }
}

# ============================================
# MUTATIONS
# ============================================

# Add coins to a group (admin only)
mutation AddCoins($input: AddCoinsInput!) {
  addCoins(input: $input) {
    ...CoinTransactionFields
  }
}

# Remove coins from a group (admin only)
mutation RemoveCoins($input: RemoveCoinsInput!) {
  removeCoins(input: $input) {
    ...CoinTransactionFields
  }
}
