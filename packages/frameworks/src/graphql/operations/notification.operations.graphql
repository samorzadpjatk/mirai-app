# Notification Operations - Mirai App API
# GraphQL operations for Notification domain

# ============================================
# FRAGMENTS
# ============================================

fragment NotificationFields on Notification {
  id
  title
  content
  status
  priority
  tripId
  createdById
  scheduledAt
  sentAt
  createdAt
  updatedAt
}

fragment NotificationEdgeFields on NotificationEdge {
  cursor
  node {
    ...NotificationFields
  }
}

fragment PageInfoFields on PageInfo {
  endCursor
  hasNextPage
  hasPreviousPage
  startCursor
}

fragment NotificationConnectionFields on NotificationConnection {
  edges {
    ...NotificationEdgeFields
  }
  nodes {
    ...NotificationFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment NotificationScheduleFields on NotificationSchedule {
  id
  name
  tripId
  notificationType
  notificationTitle
  notificationBody
  startDate
  endDate
  hour
  minute
  isActive
  isRecurring
  lastRun
  nextRun
  recurrencePattern
  createdById
  createdAt
  updatedAt
}

fragment NotificationScheduleEdgeFields on NotificationScheduleEdge {
  cursor
  node {
    ...NotificationScheduleFields
  }
}

fragment NotificationScheduleConnectionFields on NotificationScheduleConnection {
  edges {
    ...NotificationScheduleEdgeFields
  }
  nodes {
    ...NotificationScheduleFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment NotificationDeliveryFields on NotificationDelivery {
  id
  notificationId
  userId
  status
  channel
  sentAt
  deliveredAt
  failedAt
  errorMessage
  retryCount
  createdAt
  updatedAt
}

fragment NotificationDeliveryEdgeFields on NotificationDeliveryEdge {
  cursor
  node {
    ...NotificationDeliveryFields
  }
}

fragment NotificationDeliveryConnectionFields on NotificationDeliveryConnection {
  edges {
    ...NotificationDeliveryEdgeFields
  }
  nodes {
    ...NotificationDeliveryFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

# ============================================
# QUERIES
# ============================================

query GetNotificationsByUser($userId: ID!, $first: Int, $after: String) {
  notificationsByUser(userId: $userId, first: $first, after: $after) {
    ...NotificationConnectionFields
  }
}

query GetUnreadNotificationsByUser($userId: ID!, $first: Int, $after: String) {
  unreadNotificationsByUser(userId: $userId, first: $first, after: $after) {
    ...NotificationConnectionFields
  }
}

query GetMyNotifications($first: Int, $after: String) {
  myNotifications(first: $first, after: $after) {
    ...NotificationConnectionFields
  }
}

query GetAllNotifications($first: Int, $after: String) {
  allNotifications(first: $first, after: $after) {
    ...NotificationConnectionFields
  }
}

query GetNotificationSchedules($tripId: ID, $first: Int, $after: String) {
  notificationSchedules(tripId: $tripId, first: $first, after: $after) {
    ...NotificationScheduleConnectionFields
  }
}

query GetNotificationSchedule($id: ID!) {
  notificationSchedule(id: $id) {
    ...NotificationScheduleFields
  }
}

query GetNotificationDeliveries(
  $notificationId: ID
  $userId: ID
  $first: Int
  $after: String
) {
  notificationDeliveries(
    notificationId: $notificationId
    userId: $userId
    first: $first
    after: $after
  ) {
    ...NotificationDeliveryConnectionFields
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateNotification($input: CreateNotificationInput!) {
  createNotification(input: $input) {
    ...NotificationFields
  }
}

mutation UpdateNotification($id: ID!, $input: UpdateNotificationInput!) {
  updateNotification(id: $id, input: $input) {
    ...NotificationFields
  }
}

mutation DeleteNotification($id: ID!) {
  deleteNotification(id: $id)
}

mutation UpdateNotificationStatus(
  $id: ID!
  $input: UpdateNotificationStatusInput!
) {
  updateNotificationStatus(id: $id, input: $input) {
    ...NotificationFields
  }
}

mutation ScheduleNotification($id: ID!, $input: ScheduleNotificationInput!) {
  scheduleNotification(id: $id, input: $input) {
    ...NotificationFields
  }
}

mutation MarkNotificationRead($id: ID!) {
  markNotificationRead(id: $id) {
    ...NotificationFields
  }
}

mutation MarkAllNotificationsRead {
  markAllNotificationsRead
}

mutation CreateNotificationSchedule($input: CreateNotificationScheduleInput!) {
  createNotificationSchedule(input: $input) {
    ...NotificationScheduleFields
  }
}

mutation UpdateNotificationSchedule(
  $id: ID!
  $input: UpdateNotificationScheduleInput!
) {
  updateNotificationSchedule(id: $id, input: $input) {
    ...NotificationScheduleFields
  }
}

mutation DeleteNotificationSchedule($id: ID!) {
  deleteNotificationSchedule(id: $id)
}

mutation ToggleNotificationScheduleActive($id: ID!) {
  toggleNotificationScheduleActive(id: $id) {
    ...NotificationScheduleFields
  }
}

# Send mobile notifications to trip participants
mutation SendMobileNotifications($input: SendMobileNotificationsInput!) {
  sendMobileNotifications(input: $input)
}
