# Challenge Operations - Mirai App API
# ============================================
# GraphQL operations for Challenge domain.
# ============================================

# Fragments
fragment ChallengeFields on Challenge {
  id
  allowVoting
  createdAt
  dailyEndTime
  dailyStartTime
  description
  endTime
  maxSubmissions
  name
  points
  startTime
  status
  submissionType
  tripId
  updatedAt
  votingEndTime
  votingStartTime
}

fragment ChallengeEdgeFields on ChallengeEdge {
  cursor
  node {
    ...ChallengeFields
  }
}

fragment PageInfoFields on PageInfo {
  endCursor
  hasNextPage
  hasPreviousPage
  startCursor
}

fragment ChallengeConnectionFields on ChallengeConnection {
  edges {
    ...ChallengeEdgeFields
  }
  nodes {
    ...ChallengeFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment ChallengeSubmissionFields on ChallengeSubmission {
  id
  challengeId
  content
  createdAt
  groupId
  mediaUrls
  score
  status
  updatedAt
  userId
  voteScore
}

fragment ChallengeSubmissionEdgeFields on ChallengeSubmissionEdge {
  cursor
  node {
    ...ChallengeSubmissionFields
  }
}

fragment ChallengeSubmissionConnectionFields on ChallengeSubmissionConnection {
  edges {
    ...ChallengeSubmissionEdgeFields
  }
  nodes {
    ...ChallengeSubmissionFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment ChallengeVoteFields on ChallengeVote {
  id
  challengeId
  createdAt
  points
  position
  submissionId
  voterId
}

fragment ChallengeVoteEdgeFields on ChallengeVoteEdge {
  cursor
  node {
    ...ChallengeVoteFields
  }
}

fragment ChallengeVoteConnectionFields on ChallengeVoteConnection {
  edges {
    ...ChallengeVoteEdgeFields
  }
  nodes {
    ...ChallengeVoteFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment JudgedStaffVotingProgressFields on JudgedStaffVotingProgress {
  challengeId
  totalSubmissions
  votedSubmissions
  remainingSubmissions
  isComplete
}

# Queries
query GetChallengesByTrip($tripId: ID!, $first: Int, $after: String) {
  challengesByTrip(tripId: $tripId, first: $first, after: $after) {
    ...ChallengeConnectionFields
  }
}

query GetChallenge($id: ID!) {
  challenge(id: $id) {
    ...ChallengeFields
  }
}

query GetChallengeSubmissions($challengeId: ID!, $first: Int, $after: String) {
  challengeSubmissions(
    challengeId: $challengeId
    first: $first
    after: $after
  ) {
    ...ChallengeSubmissionConnectionFields
  }
}

query GetVotesByChallenge($challengeId: ID!, $first: Int, $after: String) {
  challengeVotes(challengeId: $challengeId, first: $first, after: $after) {
    ...ChallengeVoteConnectionFields
  }
}

# Get my votes for a specific challenge
query GetMyVotes($challengeId: ID!, $first: Int, $after: String) {
  myVotes(challengeId: $challengeId, first: $first, after: $after) {
    ...ChallengeVoteConnectionFields
  }
}

# Get judged staff voting progress for a challenge
query GetJudgedStaffVotingProgress($challengeId: ID!) {
  judgedStaffVotingProgress(challengeId: $challengeId) {
    ...JudgedStaffVotingProgressFields
  }
}

# Mutations
mutation CreateChallenge($input: CreateChallengeInput!) {
  createChallenge(input: $input) {
    ...ChallengeFields
  }
}

mutation UpdateChallenge($id: ID!, $input: UpdateChallengeInput!) {
  updateChallenge(id: $id, input: $input) {
    ...ChallengeFields
  }
}

mutation DeleteChallenge($id: ID!) {
  deleteChallenge(id: $id)
}

mutation CreateChallengeSubmission($input: CreateChallengeSubmissionInput!) {
  createChallengeSubmission(input: $input) {
    ...ChallengeSubmissionFields
  }
}

mutation ApproveChallengeSubmission($input: ApproveChallengeSubmissionInput!) {
  approveChallengeSubmission(input: $input) {
    ...ChallengeSubmissionFields
  }
}

mutation RejectChallengeSubmission($input: RejectChallengeSubmissionInput!) {
  rejectChallengeSubmission(input: $input) {
    ...ChallengeSubmissionFields
  }
}

mutation CreateChallengeVote($input: CreateChallengeVoteInput!) {
  createChallengeVote(input: $input) {
    ...ChallengeVoteFields
  }
}

# Submit multiple votes (batch voting)
mutation SubmitVotes($input: SubmitVotesInput!) {
  submitVotes(input: $input) {
    ...ChallengeVoteFields
  }
}

# Force end voting for a judged staff challenge
mutation ForceEndVoting($challengeId: ID!, $tripId: ID!) {
  forceEndVoting(challengeId: $challengeId, tripId: $tripId) {
    ...ChallengeFields
  }
}
