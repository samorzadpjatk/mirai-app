# Location Sharing Operations - Mirai App API
# GraphQL operations for Location Sharing domain
# ============================================

fragment FriendLocationFields on FriendLocation {
  userId
  latitude
  longitude
  accuracy
  lastUpdated
  isSharing
  user {
    id
    firstName
    lastName
    nickname
    avatarUrl
  }
}

fragment LocationSharingResultFields on LocationSharingResult {
  success
  isSharingLocation
  sharedWithCount
}

# Get friend locations for a trip
query GetFriendLocations($tripId: ID!) {
  friendLocations(tripId: $tripId) {
    ...FriendLocationFields
  }
}

# Start sharing location with friends
mutation StartLocationSharing($input: StartLocationSharingInput!) {
  startLocationSharing(input: $input) {
    ...LocationSharingResultFields
  }
}

# Stop sharing location with friends
mutation StopLocationSharing($input: StopLocationSharingInput!) {
  stopLocationSharing(input: $input) {
    ...LocationSharingResultFields
  }
}

# Update my current location
mutation UpdateLocation($input: UpdateLocationInput!) {
  updateLocation(input: $input) {
    ...LocationFields
  }
}

# Subscribe to location updates for a user
subscription LocationUpdated($userId: ID!) {
  locationUpdated(userId: $userId) {
    ...LocationFields
  }
}

# Subscribe to friend location updates for a trip
subscription FriendLocationsUpdated($tripId: ID!) {
  friendLocationsUpdated(tripId: $tripId) {
    ...FriendLocationFields
  }
}
