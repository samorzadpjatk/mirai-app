# Trip Operations - Mirai App API
# GraphQL operations for Trip domain

# ============================================
# FRAGMENTS
# ============================================

fragment TripFields on Trip {
  id
  name
  description
  destination
  startDate
  endDate
  status
  imageUrl
  basePrice
  totalSpots
  availableSpots
  registrationDeadline
  createdAt
  updatedAt
}

fragment TripEdgeFields on TripEdge {
  cursor
  node {
    ...TripFields
  }
}

fragment PageInfoFields on PageInfo {
  endCursor
  hasNextPage
  hasPreviousPage
  startCursor
}

fragment TripConnectionFields on TripConnection {
  edges {
    ...TripEdgeFields
  }
  nodes {
    ...TripFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment TripParticipantFields on TripParticipant {
  id
  tripId
  userId
  groupId
  role
  status
  joinedAt
  leftAt
  invitedById
}

fragment TripParticipantEdgeFields on TripParticipantEdge {
  cursor
  node {
    ...TripParticipantFields
  }
}

fragment TripParticipantConnectionFields on TripParticipantConnection {
  edges {
    ...TripParticipantEdgeFields
  }
  nodes {
    ...TripParticipantFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment TripResourceFields on TripResource {
  id
  tripId
  name
  description
  type
  url
  fileSize
  mimeType
  uploadedById
  uploadedAt
}

# ============================================
# QUERIES
# ============================================

query GetTrips($first: Int, $after: String) {
  trips(first: $first, after: $after) {
    ...TripConnectionFields
  }
}

query GetTrip($id: ID!) {
  trip(id: $id) {
    ...TripFields
  }
}

query GetTripParticipants($tripId: ID!, $first: Int, $after: String) {
  tripParticipants(tripId: $tripId, first: $first, after: $after) {
    ...TripParticipantConnectionFields
  }
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateTrip($input: CreateTripInput!) {
  createTrip(input: $input) {
    ...TripFields
  }
}

mutation UpdateTrip($id: ID!, $input: UpdateTripInput!) {
  updateTrip(id: $id, input: $input) {
    ...TripFields
  }
}

mutation DeleteTrip($id: ID!) {
  deleteTrip(id: $id) {
    success
    tripId
  }
}

mutation JoinTrip($input: JoinTripInput!) {
  joinTrip(input: $input) {
    ...TripParticipantFields
  }
}

mutation LeaveTrip($tripId: ID!) {
  leaveTrip(tripId: $tripId) {
    success
    tripId
  }
}

mutation InviteToTrip($input: InviteToTripInput!) {
  inviteToTrip(input: $input) {
    ...TripParticipantFields
  }
}

mutation UploadTripResource($input: UploadTripResourceInput!) {
  uploadTripResource(input: $input) {
    ...TripResourceFields
  }
}
