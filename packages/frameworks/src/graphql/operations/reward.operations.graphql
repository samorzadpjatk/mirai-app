# Reward Operations - Mirai App API
# GraphQL operations for Reward domain

# ============================================
# FRAGMENTS
# ============================================

fragment RewardFields on Reward {
  id
  tripId
  name
  description
  pointsCost
  quantityAvailable
  quantityTotal
  imageUrl
  status
  createdById
  createdAt
  updatedAt
}

fragment RewardEdgeFields on RewardEdge {
  cursor
  node {
    ...RewardFields
  }
}

fragment PageInfoFields on PageInfo {
  endCursor
  hasNextPage
  hasPreviousPage
  startCursor
}

fragment RewardConnectionFields on RewardConnection {
  edges {
    ...RewardEdgeFields
  }
  nodes {
    ...RewardFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

fragment RewardPurchaseFields on RewardPurchase {
  id
  rewardId
  userId
  groupId
  pointsSpent
  status
  notes
  purchasedAt
  redeemedAt
}

fragment RewardPurchaseEdgeFields on RewardPurchaseEdge {
  cursor
  node {
    ...RewardPurchaseFields
  }
}

fragment RewardPurchaseConnectionFields on RewardPurchaseConnection {
  edges {
    ...RewardPurchaseEdgeFields
  }
  nodes {
    ...RewardPurchaseFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

# ============================================
# QUERIES
# ============================================

query GetReward($id: ID!) {
  reward(id: $id) {
    ...RewardFields
  }
}

query GetRewardsByTrip($tripId: ID!, $first: Int, $after: String) {
  rewardsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...RewardConnectionFields
  }
}

query GetMyPurchaseHistory($first: Int, $after: String) {
  myPurchaseHistory(first: $first, after: $after) {
    ...RewardPurchaseConnectionFields
  }
}

query GetTotalAvailablePoints($tripId: ID!) {
  totalAvailablePoints(tripId: $tripId)
}

# ============================================
# MUTATIONS
# ============================================

mutation CreateReward($input: CreateRewardInput!) {
  createReward(input: $input) {
    ...RewardFields
  }
}

mutation UpdateReward($id: ID!, $input: UpdateRewardInput!) {
  updateReward(id: $id, input: $input) {
    ...RewardFields
  }
}

mutation DeleteReward($id: ID!) {
  deleteReward(id: $id)
}

mutation PurchaseReward($input: PurchaseRewardInput!) {
  purchaseReward(input: $input) {
    ...RewardPurchaseFields
  }
}

mutation RedeemReward($input: RedeemRewardInput!) {
  redeemReward(input: $input) {
    ...RewardPurchaseFields
  }
}

mutation CancelRewardPurchase($input: CancelRewardPurchaseInput!) {
  cancelRewardPurchase(input: $input) {
    ...RewardPurchaseFields
  }
}
