# File Operations - Mirai App API
# ============================================
# GraphQL operations for File/Storage domain
# ============================================

fragment FileDownloadPayloadFields on FileDownloadPayload {
  signedUrl
  expiresAt
}

fragment FileUploadPayloadFields on FileUploadPayload {
  signedUrl
  storagePath
  expiresAt
}

# Query to get a signed download URL for a file
# Used in: apps/web/src/hooks/useWebFileUpload.ts
query CreateDownloadUrl($input: CreateDownloadUrlInput!) {
  createDownloadUrl(input: $input) {
    ...FileDownloadPayloadFields
  }
}

# Mutation to create a signed upload URL for a file
# Used in: apps/web/src/hooks/useWebFileUpload.ts
mutation CreateUploadUrl($input: CreateUploadUrlInput!) {
  createUploadUrl(input: $input) {
    ...FileUploadPayloadFields
  }
}
