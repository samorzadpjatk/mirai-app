# =============================================================================
# Challenge Submission Queries
# =============================================================================

query MySubmissions($tripId: String!, $first: Int, $after: String) {
  mySubmissions(tripId: $tripId, first: $first, after: $after) {
    edges {
      node {
        id
        challengeId
        groupId
        status
        textContent
        imageIds
        videoId
        latitude
        longitude
        awardedPoints
        bonusPoints
        ranking
        voteCount
        voteScore
        createdAt
        reviewedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

