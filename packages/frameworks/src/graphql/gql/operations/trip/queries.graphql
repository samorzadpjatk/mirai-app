# =============================================================================
# Trip Queries
# =============================================================================

query MyTrips($first: Int, $after: String) {
  myTrips(first: $first, after: $after) {
    edges {
      node {
        id
        name
        description
        startDate
        endDate
        location
        image
        isActive
        createdAt
        updatedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query Trip($id: String!) {
  trip(id: $id) {
    id
    name
    description
    startDate
    endDate
    location
    image
    isActive
    groups {
      id
      name
      code
      image
      coins
      participantCount
      isDeleted
    }
    tripSponsors {
      id
      tripId
      sponsorId
      sponsor {
        id
        name
        logoPath
        description
        isActive
      }
    }
    participants {
      userId
      tripId
      wristNumber
      houseNumber
      user {
        id
        firstName
        lastName
        email
        role
      }
      group {
        id
        name
        code
        image
        coins
        participantCount
        isDeleted
      }
    }
    createdAt
    updatedAt
  }
}

