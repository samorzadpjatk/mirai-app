query TripResources($tripId: String!) {
  tripResources(tripId: $tripId) {
    resources {
      id
      tripId
      title
      description
      content
      iconName
      sortOrder
      createdAt
      updatedAt
    }
    insurance {
      id
      tripId
      title
      description
      provider
      policyNumber
      steps {
        id
        stepNumber
        title
        description
      }
      createdAt
      updatedAt
    }
  }
}
