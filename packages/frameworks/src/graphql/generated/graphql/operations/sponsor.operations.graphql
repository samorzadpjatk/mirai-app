# ============================================
# Sponsor Operations - Mirai App API
# ============================================
# This file contains all GraphQL operations for managing sponsors.
# Schema-based: Updated to match current schema.graphql definitions.
#
# Available Queries:
#   - sponsors(first, after) - returns SponsorConnection
#   - sponsorsByTrip(tripId, first, after) - returns TripSponsorConnection
#
# Types:
#   - Sponsor: contactEmail, contactPhone, createdAt, description, id, logoUrl, name, updatedAt, websiteUrl
#   - SponsorConnection: edges, nodes, pageInfo, totalCount
#   - TripSponsor: benefits, displayOrder, id, isActive, linkedAt, linkedById, sponsor, sponsorId, tier, tripId
#   - TripSponsorConnection: edges, nodes, pageInfo, totalCount
#
# Note: No mutations defined in current schema - add when schema includes them.

# ============================================
# FRAGMENTS
# ============================================

fragment SponsorFields on Sponsor {
  id
  name
  description
  logoUrl
  websiteUrl
  contactEmail
  contactPhone
  createdAt
  updatedAt
}

fragment SponsorEdgeFields on SponsorEdge {
  cursor
  node {
    ...SponsorFields
  }
}

fragment SponsorConnectionFields on SponsorConnection {
  edges {
    ...SponsorEdgeFields
  }
  nodes {
    ...SponsorFields
  }
  pageInfo {
    endCursor
    hasNextPage
    hasPreviousPage
    startCursor
  }
  totalCount
}

fragment TripSponsorFields on TripSponsor {
  id
  sponsorId
  tripId
  tier
  benefits
  displayOrder
  isActive
  linkedAt
  linkedById
  sponsor {
    ...SponsorFields
  }
}

fragment TripSponsorEdgeFields on TripSponsorEdge {
  cursor
  node {
    ...TripSponsorFields
  }
}

fragment TripSponsorConnectionFields on TripSponsorConnection {
  edges {
    ...TripSponsorEdgeFields
  }
  nodes {
    ...TripSponsorFields
  }
  pageInfo {
    endCursor
    hasNextPage
    hasPreviousPage
    startCursor
  }
  totalCount
}

# ============================================
# QUERIES
# ============================================

"""
Get all sponsors with pagination.
Returns a SponsorConnection with Relay-style pagination.
"""
query GetSponsors($first: Int, $after: String) {
  sponsors(first: $first, after: $after) {
    ...SponsorConnectionFields
  }
}

"""
Get all sponsors linked to a specific trip with pagination.
Returns a TripSponsorConnection with Relay-style pagination.
Each edge contains a TripSponsor which wraps the Sponsor entity.
"""
query GetSponsorsByTrip($tripId: ID!, $first: Int, $after: String) {
  sponsorsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...TripSponsorConnectionFields
  }
}
