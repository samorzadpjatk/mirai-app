# Event Operations
# GraphQL operations for managing events in the Mirai App API
#
# These operations align with the schema's Event type and queries:
# - Query.eventsByTrip(tripId, first, after)
# - Query.upcomingEventsByTrip(tripId, first, after)
# - Query.ongoingEventsByTrip(tripId, first, after)
# - Query.pastEventsByTrip(tripId, first, after)

# ============================================
# FRAGMENTS
# ============================================

# Core Event fields fragment
fragment EventFields on Event {
  id
  createdAt
  createdById
  description
  endTime
  groupId
  location
  maxParticipants
  startTime
  status
  title
  tripId
  type
  updatedAt
}

# Event connection edge fragment
fragment EventEdgeFields on EventEdge {
  cursor
  node {
    ...EventFields
  }
}

# PageInfo fragment for Relay pagination
fragment PageInfoFields on PageInfo {
  endCursor
  hasNextPage
  hasPreviousPage
  startCursor
}

# Event connection fragment
fragment EventConnectionFields on EventConnection {
  edges {
    ...EventEdgeFields
  }
  nodes {
    ...EventFields
  }
  pageInfo {
    ...PageInfoFields
  }
  totalCount
}

# ============================================
# QUERIES
# ============================================

# Get all events by trip with Relay pagination
query GetEventsByTrip($tripId: ID!, $first: Int, $after: String) {
  eventsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...EventConnectionFields
  }
}

# Get upcoming events by trip (events that haven't started yet)
query GetUpcomingEventsByTrip($tripId: ID!, $first: Int, $after: String) {
  upcomingEventsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...EventConnectionFields
  }
}

# Get ongoing events by trip (events currently in progress)
query GetOngoingEventsByTrip($tripId: ID!, $first: Int, $after: String) {
  ongoingEventsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...EventConnectionFields
  }
}

# Get past events by trip (events that have ended)
query GetPastEventsByTrip($tripId: ID!, $first: Int, $after: String) {
  pastEventsByTrip(tripId: $tripId, first: $first, after: $after) {
    ...EventConnectionFields
  }
}
