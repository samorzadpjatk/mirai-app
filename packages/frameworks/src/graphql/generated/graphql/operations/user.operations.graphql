# User Operations
# Aligned with current schema - only queries that exist in schema.graphql

# Fragment for User fields - matching schema exactly
fragment UserFields on User {
  id
  authUserId
  avatarUrl
  bio
  birthDate
  createdAt
  dietaryRequirements
  email
  firstName
  groupId
  lastName
  medicalInfo
  nickname
  phone
  role
  shirtSize
  status
  updatedAt
}

# Fragment for UserEdge
fragment UserEdgeFields on UserEdge {
  cursor
  node {
    ...UserFields
  }
}

# Fragment for UserConnection
fragment UserConnectionFields on UserConnection {
  edges {
    ...UserEdgeFields
  }
  nodes {
    ...UserFields
  }
  pageInfo {
    endCursor
    hasNextPage
    hasPreviousPage
    startCursor
  }
  totalCount
}

# ============================================
# QUERIES - Only those defined in schema
# ============================================

# Get paginated list of users
query GetUsers($first: Int, $after: String) {
  users(first: $first, after: $after) {
    ...UserConnectionFields
  }
}

# Get paginated list of users filtered by role
query GetUsersByRole($role: String!, $first: Int, $after: String) {
  usersByRole(role: $role, first: $first, after: $after) {
    ...UserConnectionFields
  }
}
