# Activity Operations
# GraphQL operations for managing activities in the Mirai App API
#
# Import fragments from common.graphql:
#   - ActivityFields: Common fields for Activity type
#   - ActivityAdminFields: Admin info embedded in activities
#   - HiddenActivityFields: Hidden activity result fields
#   - ActivityFeedResultFields: Activity feed result with pagination
#   - ActivityFeedModerationResultFields: Activity feed moderation result
#   - ActivityCursorFields: Activity cursor for pagination
#   - PaginationInfoFields: Standard pagination info
#   - ModerationPaginationInfoFields: Moderation pagination info
#   - ToggleReactionResultFields: Toggle reaction result
#   - DeleteActivityResultFields: Delete activity result
#
# Fragments location: ../fragments/common.graphql

# ============================================
# QUERIES
# ============================================

# Get a single activity by ID
query GetActivity($id: ID!) {
  activity(id: $id) {
    ...ActivityFields
  }
}

# Get activities by trip with cursor-based pagination
# Note: Uses GetByTripInput internally (tripId, pageSize, cursor)
query GetActivitiesByTrip(
  $tripId: ID!
  $limit: Int
  $cursor: ActivityCursorInput
) {
  activitiesByTrip(
    input: { tripId: $tripId, pageSize: $limit, cursor: $cursor }
  ) {
    activities {
      ...ActivityFields
    }
    nextCursor {
      ...ActivityCursorFields
    }
    pagination {
      ...PaginationInfoFields
    }
  }
}

# Get activities for moderation (includes hidden activities)
# Note: Uses GetByTripModerationInput internally (tripId, page, pageSize)
query GetActivitiesByTripModeration(
  $tripId: ID!
  $page: Int
  $perPage: Int
  $includeHidden: Boolean
) {
  activitiesByTripModeration(
    input: { tripId: $tripId, page: $page, pageSize: $perPage }
  ) {
    activities {
      ...ActivityFields
    }
    pagination {
      ...ModerationPaginationInfoFields
    }
  }
}

# ============================================
# MUTATIONS
# ============================================

# Create a custom activity (admin only)
mutation CreateCustomActivity($input: CreateCustomActivityInput!) {
  createCustomActivity(input: $input) {
    ...ActivityFields
  }
}

# Create a rank change activity
mutation CreateRankChangeActivity($input: CreateRankChangeActivityInput!) {
  createRankChangeActivity(input: $input) {
    ...ActivityFields
  }
}

# Create a submission activity
mutation CreateSubmissionActivity($input: CreateSubmissionActivityInput!) {
  createSubmissionActivity(input: $input) {
    ...ActivityFields
  }
}

# Update an existing activity
# Note: Uses UpdateActivityInput (activityId, title, description, isPinned)
mutation UpdateActivity($input: UpdateActivityInput!) {
  updateActivity(input: $input) {
    ...ActivityFields
  }
}

# Delete an activity (admin only)
# Note: Returns DeleteActivityResult with success boolean
mutation DeleteActivity($id: ID!) {
  deleteActivity(input: { activityId: $id }) {
    ...DeleteActivityResultFields
  }
}

# Hide an activity
# Note: Returns HiddenActivityResult with hide metadata
mutation HideActivity($id: ID!, $reason: String) {
  hideActivity(input: { activityId: $id, reason: $reason }) {
    ...HiddenActivityFields
  }
}

# Unhide an activity
# Note: Returns Activity (not HiddenActivityResult)
mutation UnhideActivity($id: ID!) {
  unhideActivity(input: { activityId: $id }) {
    ...ActivityFields
  }
}

# Set activity pinned status
# Note: Uses SetPinnedInput (activityId, isPinned)
mutation SetActivityPinned($id: ID!, $isPinned: Boolean!) {
  setActivityPinned(input: { activityId: $id, isPinned: $isPinned }) {
    ...ActivityFields
  }
}

# Toggle a reaction on an activity
# Note: Uses ToggleReactionInput (activityId, reactionType)
mutation ToggleActivityReaction($activityId: ID!, $reaction: ReactionType!) {
  toggleActivityReaction(
    input: { activityId: $activityId, reactionType: $reaction }
  ) {
    ...ToggleReactionResultFields
  }
}
