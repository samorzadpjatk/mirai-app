# ============================================
# Common GraphQL Fragments - Mirai App API
# ============================================
# This file contains reusable fragments for all major types in the schema.
# Use these fragments to ensure consistent data fetching across queries.
#
# Usage: Import the fragments you need in your queries/mutations:
#   query GetUser($id: ID!) {
#     user(id: $id) {
#       ...UserFields
#     }
#   }

# ============================================
# USER FRAGMENTS
# ============================================

"""
All user fields including computed properties and role information.
Use for detailed user views, profiles, and admin user management.
"""
fragment UserFields on User {
  # Core identification
  id
  authUserId

  # Name fields
  firstName
  lastName
  fullName

  # Profile information
  hasAvatar
  role

  # Email verification status
  emailVerified

  # Activity timestamps
  createdAt
  lastSeenOn

  # Computed role flags
  isAdmin
  isModerator
}

"""
Minimal user fields for list displays and references.
Use when you only need basic identification.
"""
fragment UserSummaryFields on User {
  id
  firstName
  lastName
  fullName
  hasAvatar
}

"""
User fields for creation/update results.
These types omit lastSeenOn and role flags.
"""
fragment UserCreateResultFields on UserCreateResult {
  id
  authUserId
  firstName
  lastName
  fullName
  hasAvatar
  role
  createdAt
}

fragment UserUpdateResultFields on UserUpdateResult {
  id
  authUserId
  firstName
  lastName
  fullName
  hasAvatar
  role
  updatedAt
}

# ============================================
# TRIP FRAGMENTS
# ============================================

"""
All trip fields including status flags and dates.
Use for trip details, trip management, and listings.
"""
fragment TripFields on Trip {
  # Core identification
  id

  # Basic info
  name
  description

  # Trip dates
  startDate
  endDate

  # Status flags (computed from status enum)
  isActive
  isPlanning
  isCompleted
  isCancelled

  # Status enum
  status

  # Visual
  backgroundImagePath

  # Timestamps
  createdAt
  updatedAt
}

"""
Minimal trip fields for references and lists.
"""
fragment TripSummaryFields on Trip {
  id
  name
  description
  startDate
  endDate
  status
}

# ============================================
# GROUP FRAGMENTS
# ============================================

"""
All group fields including coins and status.
Use for group details, rankings, and management.
"""
fragment GroupFields on Group {
  # Core identification
