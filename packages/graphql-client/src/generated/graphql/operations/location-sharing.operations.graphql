# ============================================
# Location Sharing Operations - Mirai App API
# ============================================
# This file contains GraphQL operations for location sharing management.
#
# Queries:
#   - GetLocationSharingSettings: Get current user's location sharing settings
#   - GetSharedFriendLocations: Get friends' locations (direct array, not Relay-style)
#
# Mutations:
#   - UpdateLocationSharingSettings: Update location sharing settings
#   - AddSharedUser: Add a user to sharing list
#   - RemoveSharedUser: Remove a user from sharing list
# ============================================

#import "../fragments/common.graphql"

# ============================================
# LOCATION SHARING QUERIES
# ============================================

"""
Get current user's location sharing settings.
Returns: Sharing settings including enabled status and users to share with.
"""
query GetLocationSharingSettings {
  mySharingSettings {
    isSharingLocation
    usersToShareWith {
      ...SharingUserFields
    }
  }
}

"""
Get friends' locations.
Returns: Direct array of friend locations (not Relay-style connection).
"""
query GetSharedFriendLocations {
  friendsLocations {
    locations {
      id
      userId
      latitude
      longitude
      accuracy
      altitude
      heading
      speed
      isSharingLocation
      distanceKm
      timestamp
    }
    total
  }
}

# ============================================
# LOCATION SHARING MUTATIONS
# ============================================

"""
Update location sharing settings.
Requires: isSharingLocation boolean. Optional: userIdsToShareWith list.
Returns: Updated sharing settings.
"""
mutation SetLocationSharingSettings($input: UpdateSharingSettingsInput!) {
  updateSharingSettings(input: $input) {
    settings {
      isSharingLocation
      usersToShareWith {
        ...SharingUserFields
      }
    }
  }
}

"""
Add a user to location sharing list.
Requires: userId to add.
Returns: Location with updated sharing list.
"""
mutation AddSharedUser($input: AddSharingUserInput!) {
  addUserToSharing(input: $input) {
    location {
      id
      userId
      latitude
      longitude
      isSharingLocation
      usersToShareWith {
        ...SharingUserFields
      }
      timestamp
    }
  }
}

"""
Remove a user from location sharing list.
Requires: userId to remove.
Returns: Location with updated sharing list.
"""
mutation RemoveSharedUser($input: RemoveSharingUserInput!) {
  removeUserFromSharing(input: $input) {
    location {
      id
      userId
      latitude
      longitude
      isSharingLocation
      usersToShareWith {
        ...SharingUserFields
      }
      timestamp
    }
  }
}
