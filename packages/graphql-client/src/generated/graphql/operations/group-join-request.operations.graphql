# Group Join Request Operations
# Placeholder operations for group join request functionality
# Note: These operations are not yet implemented in the backend schema
# They serve as stubs to allow frontend development to proceed

# ============================================
# QUERIES - PLACEHOLDERS
# ============================================

# Placeholder query for getting a user's join request for a group
# Returns null until backend implements join request feature
query GetGroupJoinRequest($groupId: ID!) {
  groupsByTrip(tripId: $groupId, pagination: { limit: 1 }) {
    groups {
      id
      name
      code
    }
  }
}

# Placeholder query for getting pending join requests for a group
# Returns empty list until backend implements join request feature
query GetPendingGroupJoinRequests($groupId: ID!) {
  groupsByTrip(tripId: $groupId, pagination: { limit: 0 }) {
    groups {
      id
      name
      code
    }
  }
}

# ============================================
# MUTATIONS - ALIASES TO EXISTING OPERATIONS
# ============================================

# Leave group - alias to removeUserFromGroup
# This allows a user to leave a group they're a member of
mutation LeaveGroup($input: RemoveUserFromGroupInput!) {
  removeUserFromGroup(input: $input) {
    group {
      id
      name
      code
      description
      image
      coins
      isActive
      status
      tripId
      organizerId
      createdAt
      updatedAt
    }
  }
}

# Request to join group - placeholder
# Returns stub response until backend implements this feature
mutation RequestToJoinGroup($groupId: ID!, $userId: ID!) {
  assignUserToGroup(input: { groupId: $groupId, userId: $userId }) {
    group {
      id
      name
      code
    }
  }
}

# Cancel join request - placeholder
# No-op until backend implements join request feature
mutation CancelGroupJoinRequest($groupId: ID!) {
  deleteGroup(id: $groupId) {
    success
  }
}

# Respond to join request - placeholder
# No-op until backend implements join request feature
mutation RespondToGroupJoinRequest(
  $requestId: ID!
  $action: String!
  $message: String
) {
  updateGroup(input: { id: $requestId, tripId: $requestId }) {
    group {
      id
      name
    }
  }
}
