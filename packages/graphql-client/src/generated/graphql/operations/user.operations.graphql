# User Operations
# Comprehensive operations for user management

# Import fragments
#import "../fragments/common.graphql"

# ============================================
# QUERIES
# ============================================

# Get a user by ID (returns extended user info)
query GetUser($id: ID!) {
  user(id: $id) {
    ...UserFields
  }
}

# Get the currently authenticated user (me query)
query GetCurrentUser {
  me {
    ...UserFields
  }
}

# Get list of users with optional pagination (admin only)
query GetUsers($limit: Int = 20, $offset: Int = 0) {
  users(limit: $limit, offset: $offset) {
    ...UserFields
  }
}

# ============================================
# MUTATIONS
# ============================================

# Create a new user (admin only)
mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    ...UserCreateResultFields
  }
}

# Update an existing user's profile
mutation UpdateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    ...UserUpdateResultFields
  }
}
