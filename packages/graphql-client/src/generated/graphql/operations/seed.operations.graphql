# Seed Operations - Mirai App API
# GraphQL operations for the seed app (service-to-service)
#
# NOTE: Many seed operations (upsertTrip, upsertUser, addTripParticipant)
# are implemented as raw GraphQL queries in the seed app itself since they
# require admin/service-role access that isn't exposed in the public schema.
#
# The operations below are the ones that use the standard public GraphQL API.

# ============================================
# SPONSOR OPERATIONS
# ============================================

# Create sponsor
mutation SeedCreateSponsor(
  $name: String!
  $description: String!
  $logoPath: String!
  $height: Int
  $offsetX: Int
  $offsetY: Int
) {
  createSponsor(
    input: {
      name: $name
      description: $description
      logoPath: $logoPath
      height: $height
      offsetX: $offsetX
      offsetY: $offsetY
    }
  ) {
    sponsor {
      id
      name
      description
      logoPath
      createdAt
    }
  }
}

# Link sponsor to trip
mutation SeedLinkSponsorToTrip($sponsorId: ID!, $tripId: ID!) {
  linkSponsorToTrip(input: { sponsorId: $sponsorId, tripId: $tripId }) {
    linked
    sponsorId
    tripId
  }
}

# ============================================
# REWARD OPERATIONS
# ============================================

# Create reward
mutation SeedCreateReward(
  $tripId: ID!
  $name: String!
  $description: String!
  $availableQuantity: Int!
  $coinCost: Int!
  $images: [String!]
  $isHidden: Boolean
) {
  createReward(
    input: {
      tripId: $tripId
      name: $name
      description: $description
      availableQuantity: $availableQuantity
      coinCost: $coinCost
      images: $images
      isHidden: $isHidden
    }
  ) {
    reward {
      id
      tripId
      name
      description
      coinCostPercentage
      availableQuantity
      images
      isHidden
      createdAt
    }
  }
}
