# File Operations
# Create upload and download URLs for file storage

# Mutation to create a signed upload URL
mutation CreateUploadUrl($input: CreateUploadUrlInput!) {
  createUploadUrl(input: $input) {
    ...UploadUrlResultFields
  }
}

# Query to create a signed download URL
query CreateDownloadUrl($input: CreateDownloadUrlInput!) {
  createDownloadUrl(input: $input) {
    ...DownloadUrlResultFields
  }
}
