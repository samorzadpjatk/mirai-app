# Challenge Voting Subscriptions
# GraphQL subscriptions for real-time voting progress updates
# ============================================

# Subscribe to voting progress updates for a challenge
# Emits when votes are submitted or voting status changes
subscription ChallengeVotingUpdated($challengeId: ID!) {
  challengeVotingUpdated(challengeId: $challengeId) {
    challengeId
    totalVotes
    uniqueVoters
    submissions {
      submissionId
      voteCount
      voteScore
      rank
    }
    isComplete
    endsAt
    updatedAt
  }
}
