# Location Subscriptions
# GraphQL subscriptions for real-time friend location updates
# ============================================

# Subscribe to location updates from specific users
# Emits when any of the specified users update their location
subscription LocationUpdated($userIds: [ID!]!) {
  locationUpdated(userIds: $userIds) {
    id
    userId
    latitude
    longitude
    accuracy
    altitude
    heading
    speed
    isSharingLocation
    distanceKm
    timestamp
  }
}
