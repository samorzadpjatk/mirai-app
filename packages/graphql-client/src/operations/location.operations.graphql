# ============================================
# Location Operations - Mirai App API
# ============================================
# This file contains GraphQL operations for location sharing.
# These operations use inline field selections matching the source files.
#
# Source files:
#   - apps/native/src/stores/location/LocationStoreProvider.tsx
#   - apps/native/src/hooks/map/useMapLocationStream.ts
# ============================================

"""
Get current user's location sharing settings.
Source: LocationStoreProvider.tsx
Returns: Sharing settings including enabled status and users to share with.
"""
query GetMySharingSettings {
  mySharingSettings {
    isSharingLocation
    usersToShareWith {
      id
      firstName
      lastName
    }
  }
}

"""
Update location sharing settings.
Source: LocationStoreProvider.tsx
Returns: Updated sharing settings with user list.
"""
mutation UpdateLocationSharing($input: UpdateSharingSettingsInput!) {
  updateLocationSharing(input: $input) {
    id
    isSharingLocation
    usersToShareWith {
      id
      firstName
      lastName
    }
  }
}

"""
Get friends' locations with filtering options.
Source: useMapLocationStream.ts
Returns: Connection of friend locations with user details.
"""
query FriendsLocations(
  $connectionId: String
  $radiusKm: Float
  $latitude: Float
  $longitude: Float
) {
  friendsLocations(
    connectionId: $connectionId
    radiusKm: $radiusKm
    latitude: $latitude
    longitude: $longitude
  ) {
    edges {
      node {
        id
        userId
        latitude
        longitude
        accuracy
        altitude
        heading
        speed
        isSharingLocation
        distanceKm
        timestamp
        user {
          id
          firstName
          lastName
          fullName
          hasAvatar
        }
      }
    }
  }
}
