<!--
  Storybook Preview Head

  This file is injected into the <head> of the Storybook preview iframe.
  It loads Tamagui CSS and ensures proper styling for components.

  @see https://storybook.js.org/docs/configure/story-rendering#adding-to-head
-->

<!--
  Tamagui CSS Variables
  These CSS variables are generated by Tamagui at runtime and are required
  for proper theme token resolution.

  Note: The actual CSS will be injected by TamaguiProvider when components
  render. This file ensures the foundation is ready.
-->
<style>
  /* Reset styles for consistent rendering */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  /* Base styles for the preview iframe */
  html,
  body {
    margin: 0;
    padding: 0;
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Ensure full height for stories */
  #storybook-root {
    min-height: 100vh;
  }

  /*
    Tamagui CSS Variable Placeholders
    These will be populated by TamaguiProvider at runtime
  */
  :root {
    /* Color tokens - populated by Tamagui */
    --color: initial;
    --background: initial;
    --backgroundHover: initial;
    --backgroundPress: initial;
    --backgroundFocus: initial;
    --borderColor: initial;
    --borderColorHover: initial;
    --borderColorPress: initial;
    --borderColorFocus: initial;

    /* Typography tokens */
    --fontSize: initial;
    --lineHeight: initial;
    --letterSpacing: initial;
    --fontWeight: initial;

    /* Spacing tokens */
    --space: initial;
    --size: initial;
    --radius: initial;
    --zIndex: initial;

    /* Transition defaults */
    --animation: initial;
  }

  /* Dark theme CSS variables placeholder */
  .t_dark {
    --color: initial;
    --background: initial;
    --backgroundHover: initial;
    --backgroundPress: initial;
    --backgroundFocus: initial;
    --borderColor: initial;
    --borderColorHover: initial;
    --borderColorPress: initial;
    --borderColorFocus: initial;
  }

  /* Light theme CSS variables placeholder */
  .t_light {
    --color: initial;
    --background: initial;
    --backgroundHover: initial;
    --backgroundPress: initial;
    --backgroundFocus: initial;
    --borderColor: initial;
    --borderColorHover: initial;
    --borderColorPress: initial;
    --borderColorFocus: initial;
  }
</style>

<!--
  Font Loading
  Space Grotesk and Inter fonts are used by Tamagui.
  These are loaded from Google Fonts CDN.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<!--
  React Native Web Setup
  Ensures react-native-web is properly initialized
-->
<script>
  // Polyfill for react-native-web in browser environment
  if (typeof global === "undefined") {
    window.global = window;
  }

  // Ensure process.env exists (required by some RNW internals)
  if (typeof window.process === "undefined") {
    window.process = { env: {} };
  }
</script>
