# Submission Report Operations
# GraphQL operations for managing submission reports (moderation and content review)

# Import fragments from common.graphql
# Fragment imports are resolved by the GraphQL code generator

# ============================================
# QUERIES
# ============================================

# Get all reports filed against a specific submission
# Use for moderation and reviewing reports on a submission
query GetSubmissionReports($submissionId: ID!) {
  submissionReports(submissionId: $submissionId) {
    reports {
      ...SubmissionReportFields
    }
    totalCount
  }
}

# ============================================
# MUTATIONS
# ============================================

# Create a new submission report
# Use when a user wants to report inappropriate or problematic content
mutation CreateSubmissionReport($input: CreateReportInput!) {
  createSubmissionReport(input: $input) {
    ...SubmissionReportCreateResultFields
  }
}
