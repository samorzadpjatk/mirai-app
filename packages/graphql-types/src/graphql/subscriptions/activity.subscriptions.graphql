# Activity Feed Subscriptions
# GraphQL subscriptions for real-time activity feed updates
# ============================================

# Subscribe to new activities in a trip feed
# Emits when a new activity is created in the specified trip
subscription ActivityFeedUpdated($tripId: ID!) {
  activityFeedUpdated(tripId: $tripId) {
    id
    tripId
    title
    description
    imageUrl
    activityType
    isPinned
    isHidden
    admin {
      id
      firstName
      lastName
    }
    createdAt
    updatedAt
  }
}
