services:
  dev-web-app:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "11001:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/web/.env

  prod-web-app:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "11000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./apps/web/.env
