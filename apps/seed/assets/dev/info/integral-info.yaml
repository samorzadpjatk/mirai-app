# Trip Info content for INTEGRAL 2026 (Ośrodek Kacze Stawy, Łeba, 16-20.09.2026).
#
# Every value marked with "TODO(integral)" is a placeholder that only the
# organisers can fill in. Do not invent them — the screen degrades gracefully
# when a resource is missing, but a wrong link or a wrong emergency contact is
# worse than none.
#
# `storagePath` is the file's location inside apps/seed/assets/dev/, not the
# storage reference: `public/` is the asset directory whose bucket is called
# `files-public`. The seeder resolves the pair and persists `bucket/object`,
# which is the only form the app can download (see utils/storagePath.ts).

resources:
  - type: hero_image
    label: "INTEGRAL 2026"
    storagePath: "images/trips/integral/hero-bg.png"
    sortOrder: 0

  # Infopack od organizatorów (Canva, 18 stron A4): podział na floty, plan
  # wyjazdu i lista rzeczy do spakowania. Oryginał ważył 25 MB, w repo leży
  # wersja przepuszczona przez Ghostscript (/ebook, 150 dpi, 1,1 MB) — kafelek
  # pobiera plik na telefon, więc oryginał byłby nie do przyjęcia w terenie.
  - type: infopack
    label: "Infopack"
    description: "Podział na floty, plan wyjazdu i lista rzeczy do spakowania."
    storagePath: "public/integral/Integral2026-Infopack.pdf"
    fileName: "Integral2026-Infopack"
    iconName: "book"
    sortOrder: 1

  - type: whatsapp
    label: "Załoga (WhatsApp)"
    description: "Grupa wyjazdowa — ogłoszenia kadry i bieżące ustalenia."
    url: "https://chat.whatsapp.com/C8fsg6nLgcZ4iUKkjbRdTp"
    iconName: "boat"
    sortOrder: 2

  # Kafelek dzwoni pod `value`; `description` to wersja do wyświetlenia, więc
  # obie wartości trzeba podmienić razem.
  # TODO(integral): wstaw numer dyżurny kadry zamiast zaślepki.
  - type: contact
    label: "Kontakt"
    description: "+48 000 000 000"
    iconName: "call"
    value: "+48000000000"
    sortOrder: 3

# Mapa ośrodka wróci tutaj, gdy organizatorzy dostarczą plan Kaczych Stawów.
