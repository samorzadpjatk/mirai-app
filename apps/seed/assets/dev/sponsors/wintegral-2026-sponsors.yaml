- id: partner-1
  name: Orange
  description: |
    Orange to jedna z największych sieci telekomunikacyjnych w Polsce, dostarczająca usługi mobilne, stacjonarne i internetowe dla milionów klientów. Firma od lat wspiera inicjatywy edukacyjne i społeczne, inwestując w rozwój technologii i cyfryzację kraju.

    Orange wspiera Samorząd Przyszłości PJATK, dostarczając infrastrukturę telekomunikacyjną niezbędną do realizacji projektów oraz wspierając inicjatywy związane z technologiami mobilnymi i komunikacją cyfrową.

    Dziękujemy Orange za wsparcie i wiarę w potencjał młodych twórców technologii!
  logoPath: images/sponsors/orange.png
  height: 18

- id: partner-2
  name: AiSECLAB - AI-driven cybersecurity
  description: |
    AiSECLAB to polska firma tworząca zaawansowane oprogramowanie z obszaru cyberbezpieczeństwa. Wykorzystuje sztuczną inteligencję do wykrywania zagrożeń, analizy ryzyka i ochrony systemów informatycznych i kontroli wycieku treści w czasie rzeczywistym. Z systemów AiSECLAB korzystają m.in. Policja Polska, Mattel, NASK PIB

    AiSECLAB już drugi rok z rzędu wspiera Samorząd Przyszłości PJATK! W ubiegłym i w tym roku firma w całości sfinansowała zakup kamizelek narciarskich dla uczestników wyjazdu. Dzięki nim możemy poczuć się jako jedna społeczność i zawsze znajdziemy się na stoku.

    A to nie koniec współpracy — w semestrze letnim na PJATK odbędą się wyjątkowe wykłady i warsztaty prowadzone przez ekspertów AiSECLAB, poświęcone zastosowaniu sztucznej inteligencji w cyberbezpieczeństwie.

    Dziękujemy AiSECLAB za ciągłą współpracę i wsparcie społeczności studenckiej PJATK!
  logoPath: images/sponsors/aiseclab.png
  height: 30

- id: partner-3
  name: Netcompany
  description: |
    Netcompany to międzynarodowa firma IT z siedzibą w Kopenhadze, będąca jednym z liderów cyfrowej transformacji w Europie. Dostarcza kompleksowe rozwiązania technologiczne dla sektora publicznego i prywatnego, zatrudniając ponad 7 800 specjalistów w ponad 12 krajach.

    Netcompany obdarzyło nas swoim zaufaniem, stając się oficjalnym Sponsorem Samorządu Przyszłości PJATK i wspierając liczne inicjatywy, które ujrzą światło dzienne w semestrze letnim. Na wyjazd WINTEGRAL Netcompany ufundowało nagrody dla zwycięzców konkursów w aplikacji, a oprócz tego dofinansowało uczestnikom wyjście na Zipline, Fondue Evening oraz Raclette — czyli najbardziej wyczekiwane atrakcje tego wyjazdu!

    Dziękujemy Netcompany za zaufanie i wiarę w to, co robimy!
  logoPath: images/sponsors/netcompany.png
  offsetX: -5
  offsetY: 3

- id: partner-4
  name: Comtegra
  description: |
    Comtegra to polska firma z ponad 25-letnim doświadczeniem w integracji systemów IT, specjalizująca się w budowie i utrzymaniu zaawansowanej infrastruktury informatycznej. W swojej ofercie łączy rozwiązania z zakresu cloud computingu, cyberbezpieczeństwa, zarządzania danymi oraz sztucznej inteligencji. Obsługują zarówno biznes, jak i instytucje naukowe.

    Od listopada 2024 roku Comtegra wspiera Samorząd Przyszłości PJATK, udostępniając platformę Comtegra Enterprise Cloud. Tym samym dostarczając infrastrukturę informatyczną niezbędną do realizacji projektów badawczych oraz narzędzia napędzające codzienne działania samorządu. To wsparcie realnie przekłada się na jakość i skalę tego, co tworzymy dla naszej społeczności.

    Dziękujemy Comtegrze za zaufanie i nieocenione wsparcie technologiczne!
  logoPath: images/sponsors/comtegra.png
  offsetY: 3
