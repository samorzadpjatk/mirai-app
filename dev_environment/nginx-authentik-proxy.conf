server {
    listen 9001;
    server_name localhost;

    # Rewrite Keycloak-style URLs to Authentik URLs
    # Keycloak: /application/o/pjapp-dev/protocol/openid-connect/auth -> Authentik: /application/o/authorize/
    location ~ ^/application/o/pjapp-dev/protocol/openid-connect/auth {
        rewrite ^/application/o/pjapp-dev/protocol/openid-connect/auth(.*)$ /application/o/authorize/$1 break;
        proxy_pass http://authentik-server:9000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak: /application/o/pjapp-dev/protocol/openid-connect/token -> Authentik: /application/o/token/
    location ~ ^/application/o/pjapp-dev/protocol/openid-connect/token {
        rewrite ^/application/o/pjapp-dev/protocol/openid-connect/token(.*)$ /application/o/token/$1 break;
        proxy_pass http://authentik-server:9000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak: /application/o/pjapp-dev/protocol/openid-connect/userinfo -> Authentik: /application/o/userinfo/
    location ~ ^/application/o/pjapp-dev/protocol/openid-connect/userinfo {
        rewrite ^/application/o/pjapp-dev/protocol/openid-connect/userinfo(.*)$ /application/o/userinfo/$1 break;
        proxy_pass http://authentik-server:9000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pass through .well-known/openid-configuration
    location ~ ^/application/o/pjapp-dev/.well-known/openid-configuration {
        proxy_pass http://authentik-server:9000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pass through everything else to Authentik
    location / {
        proxy_pass http://authentik-server:9000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
