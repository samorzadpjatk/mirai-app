# =============================================================================
# PJApp Environment - Development
# =============================================================================
#
# This Docker Compose configuration provides a complete local development
# environment with:
#   - PostgreSQL: Main database (Drizzle ORM)
#   - Redis: Session storage for Better-Auth
#   - SeaweedFS: S3-compatible object storage
#   - Backend Server: Hono + Pothos GraphQL + Better-Auth
#   - Notification Sender: Background job processor
#   - Web: Astro SSR frontend
#   - Mailpit: Email testing
#
# Tech Stack:
#   - Database: PostgreSQL 15 with Drizzle ORM
#   - Auth: Better-Auth (built into backend-server)
#   - Storage: SeaweedFS
#   - Cache/Sessions: Redis
#   - API: GraphQL (Pothos + Yoga) on Hono
#
# Usage:
#   Start:           docker compose up -d
#   Stop:            docker compose down
#   View logs:       docker compose logs -f
#   Check status:    docker compose ps
#
# Prerequisites:
#   - Copy .env.dev to .env and configure values
# =============================================================================

name: pjapp

services:
  # ===========================================================================
  # DATABASE
  # ===========================================================================

  db:
    container_name: pjapp-db
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./volumes/db/init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pjapp}
      PGDATA: /var/lib/postgresql/data/pgdata

  # ===========================================================================
  # CACHE & SESSION STORE
  # ===========================================================================

  redis:
    container_name: pjapp-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # OBJECT STORAGE (SeaweedFS - replaces MinIO)
  # ===========================================================================

  seaweedfs:
    container_name: pjapp-seaweedfs
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"  # S3 API
      - "${SEAWEEDFS_WEB_PORT:-8888}:8888"  # Filer UI
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-volumes:/weed/volumes
    command: >
      server -s3
      -s3.port=8333
      -volume.max=30
      -master.volumeSizeLimitMB=1024
      -filer
      -filer.port=8888
      -filer.maxMB=4
      -ip=seaweedfs
      -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  seaweedfs-init:
    container_name: pjapp-seaweedfs-init
    image: chrislusf/seaweedfs:latest
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-pjapp-uploads}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Initializing SeaweedFS bucket..."
        # Create bucket using S3 API
        curl -X PUT http://seaweedfs:8333/${SEAWEEDFS_BUCKET:-pjapp-uploads} || true
        echo "Bucket initialization complete"

  # ===========================================================================
  # EMAIL TESTING
  # ===========================================================================

  mailpit:
    container_name: pjapp-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"  # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================

  db-migrations:
    container_name: pjapp-db-migrations
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        PACKAGE: db-migrations
        PORT: "3000"
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pjapp}
    depends_on:
      db:
        condition: service_healthy
    command: ["./app", "migrate"]

  backend-server:
    container_name: pjapp-backend-server
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        PACKAGE: backend-server
        PORT: "2022"
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-2022}:2022"
    environment:
      PORT: "2022"
      HOST: "0.0.0.0"
      NODE_ENV: "development"
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pjapp}
      # Redis (for Better-Auth sessions)
      REDIS_URL: redis://redis:6379
      # Storage
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-pjapp-uploads}
      # Auth (Better-Auth)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-min-32-chars}
      BETTER_AUTH_URL: http://localhost:${BACKEND_PORT:-2022}
      # Email
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-dev@pjapp.local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  notification-sender:
    container_name: pjapp-notification-sender
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        PACKAGE: notification-sender
        PORT: "3011"
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_PORT:-3011}:3011"
    environment:
      PORT: "3011"
      HOST: "0.0.0.0"
      NODE_ENV: "development"
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pjapp}
      # Redis
      REDIS_URL: redis://redis:6379
      # Backend connection
      BACKEND_URL: http://backend-server:2022
      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-min-32-chars}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-server:
        condition: service_started

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  web:
    container_name: pjapp-web
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-2022}
        PUBLIC_GRAPHQL_URL: http://localhost:${BACKEND_PORT:-2022}/graphql
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4321}:4321"
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: "development"
    depends_on:
      backend-server:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  seaweedfs-volumes:
