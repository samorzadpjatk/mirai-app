<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Twój kod logowania — MIRAI</title>
  </head>
  <body style="margin:0; padding:0; background-color:#17181c; font-family:'IBM Plex Sans', system-ui, Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif; color:#ffffff; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse; margin:0; padding:0; background-color:#17181c;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="680" style="border-collapse:collapse; max-width:680px; width:100%; border:1px solid #272935; border-radius:12px; background-color:#1b2828;">
            <tr>
              <td style="padding:24px;">
                <!-- Header -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                  <tr>
                    <td style="padding-bottom:24px;">
                      <h1 style="margin:0; font-size:20px; font-weight:600; color:#ffffff; line-height:1.3;">Twój 6-cyfrowy kod</h1>
                      <p style="margin:4px 0 0 0; color:#9ca3af; font-size:14px; line-height:1.5;">Zaloguj się bez hasła</p>
                    </td>
                  </tr>
                </table>

                <!-- Content -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                  <tr>
                    <td style="padding-bottom:16px;">
                      <p style="margin:0 0 16px 0; color:#9ca3af; font-size:14px; line-height:1.5;">
                        Użyj poniższego 6-cyfrowego kodu OTP, aby zalogować się na konto w aplikacji MIRAI:
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-bottom:16px;">
                      <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                        <tr>
                          <td style="background-color:#272935; border:1px solid #00ced1; border-radius:8px; padding:16px 20px; text-align:center;">
                            <span style="font-size:24px; font-weight:700; color:#00ced1; letter-spacing:4px; line-height:1; font-family:'IBM Plex Sans', system-ui, Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif;">{{ .Token }}</span>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-bottom:16px;">
                      <p style="margin:0; color:#9ca3af; font-size:14px; line-height:1.5;">
                        Wprowadź kod w aplikacji, gdy zostaniesz o to poproszony — kod wygaśnie w krótkim czasie.
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p style="margin:0; color:#64748b; font-size:14px; line-height:1.5;">
                        Jeśli nie prosiłeś o logowanie, zignoruj tę wiadomość.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
