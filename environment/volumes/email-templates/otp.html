<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Twój kod logowania — MIRAI</title>
    <style>
      :root {
        --primary: #00ced1;
        --bg: #ffffff;
        --text: #101018;
        --muted: #6b7280;
      }
      body {
        background: var(--bg);
        margin: 0;
        font-family:
          "IBM Plex Sans",
          system-ui,
          Segoe UI,
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: var(--text);
      }
      .container {
        max-width: 680px;
        margin: 32px auto;
        padding: 24px;
        border-radius: 8px;
        border: 1px solid #e6e9ee;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .title {
        font-size: 20px;
        margin: 0;
      }
      .hero {
        margin: 24px 0;
      }
      .btn {
        display: inline-block;
        padding: 12px 20px;
        background: var(--primary);
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      p {
        line-height: 1.5;
        color: var(--muted);
      }
      .otp {
        display: inline-block;
        padding: 10px 14px;
        background: #f3f6f8;
        border-radius: 8px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 2px;
      }
      @media (max-width: 480px) {
        .container {
          margin: 16px;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <h1 class="title">Twój 6-cyfrowy kod</h1>
          <p style="margin: 0; color: var(--muted)">Zaloguj się bez hasła</p>
        </div>
      </div>

      <div class="hero">
        <p>
          Użyj poniższego 6-cyfrowego kodu OTP, aby zalogować się na konto w
          aplikacji MIRAI:
        </p>
        <p style="margin: 20px 0">
          <span
            class="otp"
            style="font-size: 24px; padding: 16px 20px; letter-spacing: 4px"
            >{{ .Token }}</span
          >
        </p>
        <p>
          Wprowadź kod w aplikacji, gdy zostaniesz o to poproszony — kod
          wygaśnie w krótkim czasie.
        </p>
        <p class="footer">
          Jeśli nie prosiłeś o logowanie, zignoruj tę wiadomość.
        </p>
      </div>
    </div>
  </body>
</html>
