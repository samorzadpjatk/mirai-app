# =============================================================================
# PJApp Environment - Production
# =============================================================================
#
# Production Docker Compose configuration with:
#   - PostgreSQL: Main database
#   - Redis: Session storage and caching
#   - SeaweedFS: S3-compatible object storage
#   - Backend Server: GraphQL API with Better-Auth
#   - Notification Sender: Background job processor
#   - Web: Astro SSR frontend
#   - Watchtower: Automatic container updates
#
# Tech Stack:
#   - Database: PostgreSQL 15 with Drizzle ORM
#   - Auth: Better-Auth (built into backend-server)
#   - Storage: SeaweedFS
#   - Cache/Sessions: Redis
#   - API: GraphQL (Pothos + Yoga) on Hono
#
# Usage:
#   Start:           docker compose up -d
#   Stop:            docker compose down
#   View logs:       docker compose logs -f
#   Update:          docker compose pull && docker compose up -d
#
# Prerequisites:
#   - Copy .env.example to .env and set secure values
#   - Configure external SMTP server
#   - Set up SSL/TLS termination (recommended: reverse proxy)
# =============================================================================

name: pjapp

services:
  # ===========================================================================
  # DATABASE
  # ===========================================================================

  db:
    container_name: pjapp-db
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./volumes/db/init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pjapp}
    command:
      - postgres
      - -c
      - log_min_messages=warning
      - -c
      - log_connections=on

  # ===========================================================================
  # CACHE & SESSION STORE
  # ===========================================================================

  redis:
    container_name: pjapp-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # OBJECT STORAGE (SeaweedFS)
  # ===========================================================================

  seaweedfs:
    container_name: pjapp-seaweedfs
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-volumes:/weed/volumes
    command: >
      server -s3
      -s3.port=8333
      -volume.max=100
      -master.volumeSizeLimitMB=1024
      -filer
      -filer.port=8888
      -filer.maxMB=16
      -ip=seaweedfs
      -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  seaweedfs-init:
    container_name: pjapp-seaweedfs-init
    image: chrislusf/seaweedfs:latest
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-pjapp-uploads}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Initializing SeaweedFS bucket..."
        curl -X PUT http://seaweedfs:8333/${SEAWEEDFS_BUCKET:-pjapp-uploads} || true
        echo "Bucket initialization complete"

  # ===========================================================================
  # DATABASE MIGRATIONS
  # ===========================================================================

  db-migrations:
    image: ghcr.io/samorzadpjatk/pjapp-db-migrations:latest
    container_name: pjapp-db-migrations
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=db-migrations"
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pjapp}
    depends_on:
      db:
        condition: service_healthy
    command: ["./app", "migrate"]

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================

  backend-server:
    image: ghcr.io/samorzadpjatk/pjapp-backend-server:latest
    container_name: pjapp-backend-server
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=backend-services"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c 'echo Starting backend server update && sleep 10'"
      - "com.centurylinklabs.watchtower.lifecycle.post-update=/bin/sh -c 'echo Backend server updated'"
    ports:
      - "${BACKEND_PORT:-2022}:2022"
    environment:
      PORT: "2022"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pjapp}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Storage
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-pjapp-uploads}
      # Auth (Better-Auth)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_BACKEND_URL:-http://localhost:2022}
      # Email (production SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      # Admin roles
      ADMIN_ROLE: ${ADMIN_ROLE:-Admin}
      MODERATOR_ROLE: ${MODERATOR_ROLE:-Moderator}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  notification-sender:
    image: ghcr.io/samorzadpjatk/pjapp-notification-sender:latest
    container_name: pjapp-notification-sender
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=backend-services"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c 'echo Starting notification sender update && sleep 5'"
      - "com.centurylinklabs.watchtower.lifecycle.post-update=/bin/sh -c 'echo Notification sender updated'"
    ports:
      - "${NOTIFICATION_PORT:-3011}:3011"
    environment:
      PORT: "3011"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pjapp}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Backend connection
      BACKEND_URL: http://backend-server:2022
      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-server:
        condition: service_started

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  web:
    image: ghcr.io/samorzadpjatk/pjapp-web:latest
    container_name: pjapp-web
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=backend-services"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c 'echo Starting web update && sleep 5'"
      - "com.centurylinklabs.watchtower.lifecycle.post-update=/bin/sh -c 'echo Web updated'"
    ports:
      - "${WEB_PORT:-4321}:4321"
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: "production"
    depends_on:
      backend-server:
        condition: service_started

  # ===========================================================================
  # AUTO-UPDATE SERVICE (Watchtower)
  # ===========================================================================

  watchtower-db:
    image: containrrr/watchtower:latest
    container_name: pjapp-watchtower-db
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCOPE: "db-migrations"
      WATCHTOWER_SCHEDULE: "0 2 * * *"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
    command: --scope db-migrations --label-enable --cleanup --rolling-restart
    depends_on:
      - db-migrations

  watchtower-backend:
    image: containrrr/watchtower:latest
    container_name: pjapp-watchtower-backend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCOPE: "backend-services"
      WATCHTOWER_SCHEDULE: "0 3 * * *"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_TIMEOUT: "60s"
    command: --scope backend-services --label-enable --cleanup --rolling-restart --stop-timeout 60s
    depends_on:
      - watchtower-db

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  seaweedfs-volumes:
