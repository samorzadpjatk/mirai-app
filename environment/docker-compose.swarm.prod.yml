# =============================================================================
# PJApp Environment - Production (Docker Swarm)
# =============================================================================
#
# Docker Swarm compatible configuration with:
#   - PostgreSQL: Main database (runs on manager node)
#   - Redis: Session storage and caching
#   - SeaweedFS: S3-compatible object storage
#   - Backend Server: GraphQL API with Better-Auth
#   - Notification Sender: Background job processor
#   - Web: Astro SSR frontend
#
# Tech Stack:
#   - Database: PostgreSQL 15 with Drizzle ORM
#   - Auth: Better-Auth (built into backend-server)
#   - Storage: SeaweedFS
#   - Cache/Sessions: Redis
#   - API: GraphQL (Pothos + Yoga) on Hono
#
# Usage:
#   Deploy:          docker stack deploy -c docker-compose.swarm.prod.yml pjapp
#   Remove:          docker stack rm pjapp
#   View services:   docker service ls
#   View logs:       docker service logs -f pjapp_backend-server
#
# Prerequisites:
#   - Initialize Swarm:     docker swarm init
#   - Set environment variables in .env or use --env-file
#   - For production: docker swarm join to add worker nodes
# =============================================================================

services:
  # ===========================================================================
  # DATABASE (Manager node only for data consistency)
  # ===========================================================================

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pjapp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - log_min_messages=warning
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ===========================================================================
  # CACHE & SESSION STORE
  # ===========================================================================

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      replicas: 1

  # ===========================================================================
  # OBJECT STORAGE (SeaweedFS)
  # ===========================================================================

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - target: 8333
        published: ${SEAWEEDFS_S3_PORT:-8333}
        protocol: tcp
        mode: host
    environment:
      - WEED_MASTER_VOLUME_GROWTH_COPY_COUNT=1
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-volumes:/weed/volumes
    command: >
      server -s3
      -s3.port=8333
      -volume.max=100
      -master.volumeSizeLimitMB=1024
      -filer
      -filer.port=8888
      -filer.maxMB=16
      -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: any
        delay: 10s
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    restart: "no"
    environment:
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-pjapp-uploads}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Initializing SeaweedFS bucket..."
        curl -X PUT http://seaweedfs:8333/${SEAWEEDFS_BUCKET:-pjapp-uploads} || true
        echo "Bucket initialization complete"
    depends_on:
      - seaweedfs
    deploy:
      restart_policy:
        condition: none
        delay: 10s
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ===========================================================================
  # DATABASE MIGRATIONS
  # ===========================================================================

  db-migrations:
    image: ghcr.io/samorzadpjatk/pjapp-db-migrations:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pjapp}
    depends_on:
      - db
    command: ["./app", "migrate"]
    deploy:
      restart_policy:
        condition: none
        delay: 10s
        max_attempts: 5
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================

  backend-server:
    image: ghcr.io/samorzadpjatk/pjapp-backend-server:latest
    restart: unless-stopped
    ports:
      - target: 2022
        published: ${BACKEND_PORT:-2022}
        protocol: tcp
        mode: host
    environment:
      PORT: "2022"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pjapp}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Storage
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-pjapp-uploads}
      # Auth (Better-Auth)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_BACKEND_URL:-http://localhost:2022}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      # Admin roles
      ADMIN_ROLE: ${ADMIN_ROLE:-Admin}
      MODERATOR_ROLE: ${MODERATOR_ROLE:-Moderator}
    depends_on:
      - db
      - redis
      - seaweedfs
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  notification-sender:
    image: ghcr.io/samorzadpjatk/pjapp-notification-sender:latest
    restart: unless-stopped
    ports:
      - target: 3011
        published: ${NOTIFICATION_PORT:-3011}
        protocol: tcp
        mode: host
    environment:
      PORT: "3011"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pjapp}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Backend connection
      BACKEND_URL: http://backend-server:2022
      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      - db
      - redis
      - backend-server
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  web:
    image: ghcr.io/samorzadpjatk/pjapp-web:latest
    restart: unless-stopped
    ports:
      - target: 4321
        published: ${WEB_PORT:-4321}
        protocol: tcp
        mode: host
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: "production"
    depends_on:
      - backend-server
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  seaweedfs-data:
    driver: local
  seaweedfs-volumes:
    driver: local
