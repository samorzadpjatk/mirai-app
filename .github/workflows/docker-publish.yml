name: Build & Publish Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'apps/backend-server/**'
      - 'apps/notification-sender/**'
      - 'packages/db/**'
      - 'packages/auth/**'
      - 'packages/shared/**'
      - 'packages/orpc/**'
      - 'packages/supabase/**'
      - 'Dockerfile'
      - 'apps/*/Dockerfile'
      - 'packages/*/Dockerfile'
      - 'bun.lock'
      - 'package.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.dockerignore'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & push container images via Nx
        env:
          INPUT_PUSH: true
          INPUT_REGISTRY: ${{ env.REGISTRY }}
          INPUT_TAGS: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
        run: |
          bunx nx run-many -t container \
            --projects=apps/backend-server,apps/notification-sender,packages/db \
            --configuration=ci
