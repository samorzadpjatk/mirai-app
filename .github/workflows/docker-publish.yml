name: Build & Publish Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'apps/backend-server/**'
      - 'apps/notification-sender/**'
      - 'packages/db/**'
      - 'packages/auth/**'
      - 'packages/shared/**'
      - 'packages/orpc/**'
      - 'packages/supabase/**'
      - 'apps/*/Dockerfile'
      - 'packages/*/Dockerfile'
      - 'bun.lock'
      - 'package.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.dockerignore'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & push container images via Nx
        id: build
        env:
          INPUT_PUSH: true
          INPUT_REGISTRY: ${{ env.REGISTRY }}
          INPUT_TAGS: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx nx run-many -t container \
            --projects=apps/backend-server,apps/notification-sender \
            --configuration=ci

      - name: Generate Docker build summary
        if: always()
        run: |
          echo "## Docker Build & Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ env.REGISTRY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Images | backend-server, notification-sender |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | semver, latest |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "### ✅ Images Published" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.REGISTRY }}/${{ github.repository_owner }}/backend-server:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.REGISTRY }}/${{ github.repository_owner }}/notification-sender:latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "See step logs for build error details." >> $GITHUB_STEP_SUMMARY
            echo "::error::Docker build failed"
          fi
