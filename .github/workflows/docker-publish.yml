name: Build & Publish Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - package: backend-server
            image: pjapp-backend-server
            port: '2022'
          - package: notification-sender
            image: pjapp-notification-sender
            port: '3011'

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "publish_version=true" >> $GITHUB_OUTPUT
          else
            echo "publish_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=pjapp
          cache-to: type=gha,mode=max,scope=pjapp
          build-args: |
            PACKAGE=${{ matrix.package }}
            PORT=${{ matrix.port }}
          tags: |
            ${{ steps.version.outputs.publish_version == 'true' && format('{0}/{1}/{2}:{3}', env.REGISTRY, github.repository_owner, matrix.image, steps.version.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/{2}:latest', env.REGISTRY, github.repository_owner, matrix.image) || '' }}