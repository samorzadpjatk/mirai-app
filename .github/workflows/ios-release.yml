name: iOS Release (Fastlane)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monorepo_tagging:
    name: Run monorepo tagging
    uses: ./.github/workflows/monorepo-tagging.yml
    secrets: inherit

  build:
    name: Build iOS release
    runs-on: macos-26
    needs: [monorepo_tagging]
    defaults:
      run:
        working-directory: apps/native
    outputs:
      version: ${{ steps.current_semver.outputs.release }}
      classification: ${{ steps.routing.outputs.classification }}
      submit_internal: ${{ steps.routing.outputs.submit_internal }}
      submit_external: ${{ steps.routing.outputs.submit_external }}
      submit_production: ${{ steps.routing.outputs.submit_production }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Set working directory explicitly
        run: echo "WORKDIR=${GITHUB_WORKSPACE}/apps/native" >> $GITHUB_ENV

      - name: Record release tag metadata
        run: |
          echo "RELEASE_TAG=${{ needs.monorepo_tagging.outputs.semver_tag }}" >> "$GITHUB_ENV"
          echo "PREVIOUS_RELEASE_TAG=${{ needs.monorepo_tagging.outputs.previous_tag }}" >> "$GITHUB_ENV"
          echo "TAG_CREATED=${{ needs.monorepo_tagging.outputs.tag_created }}" >> "$GITHUB_ENV"
          echo "TAG_REFRESHED=${{ needs.monorepo_tagging.outputs.tag_refreshed }}" >> "$GITHUB_ENV"

      - name: Parse current release SemVer
        id: current_semver
        uses: madhead/semver-utils@v4
        with:
          version: ${{ env.RELEASE_TAG }}
          lenient: false

      - name: Parse previous release SemVer
        id: previous_semver
        uses: madhead/semver-utils@v4
        with:
          version: ${{ env.PREVIOUS_RELEASE_TAG }}
          lenient: false

      - name: Compare release SemVer values
        id: semver_compare
        uses: madhead/semver-utils@v4
        with:
          version: ${{ steps.current_semver.outputs.release }}
          compare-to: ${{ steps.previous_semver.outputs.release }}
          lenient: false

      - name: Compute iOS destination routing from SemVer outputs
        id: routing
        run: |
          if [ "${{ steps.semver_compare.outputs.comparison-result }}" != ">" ]; then
            echo "Current release must be newer than previous release." >&2
            echo "Current: ${{ steps.current_semver.outputs.release }}" >&2
            echo "Previous: ${{ steps.previous_semver.outputs.release }}" >&2
            exit 1
          fi

          CURRENT_MAJOR=${{ steps.current_semver.outputs.major }}
          CURRENT_MINOR=${{ steps.current_semver.outputs.minor }}
          PREVIOUS_MAJOR=${{ steps.previous_semver.outputs.major }}
          PREVIOUS_MINOR=${{ steps.previous_semver.outputs.minor }}

          CLASSIFICATION="patch"
          SUBMIT_INTERNAL="true"
          SUBMIT_EXTERNAL="false"
          SUBMIT_PRODUCTION="false"

          if [ "$CURRENT_MAJOR" -gt "$PREVIOUS_MAJOR" ]; then
            CLASSIFICATION="major"
            SUBMIT_EXTERNAL="true"
            SUBMIT_PRODUCTION="true"
          elif [ "$CURRENT_MINOR" -gt "$PREVIOUS_MINOR" ]; then
            CLASSIFICATION="minor"
            SUBMIT_EXTERNAL="true"
          fi

          echo "classification=$CLASSIFICATION" >> "$GITHUB_OUTPUT"
          echo "current_version=${{ steps.current_semver.outputs.release }}" >> "$GITHUB_OUTPUT"
          echo "previous_version=${{ steps.previous_semver.outputs.release }}" >> "$GITHUB_OUTPUT"
          echo "submit_internal=$SUBMIT_INTERNAL" >> "$GITHUB_OUTPUT"
          echo "submit_external=$SUBMIT_EXTERNAL" >> "$GITHUB_OUTPUT"
          echo "submit_production=$SUBMIT_PRODUCTION" >> "$GITHUB_OUTPUT"

          echo "Routing classification: $CLASSIFICATION"
          echo "Current version: ${{ steps.current_semver.outputs.release }}"
          echo "Previous version: ${{ steps.previous_semver.outputs.release }}"
          echo "Destinations -> internal:$SUBMIT_INTERNAL external:$SUBMIT_EXTERNAL production:$SUBMIT_PRODUCTION"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Configure git authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

      - name: Ensure tags are up to date
        run: git fetch --tags --force

      - name: Install JS dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Create .env file with EXPO environment variables
        run: |
          > "$WORKDIR/.env"
          for var in $(env | grep '^EXPO_'); do
            key=$(echo "$var" | cut -d= -f1)
            value=$(echo "$var" | cut -d= -f2-)
            echo "$key=$value" >> "$WORKDIR/.env"
          done
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ORPC_API_URL: ${{ vars.EXPO_PUBLIC_ORPC_API_URL }}
          EXPO_PUBLIC_GHOST_LOGIN_EMAIL: ${{ vars.EXPO_PUBLIC_GHOST_LOGIN_EMAIL }}
          EXPO_PUBLIC_PRIVACY_POLICY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_POLICY_URL }}

      - name: Materialize iOS signing files
        run: |
          mkdir -p "$WORKDIR/credentials/ios"
          printf '%s' "${IOS_PROFILE_MOBILEPROVISION_BASE64}" | base64 -d > "$WORKDIR/credentials/ios/profile.mobileprovision"
          printf '%s' "${IOS_DIST_CERT_P12_BASE64}" | base64 -d > "$WORKDIR/credentials/ios/dist-cert.p12"
        env:
          IOS_PROFILE_MOBILEPROVISION_BASE64: ${{ secrets.IOS_PROFILE_MOBILEPROVISION_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}

      - name: Materialize App Store Connect API key
        run: |
          ruby -rjson -rbase64 -e '
            key_content = Base64.decode64(ENV.fetch("IOS_ASC_KEY_CONTENT_BASE64"))
            payload = {
              "key_id" => ENV.fetch("IOS_ASC_KEY_ID"),
              "issuer_id" => ENV.fetch("IOS_ASC_ISSUER_ID"),
              "key" => key_content
            }
            File.write(ARGV[0], JSON.pretty_generate(payload))
          ' "$WORKDIR/credentials/ios/api_key_${IOS_ASC_KEY_ID}.json"
        env:
          IOS_ASC_KEY_CONTENT_BASE64: ${{ secrets.IOS_ASC_KEY_CONTENT_BASE64 }}
          IOS_ASC_KEY_ID: ${{ vars.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ vars.IOS_ASC_ISSUER_ID }}

      - name: Materialize credentials.json from secret values
        run: |
          ruby -rjson -e 'payload={"ios"=>{"distributionCertificate"=>{"path"=>"credentials/ios/dist-cert.p12","password"=>ENV.fetch("IOS_DIST_CERT_PASSWORD")},"provisioningProfilePath"=>"credentials/ios/profile.mobileprovision"}}; File.write("credentials.json", JSON.pretty_generate(payload)+"\n")'
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Build iOS release artifact
        id: build
        run: bundle exec fastlane ios ios_build release_classification:${{ steps.routing.outputs.classification }}
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_DIST_CERT_PATH: ${{ env.WORKDIR }}/credentials/ios/dist-cert.p12
          IOS_PROFILE_PATH: ${{ env.WORKDIR }}/credentials/ios/profile.mobileprovision
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_RELEASE_CLASSIFICATION: ${{ steps.routing.outputs.classification }}
          IOS_APPLICATION_ARCHIVE_PATH: dist/ios/*.ipa

      - name: Resolve built iOS artifact path
        id: artifact
        run: |
          METADATA=dist/ios/release-metadata.json
          ARTIFACT_PATH=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["artifactPath"]' "$METADATA")
          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "metadata_path=$METADATA" >> "$GITHUB_OUTPUT"

      - name: Submit iOS release to internal
        id: submit_internal
        run: |
          bundle exec fastlane ios ios_submit \
            artifact_path:${{ steps.artifact.outputs.artifact_path }} \
            release_classification:${{ steps.routing.outputs.classification }} \
            destination:testflight_internal
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_DIST_CERT_PATH: ${{ env.WORKDIR }}/credentials/ios/dist-cert.p12
          IOS_PROFILE_PATH: ${{ env.WORKDIR }}/credentials/ios/profile.mobileprovision
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_ASC_API_KEY_PATH: ${{ env.WORKDIR }}/credentials/ios/api_key_${{ vars.IOS_ASC_KEY_ID }}.json
          IOS_TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.IOS_TESTFLIGHT_EXTERNAL_GROUPS }}

      - name: Upload iOS release artifact + metadata
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ steps.current_semver.outputs.release }}
          path: |
            apps/native/dist/ios/*.ipa
            apps/native/dist/ios/release-metadata.json
          if-no-files-found: error

      - name: Generate iOS build summary
        if: always()
        run: |
          echo "## iOS Build & Internal Submission Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | ${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Internal Submission | ${{ steps.submit_internal.outcome == 'success' && '✅ Submitted' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.current_semver.outputs.release }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous | ${{ steps.previous_semver.outputs.release }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Classification | ${{ steps.routing.outputs.classification }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${{ steps.artifact.outputs.artifact_path }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Track Routing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Track | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Internal | ✅ Submitted |" >> $GITHUB_STEP_SUMMARY
          echo "| External | ${{ steps.routing.outputs.submit_external == 'true' && '✅ Queued' || '⬜ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ steps.routing.outputs.submit_production == 'true' && '✅ Queued' || '⬜ Skipped' }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.build.outcome }}" == "failure" ] || [ "${{ steps.submit_internal.outcome }}" == "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "::error::iOS build/submit failed"
          fi

  submit_external:
    name: Submit iOS to external testing
    runs-on: macos-26
    needs: [build]
    if: needs.build.outputs.submit_external == 'true'
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Set working directory explicitly
        run: echo "WORKDIR=${GITHUB_WORKSPACE}/apps/native" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Download iOS release artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-${{ needs.build.outputs.version }}
          path: apps/native/dist/ios

      - name: Materialize iOS signing files
        run: |
          mkdir -p "$WORKDIR/credentials/ios"
          printf '%s' "${IOS_PROFILE_MOBILEPROVISION_BASE64}" | base64 -d > "$WORKDIR/credentials/ios/profile.mobileprovision"
          printf '%s' "${IOS_DIST_CERT_P12_BASE64}" | base64 -d > "$WORKDIR/credentials/ios/dist-cert.p12"
        env:
          IOS_PROFILE_MOBILEPROVISION_BASE64: ${{ secrets.IOS_PROFILE_MOBILEPROVISION_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}

      - name: Materialize App Store Connect API key
        run: |
          ruby -rjson -rbase64 -e '
            key_content = Base64.decode64(ENV.fetch("IOS_ASC_KEY_CONTENT_BASE64"))
            payload = {
              "key_id" => ENV.fetch("IOS_ASC_KEY_ID"),
              "issuer_id" => ENV.fetch("IOS_ASC_ISSUER_ID"),
              "key" => key_content
            }
            File.write(ARGV[0], JSON.pretty_generate(payload))
          ' "$WORKDIR/credentials/ios/api_key_${IOS_ASC_KEY_ID}.json"
        env:
          IOS_ASC_KEY_CONTENT_BASE64: ${{ secrets.IOS_ASC_KEY_CONTENT_BASE64 }}
          IOS_ASC_KEY_ID: ${{ vars.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ vars.IOS_ASC_ISSUER_ID }}

      - name: Submit iOS release to external testing
        id: submit
        run: |
          bundle exec fastlane ios ios_submit \
            artifact_path:dist/ios/*.ipa \
            release_classification:${{ needs.build.outputs.classification }} \
            destination:testflight_external

      - name: Generate external submission summary
        if: always()
        run: |
          echo "## iOS External TestFlight Submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.submit.outcome == 'success' && '✅ Submitted' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.build.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Classification | ${{ needs.build.outputs.classification }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.submit.outcome }}" == "failure" ]; then
            echo "::error::iOS external submission failed"
          fi
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_DIST_CERT_PATH: ${{ env.WORKDIR }}/credentials/ios/dist-cert.p12
          IOS_PROFILE_PATH: ${{ env.WORKDIR }}/credentials/ios/profile.mobileprovision
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_ASC_API_KEY_PATH: ${{ env.WORKDIR }}/credentials/ios/api_key_${{ vars.IOS_ASC_KEY_ID }}.json
          IOS_TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.IOS_TESTFLIGHT_EXTERNAL_GROUPS }}

  submit_production:
    name: Submit iOS to App Store
    runs-on: macos-26
    needs: [build]
    if: needs.build.outputs.submit_production == 'true'
    environment: ios-production-approval
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Set working directory explicitly
        run: echo "WORKDIR=${GITHUB_WORKSPACE}/apps/native" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Download iOS release artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-${{ needs.build.outputs.version }}
          path: apps/native/dist/ios

      - name: Materialize iOS signing files
        run: |
          mkdir -p "$WORKDIR/credentials/ios"
          printf '%s' "${IOS_PROFILE_MOBILEPROVISION_BASE64}" | base64 -d > "$WORKDIR/credentials/ios/profile.mobileprovision"
          printf '%s' "${IOS_DIST_CERT_P12_BASE64}" | base64 -d > "$WORKDIR/credentials/ios/dist-cert.p12"
        env:
          IOS_PROFILE_MOBILEPROVISION_BASE64: ${{ secrets.IOS_PROFILE_MOBILEPROVISION_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}

      - name: Materialize App Store Connect API key
        run: |
          ruby -rjson -rbase64 -e '
            key_content = Base64.decode64(ENV.fetch("IOS_ASC_KEY_CONTENT_BASE64"))
            payload = {
              "key_id" => ENV.fetch("IOS_ASC_KEY_ID"),
              "issuer_id" => ENV.fetch("IOS_ASC_ISSUER_ID"),
              "key" => key_content
            }
            File.write(ARGV[0], JSON.pretty_generate(payload))
          ' "$WORKDIR/credentials/ios/api_key_${IOS_ASC_KEY_ID}.json"
        env:
          IOS_ASC_KEY_CONTENT_BASE64: ${{ secrets.IOS_ASC_KEY_CONTENT_BASE64 }}
          IOS_ASC_KEY_ID: ${{ vars.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ vars.IOS_ASC_ISSUER_ID }}

      - name: Submit iOS release to App Store
        id: submit
        run: |
          bundle exec fastlane ios ios_submit \
            artifact_path:dist/ios/*.ipa \
            release_classification:${{ needs.build.outputs.classification }} \
            destination:app_store

      - name: Generate production submission summary
        if: always()
        run: |
          echo "## iOS App Store Submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.submit.outcome == 'success' && '✅ Submitted' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.build.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Classification | ${{ needs.build.outputs.classification }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.submit.outcome }}" == "success" ]; then
            echo "::notice::iOS v${{ needs.build.outputs.version }} submitted to App Store"
          else
            echo "::error::iOS App Store submission failed"
          fi
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          IOS_DIST_CERT_PATH: ${{ env.WORKDIR }}/credentials/ios/dist-cert.p12
          IOS_PROFILE_PATH: ${{ env.WORKDIR }}/credentials/ios/profile.mobileprovision
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_ASC_KEY_ID: ${{ vars.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ vars.IOS_ASC_ISSUER_ID }}
          IOS_ASC_KEY_PATH: ${{ env.WORKDIR }}/credentials/ios/asc-api-key.p8
