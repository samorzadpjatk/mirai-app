name: Android Release (Fastlane)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monorepo_tagging:
    name: Run monorepo tagging
    uses: ./.github/workflows/monorepo-tagging.yml
    secrets: inherit

  build_and_upload_internal:
    name: Build + upload to internal
    runs-on: ubuntu-latest
    needs: [monorepo_tagging]
    defaults:
      run:
        working-directory: apps/native
    outputs:
      version_code: ${{ steps.metadata.outputs.version_code }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      artifact_path: ${{ steps.metadata.outputs.artifact_path }}
      classification: ${{ steps.track_routing.outputs.classification }}
      submit_internal: ${{ steps.track_routing.outputs.submit_internal }}
      submit_external: ${{ steps.track_routing.outputs.submit_external }}
      submit_production: ${{ steps.track_routing.outputs.submit_production }}
      current_version: ${{ steps.track_routing.outputs.current_version }}
      previous_version: ${{ steps.track_routing.outputs.previous_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set working directory explicitly
        run: echo "WORKDIR=${GITHUB_WORKSPACE}/apps/native" >> $GITHUB_ENV

      - name: Record release tag metadata
        run: |
          echo "RELEASE_TAG=${{ needs.monorepo_tagging.outputs.semver_tag }}" >> $GITHUB_ENV
          echo "PREVIOUS_RELEASE_TAG=${{ needs.monorepo_tagging.outputs.previous_tag }}" >> $GITHUB_ENV
          echo "TAG_CREATED=${{ needs.monorepo_tagging.outputs.tag_created }}" >> $GITHUB_ENV
          echo "TAG_REFRESHED=${{ needs.monorepo_tagging.outputs.tag_refreshed }}" >> $GITHUB_ENV

      - name: Parse current release SemVer
        id: current_semver
        uses: madhead/semver-utils@v4
        with:
          version: ${{ env.RELEASE_TAG }}
          lenient: false

      - name: Parse previous release SemVer
        id: previous_semver
        uses: madhead/semver-utils@v4
        with:
          version: ${{ env.PREVIOUS_RELEASE_TAG }}
          lenient: false

      - name: Compare release SemVer values
        id: semver_compare
        uses: madhead/semver-utils@v4
        with:
          version: ${{ steps.current_semver.outputs.release }}
          compare-to: ${{ steps.previous_semver.outputs.release }}
          lenient: false

      - name: Compute track routing from SemVer outputs
        id: track_routing
        run: |
          if [ "${{ steps.semver_compare.outputs.comparison-result }}" != ">" ]; then
            echo "Current release must be newer than previous release." >&2
            echo "Current: ${{ steps.current_semver.outputs.release }}" >&2
            echo "Previous: ${{ steps.previous_semver.outputs.release }}" >&2
            exit 1
          fi

          CURRENT_MAJOR=${{ steps.current_semver.outputs.major }}
          CURRENT_MINOR=${{ steps.current_semver.outputs.minor }}
          CURRENT_PATCH=${{ steps.current_semver.outputs.patch }}
          PREVIOUS_MAJOR=${{ steps.previous_semver.outputs.major }}
          PREVIOUS_MINOR=${{ steps.previous_semver.outputs.minor }}

          CLASSIFICATION="patch"
          SUBMIT_INTERNAL="true"
          SUBMIT_EXTERNAL="false"
          SUBMIT_PRODUCTION="false"

          if [ "$CURRENT_MAJOR" -gt "$PREVIOUS_MAJOR" ]; then
            CLASSIFICATION="major"
            SUBMIT_EXTERNAL="true"
            SUBMIT_PRODUCTION="true"
          elif [ "$CURRENT_MINOR" -gt "$PREVIOUS_MINOR" ]; then
            CLASSIFICATION="minor"
            SUBMIT_EXTERNAL="true"
          fi

          echo "classification=$CLASSIFICATION" >> "$GITHUB_OUTPUT"
          echo "current_version=${{ steps.current_semver.outputs.release }}" >> "$GITHUB_OUTPUT"
          echo "previous_version=${{ steps.previous_semver.outputs.release }}" >> "$GITHUB_OUTPUT"
          echo "submit_internal=$SUBMIT_INTERNAL" >> "$GITHUB_OUTPUT"
          echo "submit_external=$SUBMIT_EXTERNAL" >> "$GITHUB_OUTPUT"
          echo "submit_production=$SUBMIT_PRODUCTION" >> "$GITHUB_OUTPUT"

          echo "Routing classification: $CLASSIFICATION"
          echo "Current version: ${{ steps.current_semver.outputs.release }}"
          echo "Previous version: ${{ steps.previous_semver.outputs.release }}"
          echo "Tracks -> internal:$SUBMIT_INTERNAL external:$SUBMIT_EXTERNAL production:$SUBMIT_PRODUCTION"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Ensure tags are up to date
        run: git fetch --tags --force

      - name: Install JS dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Create .env file with EXPO environment variables
        run: |
          > "$WORKDIR/.env"
          for var in $(env | grep '^EXPO_'); do
            key=$(echo "$var" | cut -d= -f1)
            value=$(echo "$var" | cut -d= -f2-)
            echo "$key=$value" >> "$WORKDIR/.env"
          done
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_TRPC_API_URL: ${{ env.EXPO_PUBLIC_TRPC_API_URL }}
          EXPO_PUBLIC_GHOST_LOGIN_EMAIL: ${{ env.EXPO_PUBLIC_GHOST_LOGIN_EMAIL }}
          EXPO_PUBLIC_PRIVACY_POLICY_URL: ${{ env.EXPO_PUBLIC_PRIVACY_POLICY_URL }}

      - name: Decode Play service account key
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${PLAY_JSON_KEY_BASE64}" | base64 -d > "$WORKDIR/credentials/android/play-service-account.json"
        env:
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}

      - name: Decode Android keystore
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$WORKDIR/credentials/android/keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Materialize google-services.json
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > "$WORKDIR/credentials/android/google-services.json"
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Build release artifact
        run: bundle exec fastlane android android_build
        env:
          ANDROID_APP_PACKAGE: ${{ secrets.ANDROID_APP_PACKAGE }}
          PLAY_JSON_KEY_PATH: ${{ env.WORKDIR }}/credentials/android/play-service-account.json
          ANDROID_KEYSTORE_PATH: ${{ env.WORKDIR }}/credentials/android/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_LINEAGE: ${{ secrets.ANDROID_SIGNING_LINEAGE }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Resolve built artifact path
        id: artifact
        run: |
          METADATA=dist/android/release-metadata.json
          ARTIFACT_PATH=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["artifactPath"]' $METADATA)
          echo "artifact_path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT

      - name: Upload internal release artifact
        run: bundle exec fastlane android android_submit track:internal artifact_path:${{ steps.artifact.outputs.artifact_path }}
        env:
          ANDROID_APP_PACKAGE: ${{ secrets.ANDROID_APP_PACKAGE }}
          PLAY_JSON_KEY_PATH: ${{ env.WORKDIR }}/credentials/android/play-service-account.json
          ANDROID_SIGNING_LINEAGE: ${{ secrets.ANDROID_SIGNING_LINEAGE }}

      - name: Extract release metadata
        id: metadata
        run: |
          METADATA=dist/android/release-metadata.json
          echo "version_code=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["versionCode"]' $METADATA)" >> $GITHUB_OUTPUT
          echo "version_name=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["versionName"]' $METADATA)" >> $GITHUB_OUTPUT
          echo "artifact_path=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["artifactPath"]' $METADATA)" >> $GITHUB_OUTPUT
          echo "version_bump=managed-by-semver-action" >> $GITHUB_OUTPUT

      - name: Upload release bundle + metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-internal-${{ steps.metadata.outputs.version_code }}
          path: |
            apps/native/dist/android/*.aab
            apps/native/dist/android/release-metadata.json
          if-no-files-found: error

  promote_to_beta:
    name: Promote internal -> beta
    runs-on: ubuntu-latest
    needs: build_and_upload_internal
    environment: android-beta-approval
    if: needs.build_and_upload_internal.outputs.submit_external == 'true'
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set working directory explicitly
        run: echo "WORKDIR=${GITHUB_WORKSPACE}/apps/native" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Download internal release metadata
        uses: actions/download-artifact@v4
        with:
          name: android-release-internal-${{ needs.build_and_upload_internal.outputs.version_code }}
          path: apps/native/dist/android

      - name: Decode Play service account key
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${PLAY_JSON_KEY_BASE64}" | base64 -d > "$WORKDIR/credentials/android/play-service-account.json"
        env:
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}

      - name: Materialize google-services.json
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > "$WORKDIR/credentials/android/google-services.json"
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Promote exact release to beta
        run: |
          VERSION_CODE=${{ needs.build_and_upload_internal.outputs.version_code }}
          bundle exec fastlane android android_promote from_track:internal to_track:beta version_code:$VERSION_CODE metadata_path:dist/android/release-metadata.json
        env:
          ANDROID_APP_PACKAGE: ${{ secrets.ANDROID_APP_PACKAGE }}
          PLAY_JSON_KEY_PATH: ${{ env.WORKDIR }}/credentials/android/play-service-account.json
          ANDROID_SIGNING_LINEAGE: ${{ secrets.ANDROID_SIGNING_LINEAGE }}

  promote_to_production:
    name: Promote internal -> production
    runs-on: ubuntu-latest
    needs: [build_and_upload_internal]
    environment: android-production-approval
    if: needs.build_and_upload_internal.outputs.submit_production == 'true'
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set working directory explicitly
        run: echo "WORKDIR=${GITHUB_WORKSPACE}/apps/native" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Decode Play service account key
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${PLAY_JSON_KEY_BASE64}" | base64 -d > "$WORKDIR/credentials/android/play-service-account.json"
        env:
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}

      - name: Materialize google-services.json
        run: |
          mkdir -p "$WORKDIR/credentials/android"
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > "$WORKDIR/credentials/android/google-services.json"
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Download internal release metadata
        uses: actions/download-artifact@v4
        with:
          name: android-release-internal-${{ needs.build_and_upload_internal.outputs.version_code }}
          path: apps/native/dist/android

      - name: Promote release to production
        run: |
          VERSION_CODE=${{ needs.build_and_upload_internal.outputs.version_code }}
          bundle exec fastlane android android_promote from_track:internal to_track:production version_code:$VERSION_CODE metadata_path:dist/android/release-metadata.json
        env:
          ANDROID_APP_PACKAGE: ${{ secrets.ANDROID_APP_PACKAGE }}
          PLAY_JSON_KEY_PATH: ${{ env.WORKDIR }}/credentials/android/play-service-account.json
          ANDROID_SIGNING_LINEAGE: ${{ secrets.ANDROID_SIGNING_LINEAGE }}
