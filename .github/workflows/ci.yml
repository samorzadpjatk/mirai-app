name: PR Checks

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "bun.lock"
      - "knip.json"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "bun.lock"
      - "knip.json"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_BAIL: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }}

      - name: Setup monorepo environment
        uses: ./.github/actions/setup-monorepo

      - name: Run Biome lint check
        id: biome
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t lint --base=origin/${{ github.base_ref }} --verbose
          else
            bunx nx run-many -t lint --exclude=@mirai-app/monorepo --verbose
          fi

      - name: Run Nx Module Boundaries
        id: boundaries
        run: bun run lint:boundaries

      - name: Run Knip dependency audit
        id: knip
        run: bunx knip

      - name: Generate lint job summary
        if: always()
        run: |
          MODE="${{ github.event_name == 'pull_request' && 'affected (incremental)' || 'run-many (full)' }}"
          echo "## Lint & Format Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Biome Lint | ${{ steps.biome.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | $MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Nx Module Boundaries | ${{ steps.boundaries.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Knip Dependency Audit | ${{ steps.knip.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.biome.outcome }}" == "failure" ] || [ "${{ steps.boundaries.outcome }}" == "failure" ] || [ "${{ steps.knip.outcome }}" == "failure" ]; then
            echo "### ❌ Failures Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            [ "${{ steps.biome.outcome }}" == "failure" ] && echo "- Biome lint found errors. See step logs for rule details." >> $GITHUB_STEP_SUMMARY
            [ "${{ steps.boundaries.outcome }}" == "failure" ] && echo "- Nx module boundaries violated." >> $GITHUB_STEP_SUMMARY
            [ "${{ steps.knip.outcome }}" == "failure" ] && echo "- Knip found unused dependencies or exports." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>Raw step output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See individual step logs for full output." >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "::error::Lint job failed (Biome=${{ steps.biome.outcome }}, Boundaries=${{ steps.boundaries.outcome }}, Knip=${{ steps.knip.outcome }})"
          else
            echo "### ✅ All Checks Passed" >> $GITHUB_STEP_SUMMARY
          fi

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }}

      - name: Setup monorepo environment
        uses: ./.github/actions/setup-monorepo

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run TypeScript type checking
        id: typecheck
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t typecheck --base=origin/${{ github.base_ref }} 2>&1 | tee typecheck.log
          else
            bunx nx run-many -t typecheck --exclude=@mirai-app/monorepo 2>&1 | tee typecheck.log
          fi

      - name: Report TypeScript errors to PR
        id: reviewdog
        if: failure() && steps.typecheck.outcome == 'failure'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          cat typecheck.log | reviewdog -f=tsc -name="TypeScript" -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false

      - name: Generate typecheck job summary
        if: always()
        run: |
          MODE="${{ github.event_name == 'pull_request' && 'affected (incremental)' || 'run-many (full)' }}"
          ERROR_COUNT=$(grep -c "error TS" typecheck.log 2>/dev/null || echo 0)
          WARNING_COUNT=$(grep -c "warning TS" typecheck.log 2>/dev/null || echo 0)

          echo "## TypeScript Type Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.typecheck.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Errors | $ERROR_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Warnings | $WARNING_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.typecheck.outcome }}" == "failure" ]; then
            echo "### ❌ Type Errors Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>typecheck.log (first 50 lines)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -n 50 typecheck.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Reviewdog PR review: ${{ steps.reviewdog.outcome == 'success' && '✅ Posted' || '❌ Failed to post' }}" >> $GITHUB_STEP_SUMMARY
            echo "::error::TypeScript type check failed with $ERROR_COUNT errors"
          else
            echo "### ✅ No Type Errors" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }}

      - name: Setup monorepo environment
        uses: ./.github/actions/setup-monorepo

      - name: Run tests
        id: test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t test:ci --base=origin/${{ github.base_ref }}
          else
            bunx nx run-many -t test:ci --exclude=@mirai-app/monorepo
          fi

      - name: Collect coverage reports
        if: always()
        run: |
          mkdir -p ./coverage
          find . -path ./node_modules -prune -o -path ./.bun -prune -o -path ./.nx/cache -prune -o -name "lcov.info" -type f -print | while read file; do
            dir=$(dirname "$file" | sed 's|^\./||' | sed 's|/coverage$||' | tr '/' '_')
            cp "$file" "./coverage/lcov_${dir}.info"
            echo "Collected: $file -> ./coverage/lcov_${dir}.info"
          done
          ls -la ./coverage/ || echo "No coverage files found"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            ./coverage/**
            ./**/coverage/**
          retention-days: 30

      - name: Post diff coverage comment
        uses: Affanmir/diff-cover-action@v2
        if: github.event_name == 'pull_request' && always()
        with:
          coverage-files: ./coverage/lcov_*.info
          fail-under: '0'
          post-comment: true
          create-annotations: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate test job summary
        if: always()
        run: |
          MODE="${{ github.event_name == 'pull_request' && 'affected (incremental)' || 'run-many (full)' }}"
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.test.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "### ✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.test.outcome }}" == "failure" ]; then
            echo "### ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check step logs for failing test details." >> $GITHUB_STEP_SUMMARY
            echo "::error::Test suite failed"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage artifacts uploaded to GitHub Actions" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "- PR diff coverage comment posted via diff-cover-action" >> $GITHUB_STEP_SUMMARY
          fi
