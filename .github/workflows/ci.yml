name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"

jobs:
  # Phase 1: Build and validate (no dependencies)
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v1

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run ESLint for monorepo
        run: bun run lint

      - name: Run dependency-cruiser layer check
        run: bun run depcruise:check

      - name: Validate test prefixes
        run: bun run test:validate-prefixes

      - name: Run TypeScript type checking
        run: |
          bun run typecheck 2>&1 | tee typecheck.log || true

      - name: Report TypeScript errors to PR
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat typecheck.log | reviewdog -f=tsc -name="TypeScript" -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=true

  # Phase 2a: Build all packages (depends on build_test)
  build:
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v1

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
            apps/*/.next

  # Phase 2b: Run unit tests (depends on build_test, runs in parallel with build and test-native)
  test-unit:
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v1

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:unit

  # Phase 2c: Run native tests (depends on build_test, runs in parallel with build and test-unit)
  test-native:
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v1

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Run Bun tests for native app
        working-directory: apps/native
        run: bun test --coverage --silent

  # Phase 3: Run integration tests (depends on build job for artifacts)
  test-integration:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v1

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run integration tests
        run: bun run test:integration

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/coverage/**
