name: Linting check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Test all
        run: pnpm test:ci

      - name: Run ESLint for monorepo
        run: pnpm lint

      - name: Run TypeScript type checking
        run: |
          pnpm typecheck 2>&1 | tee typecheck.log || true
          
      - name: Report TypeScript errors to PR
        if: always()
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat typecheck.log | reviewdog -f=tsc -name="TypeScript" -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=true
