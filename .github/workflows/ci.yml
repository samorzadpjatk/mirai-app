name: Linting check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Test all
        run: pnpm test:ci

      - name: Run ESLint web app
        uses: reviewdog/action-eslint@v1.33.2
        with:
          reporter: github-check
          workdir: apps/web
          eslint_flags: "."

      - name: Run ESLint native app
        uses: reviewdog/action-eslint@v1.33.2
        with:
          reporter: github-check
          workdir: apps/native
          eslint_flags: "."

      - name: Run ESLint for monorepo
        run: pnpm lint

      - name: Run `tsc`
        uses: EPMatt/reviewdog-action-tsc@v1.8.0
        with:
          reporter: github-check
