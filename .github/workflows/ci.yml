name: Linting check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: |
        npm ci

    - name: Run ESLint
      uses: reviewdog/action-eslint@v1.33.2
      with:
        reporter: github-check
        eslint_flags: "."

    - name: Run `tsc`
      uses: EPMatt/reviewdog-action-tsc@v1.8.0
      with:
        reporter: github-check
