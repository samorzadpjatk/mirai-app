name: Linting check

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run ESLint (affected)
        if: github.event_name == 'pull_request'
        run: npx turbo run lint --affected

      - name: Run ESLint (full)
        if: github.event_name != 'pull_request'
        run: bun run lint

      - name: Run TypeScript type checking (affected)
        if: github.event_name == 'pull_request'
        id: typecheck-affected
        run: |
          set -o pipefail
          npx turbo run typecheck --affected 2>&1 | tee typecheck.log

      - name: Run TypeScript type checking (full)
        if: github.event_name != 'pull_request'
        id: typecheck-full
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Report TypeScript errors to PR
        if: failure() && (steps.typecheck-affected.outcome == 'failure' || steps.typecheck-full.outcome == 'failure')
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat typecheck.log | reviewdog -f=tsc -name="TypeScript" -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false

      - name: Run tests (affected)
        if: github.event_name == 'pull_request'
        run: npx turbo run test --affected

      - name: Run tests (full)
        if: github.event_name != 'pull_request'
        run: bun run test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/**/coverage-final.json
          fail_ci_if_error: false
          verbose: true