name: PR Checks

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "bun.lock"
      - "knip.json"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "bun.lock"
      - "knip.json"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_BAIL: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }}

      - name: Setup monorepo environment
        uses: ./.github/actions/setup-monorepo

      - name: Run Biome lint check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t lint --base=origin/${{ github.base_ref }} --verbose
          else
            bunx nx run-many -t lint --exclude=@mirai-app/monorepo --verbose
          fi

      - name: Run Nx Module Boundaries
        run: bun run lint:boundaries

      - name: Run Knip dependency audit
        run: bunx knip

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }}

      - name: Setup monorepo environment
        uses: ./.github/actions/setup-monorepo

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run TypeScript type checking
        id: typecheck
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t typecheck --base=origin/${{ github.base_ref }} 2>&1 | tee typecheck.log
          else
            bunx nx run-many -t typecheck --exclude=@mirai-app/monorepo 2>&1 | tee typecheck.log
          fi

      - name: Report TypeScript errors to PR
        if: failure() && steps.typecheck.outcome == 'failure'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          cat typecheck.log | reviewdog -f=tsc -name="TypeScript" -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }}

      - name: Setup monorepo environment
        uses: ./.github/actions/setup-monorepo

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t test:ci --base=origin/${{ github.base_ref }}
          else
            bunx nx run-many -t test:ci --exclude=@mirai-app/monorepo
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/**/coverage-final.json
          fail_ci_if_error: false
          verbose: true
