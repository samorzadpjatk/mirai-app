name: Linting check

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "bun.lock"
      - "knip.json"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yml"
      - "*.yaml"
      - ".github/**"
      - "bun.lock"
      - "knip.json"
      - "!.env*"
      - "!docs/**"
      - "!environment/**"
      - "!Dockerfile*"
      - "!*.md"

env:
  NX_BASE: origin/${{ github.base_ref }}

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch for nx affected
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin ${{ github.base_ref }} --depth=1

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.14"

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-v2-${{ github.event_name }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-v2-${{ github.event_name }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore NX cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.event_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ github.event_name }}--

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t lint --base=origin/${{ github.base_ref }}
          else
            bunx nx run-many -t lint --exclude=@mirai-app/monorepo
          fi

      - name: Run Knip dependency check
        run: bunx knip

      - name: Run Format Check
        run: bun run format:check

      - name: Run TypeScript type checking
        id: typecheck
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t typecheck --base=origin/${{ github.base_ref }} 2>&1 | tee typecheck.log
          else
            bunx nx run-many -t typecheck --exclude=@mirai-app/monorepo 2>&1 | tee typecheck.log
          fi

      - name: Report TypeScript errors to PR
        if: failure() && steps.typecheck.outcome == 'failure'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          cat typecheck.log | reviewdog -f=tsc -name="TypeScript" -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx nx affected -t test:ci --base=origin/${{ github.base_ref }}
          else
            bunx nx run-many -t test:ci --exclude=@mirai-app/monorepo
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/**/coverage-final.json
          fail_ci_if_error: false
          verbose: true
