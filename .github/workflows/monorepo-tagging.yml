name: Monorepo Tagging

on:
  push:
    branches:
      - main
  workflow_call:
    outputs:
      semver_tag:
        description: Computed semantic version tag.
        value: ${{ jobs.compute_and_publish_tag.outputs.semver_tag }}
      previous_tag:
        description: Previous semantic version tag.
        value: ${{ jobs.compute_and_publish_tag.outputs.previous_tag }}
      tag_created:
        description: Whether a new tag was created.
        value: ${{ jobs.compute_and_publish_tag.outputs.tag_created }}
      tag_refreshed:
        description: Whether an existing tag was moved.
        value: ${{ jobs.compute_and_publish_tag.outputs.tag_refreshed }}

permissions:
  contents: write

jobs:
  compute_and_publish_tag:
    name: Compute and publish release tag
    runs-on: self-hosted
    outputs:
      semver_tag: ${{ steps.publish.outputs.semver_tag }}
      previous_tag: ${{ steps.publish.outputs.previous_tag }}
      tag_created: ${{ steps.publish.outputs.tag_created }}
      tag_refreshed: ${{ steps.publish.outputs.tag_refreshed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve SemVer version with git-version
        id: semver
        uses: codacy/git-version@2.8.7
        with:
          release-branch: main
          prefix: v
          minor-identifier: '/^feat(\([^)]+\))?!?:\s.+/'
          major-identifier: '/^(([^\n]+!:\s.+)|(BREAKING CHANGE:\s.+)|(breaking:\s.+))/'

      - name: Publish or refresh tag
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.semver.outputs.version }}"
          PREVIOUS="${{ steps.semver.outputs['previous-version'] }}"
          echo "semver_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            echo "tag_refreshed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags
          CURRENT_SHA=$(git rev-parse HEAD)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TARGET_SHA=$(git rev-parse "$TAG")
            if [ "$TARGET_SHA" != "$CURRENT_SHA" ]; then
              git tag -f "$TAG"
              git push --force origin "$TAG"
              echo "tag_created=false" >> "$GITHUB_OUTPUT"
              echo "tag_refreshed=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag_created=false" >> "$GITHUB_OUTPUT"
              echo "tag_refreshed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_refreshed=false" >> "$GITHUB_OUTPUT"

      - name: Generate tagging summary
        if: always()
        run: |
          echo "## Monorepo Tagging Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SemVer Tag | ${{ steps.publish.outputs.semver_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Tag | ${{ steps.publish.outputs.previous_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag Created | ${{ steps.publish.outputs.tag_created == 'true' && '✅ Yes' || '⬜ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag Refreshed | ${{ steps.publish.outputs.tag_refreshed == 'true' && '✅ Yes' || '⬜ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.publish.outputs.tag_created }}" == "true" ]; then
            echo "### ✅ New Tag Created" >> $GITHUB_STEP_SUMMARY
            echo "Tag \`${{ steps.publish.outputs.semver_tag }}\` has been pushed to origin." >> $GITHUB_STEP_SUMMARY
            echo "::notice::New tag ${{ steps.publish.outputs.semver_tag }} created"
          elif [ "${{ steps.publish.outputs.tag_refreshed }}" == "true" ]; then
            echo "### 🔄 Tag Refreshed" >> $GITHUB_STEP_SUMMARY
            echo "Tag \`${{ steps.publish.outputs.semver_tag }}\` was moved to the current commit." >> $GITHUB_STEP_SUMMARY
            echo "::notice::Tag ${{ steps.publish.outputs.semver_tag }} refreshed"
          else
            echo "### ℹ️ No Tag Changes" >> $GITHUB_STEP_SUMMARY
            echo "Tag \`${{ steps.publish.outputs.semver_tag }}\` already points to the current commit." >> $GITHUB_STEP_SUMMARY
          fi
