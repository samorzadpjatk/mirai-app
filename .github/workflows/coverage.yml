name: Coverage Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run Bun tests with coverage
        run: |
          bun run test:coverage 2>&1 | tee coverage-bun.txt || true

      - name: Run Jest tests for native app
        working-directory: apps/native
        run: |
          ./node_modules/.bin/jest --coverage --coverageReporters=text-summary --silent 2>&1 | tee coverage-jest.txt || true

      - name: Generate coverage summary
        run: |
          echo "## Coverage Summary" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "### Bun Tests (packages, web, backend)" >> coverage-summary.md
          echo "\`\`\`" >> coverage-summary.md
          cat coverage-bun.txt | grep -A 10 "File" | head -20 >> coverage-summary.md || echo "No Bun coverage data" >> coverage-summary.md
          echo "\`\`\`" >> coverage-summary.md
          echo "" >> coverage-summary.md
          echo "### Jest Tests (native app)" >> coverage-summary.md
          echo "\`\`\`" >> coverage-summary.md
          cat coverage-jest.txt | grep -A 10 "File" | head -20 >> coverage-summary.md || echo "No Jest coverage data" >> coverage-summary.md
          echo "\`\`\`" >> coverage-summary.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverageSummary = fs.readFileSync('coverage-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageSummary
            });

      - name: Check coverage thresholds
        run: |
          # Extract coverage percentages and check against thresholds
          BUN_COVERAGE=$(grep -oP 'All files.*\K[0-9]+(\.[0-9]+)?' coverage-bun.txt | head -1 || echo "0")
          JEST_COVERAGE=$(grep -oP 'All files.*\K[0-9]+(\.[0-9]+)?' coverage-jest.txt | head -1 || echo "0")

          echo "Bun coverage: ${BUN_COVERAGE}%"
          echo "Jest coverage: ${JEST_COVERAGE}%"

          # Threshold: 80% for lines
          THRESHOLD=80

          # Check Bun coverage (allow 0 for now as it may not be fully configured)
          if (( $(echo "$BUN_COVERAGE > 0" | bc -l) )); then
            if (( $(echo "$BUN_COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "::warning::Bun test coverage (${BUN_COVERAGE}%) is below threshold (${THRESHOLD}%)"
            fi
          fi

          # Check Jest coverage
          if (( $(echo "$JEST_COVERAGE > 0" | bc -l) )); then
            if (( $(echo "$JEST_COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "::warning::Jest test coverage (${JEST_COVERAGE}%) is below threshold (${THRESHOLD}%)"
            fi
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info,./apps/native/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
