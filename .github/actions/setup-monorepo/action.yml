name: Setup Monorepo
description: |
  Installs Node.js, Bun, and monorepo dependencies while restoring
  caches for both Bun dependencies and Nx build cache.
  
  This composite action is used by all CI jobs to ensure a consistent
  environment for the MIRAI monorepo.

inputs:
  base-ref:
    description: "Base ref for PR fetch (only used in pull_request events)"
    required: false

runs:
  using: composite
  steps:
    - name: Fetch base branch for nx affected
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git fetch origin ${{ github.base_ref }}
      shell: bash

    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install Bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: "1.3.14"

    - name: Restore Bun dependency cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          node_modules
          */*/node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-bun-v2-${{ github.event_name }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-v2-${{ github.event_name }}-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Restore NX cache
      uses: actions/cache@v5.0.5
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ github.event_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ github.event_name }}--
