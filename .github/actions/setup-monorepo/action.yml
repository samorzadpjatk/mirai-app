name: Setup Monorepo
description: Installs Node.js, Bun, and monorepo dependencies while restoring caches for both Bun dependencies and Nx build cache.

runs:
  using: composite
  steps:
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install Bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: "1.3.14"

    - name: Restore Bun dependency cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          node_modules
          */*/node_modules
          apps/*/node_modules
          packages/*/node_modules
        # Key by lockfile hash only — deps are identical across PR/push events.
        # v3: removed event_name to allow cross-PR cache reuse.
        key: ${{ runner.os }}-bun-v3-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-v3-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Restore NX cache
      uses: actions/cache@v5.0.5
      with:
        path: .nx/cache
        # NX's internal cache is content-addressable (keyed by task input hash).
        # The GHA cache is just storage — key by config that affects ALL tasks.
        # v3: replaced github.sha (unique per commit, defeated reuse) with
        # hash of bun.lock + nx.json + all package.json files.
        # This enables cross-PR cache hits when config hasn't changed.
        key: ${{ runner.os }}-nx-v3-${{ hashFiles('bun.lock', 'nx.json', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-nx-v3-
