# Evaluation Specification: Console.log Replacement with Structured Logger
# Target: 140 console.log statements across packages/* and apps/*
# Reference: @mirai-app/shared logger with debug, info, warn, error levels

evaluation_id: console-log-replacement-v1
target_scope: monorepo-wide
artifact_type: code
severity: high

objective:
  description: |
    Replace all 140 remaining console.log statements with structured logger from @mirai-app/shared.
    Use appropriate log levels (debug, info, warn, error) based on context.
    Remove console.warn and console.error where appropriate (keep if they indicate actual errors).

  success_criteria:
    - All console.log statements replaced with structured logger
    - Appropriate log levels assigned based on context
    - All imports use correct pattern from @mirai-app/shared
    - No regression in functionality
    - Code quality maintained or improved

scoring:
  total_points: 100
  passing_threshold: 85

  rubrics:
    - category: coverage
      weight: 30
      points: 30
      description: Complete replacement of all console.log statements
      criteria:
        - name: count_verification
          points: 10
          description: Zero console.log statements remain in packages/* and apps/*
          verification: |
            Run: grep -r "console\.log" packages/ apps/ --include="*.ts" --include="*.tsx" --include="*.js" | wc -l
            Expected: 0

        - name: comprehensive_scope
          points: 10
          description: All 140 targeted statements addressed
          verification: |
            Confirm 140 console.log replacements occurred
            Run: git diff --stat or grep for logger.info/logger.debug/logger.warn
            Count of logger.* calls should equal approximately 140

        - name: edge_cases
          points: 10
          description: Edge cases handled (template literals, multiple args, interpolated strings)
          check: |
            - Template literals: logger.info(`User ${id} logged in`)
            - Multiple args: logger.debug("Data:", obj) -> logger.debug({ data: obj })
            - Object logging: Properly structured as logger.info({ key: value })

    - category: log_level_accuracy
      weight: 25
      points: 25
      description: Appropriate log level selection based on context
      criteria:
        - name: level_semantics
          points: 10
          description: Log levels match message intent
          guidelines_debug: |
            Development-only info, verbose details, data dumps, 
            function entry/exit traces, internal state inspection
            Examples: "Processing item", "API response", "Raw data"
          guidelines_info: |
            Significant events, business operations, state changes,
            user actions, successful completions
            Examples: "User created", "Payment processed", "Job started"
          guidelines_warn: |
            Potential issues, recoverable errors, deprecated usage,
            unexpected but handled situations
            Examples: "Retrying connection", "Using fallback", "Rate limit near"
          guidelines_error: |
            Actual errors, failures, exceptions, unrecoverable states
            Examples: "Database connection failed", "Payment declined"

        - name: context_awareness
          points: 10
          description: Levels reflect surrounding code context
          checks:
            - Before/after significant operations -> info
            - Error handling blocks -> error or warn
            - Development helpers -> debug
            - Performance metrics -> debug

        - name: no_overuse
          points: 5
          description: No inappropriate level choices
          forbidden:
            - error for non-errors
            - warn for routine operations
            - info for development-only details

    - category: code_quality
      weight: 20
      points: 20
      description: Code structure and quality of replacements
      criteria:
        - name: structured_logging
          points: 8
          description: Proper structured logging format
          requirements:
            - Objects logged as structured data: logger.info({ userId, action })
            - Not concatenated strings (avoid: logger.info("User " + userId))
            - Template literals converted to structured when beneficial
            - Multiple arguments consolidated into object

        - name: message_clarity
          points: 6
          description: Log messages are clear and informative
          checks:
            - Message describes what happened
            - Context provided through structured fields
            - Consistent naming conventions
            - No vague messages like "here", "done", "ok"

        - name: syntax_correctness
          points: 6
          description: No syntax errors or runtime issues
          verification:
            - TypeScript compiles without errors
            - No broken imports
            - No undefined variable references
            - Proper semicolons/commas maintained

    - category: import_and_integration
      weight: 15
      points: 15
      description: Correct integration with @mirai-app/shared logger
      criteria:
        - name: import_pattern
          points: 8
          description: Proper import statement usage
          requirement: |
            All files use: import { logger } from "@mirai-app/shared";
          forbidden:
            - Relative imports to logger: import { logger } from "../../../shared"
            - Direct logger instantiation: new Logger()
            - Incorrect import paths

        - name: logger_configuration
          points: 7
          description: Logger respects existing configuration
          checks:
            - No hardcoded log levels
            - No logger configuration overrides in individual files
            - Logger instances use shared configuration

    - category: cleanup
      weight: 10
      points: 10
      description: Removal of console.warn and console.error where appropriate
      criteria:
        - name: console_warn_cleanup
          points: 5
          description: console.warn appropriately handled
          rules_keep_when: |
            - Actual warning condition (deprecated API, retry attempt)
            - Non-fatal but noteworthy issue
          rules_replace_when: |
            - Routine informational message -> logger.info
            - Development debugging -> logger.debug

        - name: console_error_cleanup
          points: 5
          description: console.error appropriately handled
          rules_keep_when: |
            - Actual error logging
            - Before throwing exceptions
            - Critical failure reporting
          rules_replace_when: |
            - Generic error message -> logger.error with structured data
            - Non-critical messages -> appropriate level

checklists:
  pre_evaluation:
    - Verify baseline: Count console.log statements before changes
    - Ensure TypeScript compilation succeeds
    - Verify @mirai-app/shared logger exists and is exportable

  post_evaluation:
    - Run: grep -r "console\.log" packages/ apps/ --include="*.ts" --include="*.tsx"
    - Result should be empty or contain only comments/documentation
    - Run: bun test (or equivalent) to ensure no regressions
    - Run: TypeScript compiler to verify no type errors
    - Verify all new imports resolve correctly
    - Check for any runtime errors in test output

verification_commands:
  coverage_check:
    description: Verify zero console.log statements remain
    command: grep -r "console\.log" packages/ apps/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "node_modules" | grep -v "\.d\.ts" | wc -l
    expected_result: "0"
    tolerance: 0

  logger_usage_check:
    description: Verify logger imports exist
    command: grep -r "from \"@mirai-app/shared\"" packages/ apps/ --include="*.ts" --include="*.tsx" | grep "logger" | wc -l
    expected_result: ">0"

  replacement_quality_check:
    description: Verify logger method calls
    command: grep -r "logger\." packages/ apps/ --include="*.ts" --include="*.tsx" | grep -E "logger\.(debug|info|warn|error)" | wc -l
    expected_result: ">=140"

  compilation_check:
    description: TypeScript compilation
    command: bunx tsc --noEmit
    expected_result: "exit code 0"

scoring_guide:
  excellent:
    range: "90-100"
    description: All console.log replaced, perfect level choices, excellent structure

  good:
    range: "85-89"
    description: All replaced, minor level mismatches or structural issues

  needs_improvement:
    range: "70-84"
    description: Most replaced, some level issues or missing structured format

  insufficient:
    range: "0-69"
    description: Significant issues - missed console.log statements, poor level choices, compilation errors

edge_cases:
  - name: commented_console_log
    handling: Ignore - commented code is not active

  - name: string_containing_console_log
    handling: Ignore - text content, not actual logging
    example: const msg = "Use console.log for debugging";

  - name: dynamic_logging
    handling: Convert to appropriate level with structured data
    example: console.log(logLevel, message) -> logger[logLevel](message)

  - name: third_party_code
    handling: Ignore if in node_modules or vendored dependencies

  - name: test_files
    handling: Can keep console.log in test setup/teardown if used for debugging
    preference: Use logger or test framework's output instead

example_transformations:
  - before: "console.log('User created', userId)"
    after: "logger.info({ userId }, 'User created')"
    level: info
    reasoning: Significant business event

  - before: "console.log('Processing items.length items')"
    after: "logger.debug({ itemCount: items.length }, 'Processing items')"
    level: debug
    reasoning: Operational detail, development visibility

  - before: "console.log('API response:', response)"
    after: "logger.debug({ response }, 'API response received')"
    level: debug
    reasoning: Data inspection for development

  - before: "console.warn('Retrying connection...')"
    after: "logger.warn({ attempt: retryCount }, 'Retrying connection')"
    level: warn
    reasoning: Recoverable issue, worth noting

  - before: "console.error('Database connection failed')"
    after: "logger.error({ error: err.message }, 'Database connection failed')"
    level: error
    reasoning: Actual error condition

failure_modes:
  critical:
    - Compilation errors
    - Runtime crashes
    - Import resolution failures
    - Logger undefined errors

  major:
    - More than 5 console.log statements remaining
    - All messages use same log level (inappropriate)
    - Loss of log message content
    - console.error used for non-errors

  minor:
    - Inconsistent formatting
    - Suboptimal level choice (less than 20 percent of logs)
    - Missing structured data where beneficial
    - Redundant logger calls

judge_instructions: |
  1. Run verification commands to establish coverage baseline
  2. Sample at least 20% of replacements for detailed review
  3. Check log level appropriateness for each sampled replacement
  4. Verify import statements are correct
  5. Run test suite to check for regressions
  6. Apply scoring rubric objectively
  7. Document specific issues found with file/line references
  8. Provide actionable feedback for any deductions

output_format:
  summary_fields:
    - total_score
    - passed
    - coverage_percentage
    - issues_found_count

  detailed_findings_structure:
    category: string
    severity: string
    location: string
    issue: string
    suggestion: string

  recommendations_structure:
    priority: string
    action: string
    rationale: string
