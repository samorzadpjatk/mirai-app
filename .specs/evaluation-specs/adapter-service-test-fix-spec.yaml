# Evaluation Specification: Adapter Service Test Fixes
#
# Purpose: Evaluate fixes for failing adapter layer service tests after business logic changes.
# Target: Service tests in packages/adapters/src/services/__tests__/
#
# Usage: This spec is designed for LLM-as-a-Judge evaluation of test file modifications.
# The judge should verify that test fixes:
# 1. Make tests pass against current implementation
# 2. Preserve original test intent
# 3. Properly mock/setup current service interfaces
# 4. Don't unnecessarily modify business logic

metadata:
  name: adapter-service-test-fix-evaluation
  version: 1.0.0
  type: test-fix-evaluation
  scope: adapter-layer-services
  applicable_paths:
    - "packages/adapters/src/services/__tests__/*.test.ts"
    - "packages/adapters/src/services/**/*.test.ts"

evaluation_context:
  layer: adapters
  test_framework: bun:test
  architecture: ddd-clean-architecture
  dependency_direction: inward-only

  # Service patterns in adapter layer
  service_types:
    - name: connection-manager
      implements: RealtimePort
      responsibilities:
        [websocket-management, connection-tracking, location-broadcast]
    - name: notification-service
      dependencies: [PrismaClient]
      responsibilities:
        [push-notifications, template-rendering, audience-filtering]
    - name: event-bus
      pattern: pub-sub
      responsibilities: [domain-event-distribution, handler-management]

# =============================================================================
# EVALUATION DIMENSIONS
# =============================================================================

dimensions:
  # ---------------------------------------------------------------------------
  # Dimension 1: Functional Correctness
  # ---------------------------------------------------------------------------
  - id: functional_correctness
    name: "Functional Correctness"
    weight: 0.35
    description: "Tests must pass and accurately validate service behavior"
    criteria:
      - id: fc_1
        description: "All tests pass when run with 'bun test <filepath>'"
        verification: "Execute test command and verify exit code 0, no failures"
        required: true

      - id: fc_2
        description: "Tests exercise actual service methods (not deleted/renamed methods)"
        verification: |
          Compare test method calls against service implementation. 
          All tested methods must exist in service with correct signatures.
          Examples:
          - ❌ Test calls registerConnection() but service has userConnected()
          - ✅ Test calls userConnected() matching actual service interface
        required: true

      - id: fc_3
        description: "Assertions validate actual return values/types from service"
        verification: |
          Check that expect() calls match actual return types:
          - For sync methods: direct value comparison
          - For async methods: proper await + value comparison
          - For Result<T,E>: unwrap and check inner value
          - For void: check side effects or mock calls
        required: true

      - id: fc_4
        description: "Mock setup matches current dependency interfaces"
        verification: |
          Verify mocks implement actual ports/repositories:
          - Mock methods match port interface signatures
          - Mock return types match expected types
          - No mocking of deleted methods
        required: true

  # ---------------------------------------------------------------------------
  # Dimension 2: Test Intent Preservation
  # ---------------------------------------------------------------------------
  - id: intent_preservation
    name: "Test Intent Preservation"
    weight: 0.25
    description: "Fixed tests must preserve the original validation goals"
    criteria:
      - id: ip_1
        description: "Test still validates the same behavioral scenario"
        verification: |
          Map each test case to its original intent:
          - "should register connection" → still tests connection registration
          - "should handle unsubscribe" → still tests unsubscribe behavior
          - If method renamed: verify same concept is tested
          - If flow changed: verify same outcome is asserted
        required: true

      - id: ip_2
        description: "Edge cases from original tests are preserved"
        verification: |
          Check for specific edge case coverage:
          - Null/undefined handling
          - Empty collections
          - Non-existent IDs
          - Error conditions
          - Boundary conditions
        required: false

      - id: ip_3
        description: "Test descriptions match actual assertions"
        verification: |
          Ensure test names accurately describe what is tested:
          - "should return notification by ID" → actually tests ID lookup
          - "should handle errors" → actually tests error paths
          No misleading test descriptions.
        required: true

  # ---------------------------------------------------------------------------
  # Dimension 3: Interface Alignment
  # ---------------------------------------------------------------------------
  - id: interface_alignment
    name: "Interface Alignment"
    weight: 0.20
    description: "Tests must align with current service interfaces and dependencies"
    criteria:
      - id: ia_1
        description: "Constructor parameters match service constructor signature"
        verification: |
          Check service instantiation in tests:
          - Correct number of dependencies passed
          - Correct dependency types
          - Required dependencies not omitted
          Examples:
          - ConnectionManager needs RealtimePort
          - NotificationService needs PrismaClient
        required: true

      - id: ia_2
        description: "Method call arguments match actual parameter types"
        verification: |
          Verify argument types in test calls match service definition:
          - Primitive types match (string, number, boolean)
          - Object shapes match expected interfaces
          - Required parameters are provided
          - Optional parameters properly handled
        required: true

      - id: ia_3
        description: "Return value handling matches actual return types"
        verification: |
          Check that tests handle return values correctly:
          - Direct values: expect(result).toBe(...)
          - Promises: await + expect(result).toBe(...)
          - Arrays: expect(result).toHaveLength(...) + toEqual expect.arrayContaining
          - Objects: expect(result).toMatchObject(...)
        required: true

  # ---------------------------------------------------------------------------
  # Dimension 4: Code Quality
  # ---------------------------------------------------------------------------
  - id: code_quality
    name: "Code Quality"
    weight: 0.15
    description: "Fixed tests follow testing best practices and project conventions"
    criteria:
      - id: cq_1
        description: "Tests use Bun test matchers correctly"
        verification: |
          Verify proper assertion patterns:
          - toBe() for primitives
          - toEqual() for objects/arrays
          - toHaveLength() for arrays
          - toMatchObject() for partial object matching
          - toHaveBeenCalled() / toHaveBeenCalledWith() for mocks
        required: true

      - id: cq_2
        description: "Async tests properly handle promises"
        verification: |
          Check async handling:
          - async/await used consistently
          - No floating promises (always awaited or returned)
          - Promise rejections properly handled in error tests
        required: true

      - id: cq_3
        description: "Test setup/teardown is appropriate and clean"
        verification: |
          Check beforeEach/afterEach:
          - Fresh instances created for each test
          - Mocks reset between tests
          - No shared mutable state across tests
          - Proper cleanup (EventBus.clear(), ConnectionManager cleanup)
        required: true

      - id: cq_4
        description: "Follows project test naming conventions"
        verification: |
          Check naming patterns:
          - describe("[UNIT] ServiceName")
          - describe("methodName") for grouping
          - it("should ...") for test cases
        required: false

  # ---------------------------------------------------------------------------
  # Dimension 5: Business Logic Preservation
  # ---------------------------------------------------------------------------
  - id: business_logic_preservation
    name: "Business Logic Preservation"
    weight: 0.05
    description: "Tests should not require changes to business logic unless bugs found"
    criteria:
      - id: blp_1
        description: "No unnecessary modifications to service implementation"
        verification: |
          Check that service files are not modified:
          - Compare service implementation against baseline
          - Only test files should change
          - If service modified, verify it's a genuine bug fix with clear rationale
        required: true

      - id: blp_2
        description: "Tests align with current (correct) behavior, not force old behavior"
        verification: |
          If service behavior changed intentionally:
          - Tests should reflect new behavior
          - Not force service to maintain old behavior
          - Not add workarounds to preserve old expectations
        required: true

# =============================================================================
# SERVICE-SPECIFIC CHECKS
# =============================================================================

service_specific_validations:
  ConnectionManager:
    required_methods:
      - userConnected(userId, connectionId, metadata?): ConnectionInfo
      - userDisconnected(userId, connectionId): boolean
      - broadcastLocation(userId, location, friendIds): Promise<BroadcastResult>
      - isUserOnline(userId): boolean
      - getConnectionCount(userId): number
      - getTotalConnectionCount(): number
    dependencies:
      - RealtimePort (required in constructor)
    common_fix_patterns:
      - "registerConnection → userConnected (with RealtimePort mock)"
      - "unregisterConnection → userDisconnected (2 parameters)"
      - "broadcast/sendToUser → broadcastLocation with proper location object"
      - "getConnectionCount() → getTotalConnectionCount() or getConnectionCount(userId)"
      - "Mock connections need to include connectedAt, lastActivityAt dates"

  NotificationService:
    required_methods:
      - sendMobileNotifications(notificationId): Promise<SendResult>
      - static createCoinsAddedNotification(groupName, amount, reason?): NotificationData
      - static createRankingUpdateNotification(groupName, newPosition): NotificationData
    dependencies:
      - PrismaClient (required in constructor)
    common_fix_patterns:
      - "getById/create/getByTripId → sendMobileNotifications"
      - "Mock PrismaClient with notification, notificationPush, pushSubscription models"
      - "Tests focus on sendMobileNotifications flow, not CRUD operations"

  EventBus:
    required_methods:
      - subscribe(eventType, handler): EventSubscription
      - subscribeAll(handler): EventSubscription
      - publish(event): void
      - getHandlerCount(eventType): number
      - clear(): void
    event_type_requirements:
      - "Tests should use DomainEvent objects, not string event names"
      - "Handler functions receive typed event objects"
      - "Unsubscribe returns void, not a function"
    common_fix_patterns:
      - "'test-event' string → actual DomainEvent class instance"
      - "handler as callback function → EventHandler<TEvent> type"
      - "unsubscribe() is called on returned subscription object"

# =============================================================================
# SCORING
# =============================================================================

scoring:
  scale: 0-5
  thresholds:
    reject: 3.0 # Below 3.0: reject, needs revision
    accept: 4.0 # 3.0-4.0: minor revisions needed
    excellent: 4.5 # 4.5+: approved

  weights_by_dimension:
    functional_correctness: 0.35
    intent_preservation: 0.25
    interface_alignment: 0.20
    code_quality: 0.15
    business_logic_preservation: 0.05

  scoring_guidance:
    5: "Perfect - all tests pass, intent preserved, clean implementation"
    4: "Good - tests pass with minor issues (naming, cleanup, edge cases)"
    3: "Acceptable - tests pass but some intent lost or quality issues"
    2: "Poor - some tests fail or significant intent deviation"
    1: "Very Poor - most tests fail or major interface mismatch"
    0: "Unacceptable - no tests pass or completely wrong approach"

# =============================================================================
# DECISION MATRIX
# =============================================================================

decision_matrix:
  auto_reject_conditions:
    - condition: "Any required criterion fails (fc_1, fc_2, ia_1, blp_1)"
      action: "REJECT - Critical failure, must fix"
    - condition: "Functional correctness score < 0.6 (dimension weight * 0.6)"
      action: "REJECT - Tests don't pass or don't test right things"
    - condition: "Tests modified service implementation without clear bug rationale"
      action: "REJECT - Should only fix tests, not business logic"

  revision_conditions:
    - condition: "Total score between 3.0 and 4.0"
      action: "REVISE - Minor fixes needed (naming, assertions, cleanup)"
    - condition: "Intent preservation score < 0.6"
      action: "REVISE - Some test scenarios lost, needs review"
    - condition: "Code quality issues (unused imports, poor naming)"
      action: "REVISE - Clean up code quality issues"

  accept_conditions:
    - condition: "Total score >= 4.0 and all required criteria pass"
      action: "ACCEPT - Good to merge"
    - condition: "Score >= 4.5 with all dimensions >= 0.7"
      action: "ACCEPT_EXCELLENT - High quality fix"

# =============================================================================
# EVALUATION WORKFLOW
# =============================================================================

evaluation_steps:
  1_read_baseline:
    description: "Read original failing test file and current service implementation"
    inputs:
      - test_file_path
      - service_implementation_path
    outputs:
      - original_test_structure
      - current_service_interface
      - mismatch_analysis

  2_read_fixed:
    description: "Read the fixed test file"
    inputs:
      - fixed_test_file_path
    outputs:
      - fixed_test_structure

  3_execute_tests:
    description: "Run tests to verify functional correctness"
    command: "bun test {test_file_path}"
    outputs:
      - test_results (pass/fail counts)
      - error_messages (if any)

  4_analyze_dimensions:
    description: "Score each evaluation dimension"
    dimensions:
      - functional_correctness
      - intent_preservation
      - interface_alignment
      - code_quality
      - business_logic_preservation

  5_calculate_score:
    description: "Calculate weighted total score"
    formula: "sum(dimension_score * dimension_weight)"

  6_apply_decision:
    description: "Apply decision matrix based on score and criteria"
    output: "ACCEPT / REVISE / REJECT with rationale"

# =============================================================================
# OUTPUT FORMAT
# =============================================================================

output_template: |
  ## Evaluation Summary

  **Target:** {test_file_path}
  **Overall Score:** {total_score}/5.0 ({grade})
  **Decision:** {decision}

  ### Dimension Scores
  | Dimension | Weight | Score | Weighted |
  |-----------|--------|-------|----------|
  | Functional Correctness | 0.35 | {fc_score} | {fc_weighted} |
  | Intent Preservation | 0.25 | {ip_score} | {ip_weighted} |
  | Interface Alignment | 0.20 | {ia_score} | {ia_weighted} |
  | Code Quality | 0.15 | {cq_score} | {cq_weighted} |
  | Business Logic Preservation | 0.05 | {blp_score} | {blp_weighted} |

  ### Test Results
  - **Passing:** {pass_count}/{total_count}
  - **Command:** bun test {test_file_path}

  ### Detailed Analysis

  **Functional Correctness:**
  {fc_analysis}

  **Intent Preservation:**
  {ip_analysis}

  **Interface Alignment:**
  {ia_analysis}

  **Code Quality:**
  {cq_analysis}

  **Business Logic Preservation:**
  {blp_analysis}

  ### Issues Found
  {issues_list}

  ### Recommendations
  {recommendations}

  ### Verdict
  **{decision}** - {decision_rationale}
