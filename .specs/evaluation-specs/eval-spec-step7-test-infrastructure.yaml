# Evaluation Specification: Step 7 - Update Test Infrastructure
# Migration: awilix-modular DI → Effect Context/Layer System

metadata:
  artifact_type: code
  version: "1.0.0"
  step: 7
  step_name: "Update Test Infrastructure"
  migration_phase: final
  previous_steps_complete: [1, 2, 3, 4, 5, 6]
  evaluation_date: "{{evaluation_date}}"
  evaluator_version: "1.0"

scope:
  file_patterns:
    - "packages/domain/**/*.test.ts"
    - "packages/use-cases/**/*.test.ts"
    - "packages/adapters/__tests__/**/*.test.ts"
    - "packages/adapters/src/**/*.test.ts"
    - "apps/**/__tests__/**/*.test.ts"
    - "packages/frameworks/**/test-utils.ts"
    - "packages/frameworks/**/test-helpers.ts"
    - "**/test-container.ts"
    - "**/createTestContainer*"
  exclude_patterns:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "*.d.ts"
  entry_points:
    - "packages/frameworks/di/index.ts"
    - "packages/frameworks/di/test-utils.ts"
    - "packages/use-cases/src/ports/*.ts"

rubrics:
  - id: "r1"
    name: "Layer Migration Completeness"
    description: "All test utilities migrated from awilix createTestContainer to Effect Layer system"
    weight: 25
    max_score: 5
    scoring:
      5: |
        All test utilities fully migrated:
        - No createTestContainer function exists in codebase
        - All test utilities use Layer.succeed for mocking
        - Proper Layer composition patterns used
        - Test helper functions return Layer<...> types
        - No awilix imports in any test files
      4: |
        Nearly complete migration:
        - createTestContainer exists only in 1-2 legacy files
        - 90%+ of tests use Layer.succeed
        - Minor awilix references remain (non-critical)
      3: |
        Partial migration:
        - createTestContainer still used in multiple places
        - Mix of Layer and awilix patterns
        - Inconsistent mocking approaches
      2: |
        Incomplete migration:
        - Majority still using createTestContainer
        - Layer.succeed used sporadically
        - Significant awilix dependencies remain
      1: |
        Minimal migration:
        - createTestContainer is primary pattern
        - Few or no Layer.succeed usages
        - Heavy awilix dependency
      0: |
        No migration:
        - All tests use createTestContainer
        - No Effect Layer usage in tests

  - id: "r2"
    name: "Layer.succeed Mocking Quality"
    description: "Correct usage of Layer.succeed for repository and service mocking"
    weight: 20
    max_score: 5
    scoring:
      5: |
        Excellent mocking patterns:
        - Layer.succeed used with correct Context.Tag types
        - Mock implementations return proper Effect types
        - Both success and failure cases mocked appropriately
        - Layer composition uses Layer.provide, Layer.merge correctly
        - No Effect.runPromise in mock definitions (pure Layer)
      4: |
        Good mocking patterns:
        - Layer.succeed used correctly in most cases
        - Minor type mismatches in 1-2 places
        - Layer composition mostly correct
      3: |
        Acceptable mocking:
        - Layer.succeed used but with some type errors
        - Some mocks still use Promise instead of Effect
        - Layer composition has minor issues
      2: |
        Poor mocking patterns:
        - Incorrect Layer.succeed usage
        - Significant type mismatches
        - Improper Effect/Promise mixing
      1: |
        Very poor:
        - Layer.succeed misunderstood/misused
        - Mocks don't return Effect types
      0: |
        No Layer.succeed usage or completely incorrect

  - id: "r3"
    name: "Controller Test AppLayer Integration"
    description: "Controller tests properly construct and pass AppLayer to controller constructors"
    weight: 20
    max_score: 5
    scoring:
      5: |
        Perfect AppLayer integration:
        - Controllers instantiated with AppLayer via constructor
        - Layer.provide(appLayer) used correctly in tests
        - Layer.build(appLayer) or similar patterns work
        - All required dependencies provided via Layer
        - No manual dependency injection
      4: |
        Good integration:
        - AppLayer passed correctly in 90%+ of controller tests
        - Minor issues with Layer provision
        - All dependencies covered
      3: |
        Acceptable:
        - AppLayer used but some tests still use old patterns
        - Some missing dependency provisions
        - Layer composition incomplete in places
      2: |
        Poor integration:
        - Controllers not receiving AppLayer properly
        - Many tests failing to use Layer patterns
      1: |
        Very poor:
        - AppLayer concept misunderstood
        - Controllers instantiated incorrectly
      0: |
        No AppLayer usage in controller tests

  - id: "r4"
    name: "Effect Pattern Correctness"
    description: "Tests use proper Effect patterns (Effect.gen, Effect.provide, Effect.runPromise)"
    weight: 15
    max_score: 5
    scoring:
      5: |
        Excellent Effect patterns:
        - Effect.gen used for test workflows (where needed)
        - Effect.provide used for dependency injection
        - Effect.runPromise at test boundary only
        - Effect.either used for error case testing
        - No async/await inside Effect.gen
        - Proper yield* usage
      4: |
        Good patterns:
        - Mostly correct Effect usage
        - Minor async/await inside gen in 1-2 places
        - Proper provide/runPromise separation
      3: |
        Acceptable:
        - Effect used but some anti-patterns present
        - Some unnecessary async/await
        - Occasional misuse of runPromise
      2: |
        Poor:
        - Significant anti-patterns
        - Effect.runPromise inside gen
        - Improper error handling
      1: |
        Very poor:
        - Effect patterns misunderstood
        - Treating Effect as Promise
      0: |
        No proper Effect usage

  - id: "r5"
    name: "Test Coverage Maintenance"
    description: "Test coverage maintained at or above pre-migration levels"
    weight: 10
    max_score: 5
    scoring:
      5: |
        Coverage maintained or improved:
        - Line coverage >= pre-migration level
        - All critical paths still tested
        - No test files deleted without replacement
        - New Layer-based tests cover same scenarios
        - Error cases still tested
      4: |
        Minor coverage drop:
        - <5% coverage decrease
        - All important paths still covered
        - One or two edge cases lost
      3: |
        Moderate coverage drop:
        - 5-10% coverage decrease
        - Some scenarios not covered
        - Missing error case tests
      2: |
        Significant coverage drop:
        - 10-20% coverage decrease
        - Many scenarios untested
      1: |
        Major coverage loss:
        - >20% coverage decrease
        - Critical paths untested
      0: |
        No meaningful test coverage

  - id: "r6"
    name: "Test Execution Success"
    description: "All tests pass with the new Layer-based infrastructure"
    weight: 10
    max_score: 5
    scoring:
      5: |
        All tests pass:
        - bun test exits with code 0
        - No test failures in any package
        - No test timeouts
        - No test hanging
        - Unit tests pass
        - Integration tests pass (if applicable)
      4: |
        Nearly all pass:
        - 95%+ tests pass
        - 1-2 flaky or failing tests
      3: |
        Most pass:
        - 80-95% tests pass
        - Some consistent failures
      2: |
        Many failures:
        - 50-80% tests pass
        - Significant issues
      1: |
        Mostly failing:
        - <50% tests pass
      0: |
        Tests don't run or all fail

checklists:
  must_have:
    - id: "c1"
      description: "createTestContainer function completely removed from codebase"
      verification: "grep -r 'createTestContainer' --include='*.ts' packages/ apps/ | wc -l == 0"
      critical: true

    - id: "c2"
      description: "No awilix imports in any test files"
      verification: "grep -r 'awilix' --include='*.test.ts' packages/ apps/ | wc -l == 0"
      critical: true

    - id: "c3"
      description: "No awilix-modular imports in framework test utils"
      verification: "grep -r 'awilix-modular' packages/frameworks/ | wc -l == 0"
      critical: true

    - id: "c4"
      description: "All controller tests use Layer.provide with AppLayer"
      verification: "grep -r 'Layer.provide' --include='*.test.ts' packages/adapters/ apps/ | grep -c 'test' > 0"
      critical: true

    - id: "c5"
      description: "Test utilities export Layer-based helpers"
      verification: "grep -r 'export.*Layer' packages/frameworks/**/test*.ts | wc -l > 0"
      critical: true

    - id: "c6"
      description: "Repository mocks use Layer.succeed with correct Context.Tag"
      verification: "grep -r 'Layer.succeed' --include='*.test.ts' packages/ | grep -c 'Repository' > 0"
      critical: true

  should_have:
    - id: "s1"
      description: "Mock layers properly typed with Layer<...> return types"
      verification: "TypeScript compilation succeeds with strict mode"
      critical: false

    - id: "s2"
      description: "Test helpers for common mock combinations exist"
      verification: "Files like 'test-layers.ts' or 'mock-layers.ts' exist in frameworks"
      critical: false

    - id: "s3"
      description: "Error case tests use Effect.either or Effect.catchAll"
      verification: "grep -rE 'Effect.either|catchAll' --include='*.test.ts' packages/ | wc -l > 0"
      critical: false

    - id: "s4"
      description: "Success and failure scenarios both tested for each use case"
      verification: "Each use case test file has at least 2 test cases"
      critical: false

    - id: "s5"
      description: "No manual mock objects (awilix-style) remain"
      verification: "No 'asFunction', 'asClass', 'asValue' patterns in tests"
      critical: false

  nice_to_have:
    - id: "n1"
      description: "Pre-built mock layers for common scenarios (happy path, error cases)"
      verification: "Named exports like 'HappyPathLayer', 'ErrorLayer' exist"
      critical: false

    - id: "n2"
      description: "Test composition utilities (combineLayers, mergeMocks)"
      verification: "Helper functions for Layer composition in test utils"
      critical: false

    - id: "n3"
      description: "Documentation/comments explaining Layer mocking patterns"
      verification: "README or comments in test utility files"
      critical: false

    - id: "n4"
      description: "Coverage reports generated and visible"
      verification: "bun test --coverage runs successfully"
      critical: false

scoring_criteria:
  minimum_passing_score: 3.5
  target_score: 4.5
  critical_threshold: |
    All critical checklist items (c1-c6) must pass.
    Any critical failure = automatic rejection regardless of total score.

  weights_summary:
    Layer Migration Completeness: 25%
    Layer.succeed Mocking Quality: 20%
    Controller Test AppLayer Integration: 20%
    Effect Pattern Correctness: 15%
    Test Coverage Maintenance: 10%
    Test Execution Success: 10%

  grade_mapping:
    4.5-5.0: "Excellent - Step 7 complete, ready for production"
    4.0-4.4: "Good - Minor issues, may proceed with notes"
    3.5-3.9: "Acceptable - Address issues before merging"
    3.0-3.4: "Below Standard - Significant rework needed"
    2.0-2.9: "Poor - Major rework required"
    0.0-1.9: "Unacceptable - Start over with guidance"

validation_commands:
  pre_check:
    - "bun install"
    - "bun run build || echo 'Build may have expected errors during migration'"

  primary_validation:
    - command: "bun test"
      expected_exit_code: 0
      timeout_seconds: 120
      description: "All tests must pass"

  post_check:
    - command: "bun test --coverage"
      expected_exit_code: 0
      timeout_seconds: 180
      description: "Coverage check with tests passing"

  static_analysis:
    - command: "grep -r 'createTestContainer' --include='*.ts' packages/ apps/ || echo 'No createTestContainer found - GOOD'"
      expected_output_contains: "No createTestContainer found"
      description: "Verify createTestContainer is removed"

    - command: "grep -r 'awilix' --include='*.test.ts' packages/ apps/ || echo 'No awilix in tests - GOOD'"
      expected_output_contains: "No awilix in tests"
      description: "Verify no awilix in test files"

    - command: "grep -r 'Layer.succeed' --include='*.ts' packages/ | wc -l"
      expected_output_min: 5
      description: "Verify Layer.succeed is being used"

artifact_requirements:
  required_structure:
    - "packages/frameworks/di/ must export test layer utilities OR be removed if no longer needed"
    - "Each test file uses Effect.provide for dependency injection"
    - "Controller tests instantiate with new Controller(appLayer) pattern"
    - "Repository mocks defined as Layer.succeed(RepositoryTag, mockImpl)"

  patterns_to_eliminate:
    - "createTestContainer imports and usage"
    - "asClass, asFunction, asValue from awilix"
    - "container.resolve() in tests"
    - "container.register() in tests"
    - "Lifetime.SINGLETON, Lifetime.SCOPED patterns"
    - "async/await inside Effect.gen (anti-pattern)"

  patterns_to_establish:
    - "Layer.succeed(Tag, implementation) for mocks"
    - "Layer.provide(layer) or Effect.provide(layer) for injection"
    - "Effect.runPromise at test boundary"
    - "MockLayer.merge for combining dependencies"
    - "Effect.either for testing error cases"

failure_conditions:
  automatic_rejection:
    - "Any critical checklist item fails"
    - "bun test fails with >20% test failure rate"
    - "createTestContainer still exists in active test code"
    - "awilix imports remain in test files"
    - "Controllers not receiving AppLayer in tests"

  requires_remediation:
    - "Coverage drops >5%"
    - "Effect anti-patterns in >30% of tests"
    - "Layer.succeed used incorrectly in >5 places"

judge_instructions: |
  ## Evaluation Process

  1. **Static Analysis First:**
     - Run grep commands to verify createTestContainer removal
     - Check for awilix remnants
     - Verify Layer.succeed adoption

  2. **Test Execution:**
     - Run bun test and capture results
     - Verify exit code is 0
     - Note any failing tests

  3. **Coverage Check:**
     - Run bun test --coverage
     - Compare with pre-migration coverage (if available)
     - Flag significant drops

  4. **Code Review (Sample):**
     - Review 3-5 controller test files
     - Review test utility files
     - Verify Effect patterns are correct
     - Check Layer composition quality

  5. **Scoring:**
     - Score each rubric 0-5 based on evidence
     - Apply weights to calculate final score
     - Verify all critical checklist items pass
     - Assign final grade

  ## Key Questions to Answer

  - Are all test utilities migrated to Layer.succeed?
  - Do controllers receive AppLayer properly in tests?
  - Are Effect patterns used correctly (no async in gen)?
  - Do all tests pass?
  - Is coverage maintained?
  - Are there any awilix remnants?

  ## Common Issues to Watch For

  1. **Layer.succeed misuse:** Mocks returning Promises instead of Effects
  2. **Missing Effect.provide:** Tests trying to run Effects without providing dependencies
  3. **async/await in Effect.gen:** Breaking Effect's fiber system
  4. **Incomplete migration:** Some tests still using createTestContainer
  5. **Type errors:** Layer types not matching expected Context.Tag types
  6. **Test coverage loss:** Error cases no longer tested

examples:
  excellent_example: |
    // packages/use-cases/src/interactors/CreateUser.test.ts
    import { describe, it, expect } from "bun:test";
    import { Effect, Layer } from "effect";
    import { CreateUserUseCase } from "./CreateUser";
    import { UserRepository } from "../ports/UserRepository";

    // Layer.succeed for mock repository
    const createMockUserRepo = () =>
      Layer.succeed(UserRepository, {
        findById: (id: string) => Effect.succeed(null),
        findByEmail: (email: string) => Effect.succeed(null),
        save: (user: any) => Effect.succeed(user),
      });

    describe("[UNIT] CreateUserUseCase", () => {
      it("creates user successfully", async () => {
        const useCase = new CreateUserUseCase();
        const mockLayer = createMockUserRepo();

        const program = useCase
          .execute({ email: "test@example.com", name: "Test" })
          .pipe(Effect.provide(mockLayer));

        const result = await Effect.runPromise(program);
        expect(result.email).toBe("test@example.com");
      });

      it("fails when email already exists", async () => {
        const useCase = new CreateUserUseCase();
        const mockLayer = Layer.succeed(UserRepository, {
          findById: (id: string) => Effect.succeed(null),
          findByEmail: () => Effect.succeed({ id: "1", email: "exists@example.com" }),
          save: (user: any) => Effect.succeed(user),
        });

        const program = useCase
          .execute({ email: "exists@example.com", name: "Test" })
          .pipe(Effect.provide(mockLayer));

        const either = await Effect.runPromise(Effect.either(program));
        expect(either._tag).toBe("Left");
      });
    });

  poor_example: |
    // BAD: Still using awilix patterns
    import { createTestContainer } from "@mirai-app/frameworks/di";
    import { asClass } from "awilix";

    describe("CreateUserUseCase", () => {
      it("creates user", async () => {
        const container = createTestContainer();
        container.register({
          userRepository: asClass(MockUserRepository).singleton(),
        });
        const useCase = container.resolve("createUserUseCase");
        const result = await useCase.execute({ email: "test@example.com" });
        expect(result).toBeDefined();
      });
    });

    // BAD: Incorrect Effect patterns
    describe("CreateUserUseCase", () => {
      it("creates user", async () => {
        const useCase = new CreateUserUseCase();
        // Wrong: No Effect.provide
        const result = await useCase.execute({ email: "test@example.com" });
        expect(result).toBeDefined();
      });
    });

    // BAD: async/await inside Effect.gen
    const program = Effect.gen(function* () {
      const repo = yield* UserRepository;
      // WRONG: async/await breaks Effect fiber
      const user = await repo.findById("1");
      return user;
    });

