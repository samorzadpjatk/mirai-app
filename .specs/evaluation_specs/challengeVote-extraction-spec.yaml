  architecture_rules:
    - rule: Dependency Direction
      description: Dependencies must flow inward only
      violation_penalty: -5
      checks:
        - "Domain has no external dependencies"
        - "Use cases only depend on domain"
        - "Adapters depend on use cases and domain"
        - "Frameworks only depend on adapters"

    - rule: Result Type Usage
      description: Domain and Use Cases must use Result<T,E>
      violation_penalty: -3
      checks:
        - "Domain entities return Result from create()"
        - "Domain entities return Result from business methods"
        - "Use cases return Result from execute()"
        - "No throwing exceptions in domain or use cases"

    - rule: Immutability
      description: Domain entities must be immutable
      violation_penalty: -2
      checks:
        - "All entity properties are readonly"
        - "Update methods return new instances"
        - "No mutation of entity state"

  global_requirements:
    - requirement: All Tests Pass
      command: "bun test"
      must_pass: true

    - requirement: Build Succeeds
      command: "bun run build"
      must_pass: true

    - requirement: Dependency Cruiser
      command: "bunx dependency-cruiser --validate .dependency-cruiser.cjs ."
      must_pass: true

    - requirement: File Count Check
      description: Verify all required files exist
      required_files:
        - packages/domain/src/entities/ChallengeVote.ts
        - packages/domain/src/entities/ChallengeVote.test.ts
        - packages/domain/src/value-objects/ChallengeVoteId.ts
        - packages/domain/src/value-objects/VotePosition.ts
        - packages/use-cases/src/ports/ChallengeVoteRepository.ts
        - packages/use-cases/src/interactors/GetChallengeVotingProgress.ts
        - packages/use-cases/src/interactors/SubmitVote.ts
        - packages/use-cases/src/interactors/ForceEndVoting.ts
        - packages/adapters/src/controllers/challengeVote-controller.ts
        - packages/adapters/src/gateways/PrismaChallengeVoteRepository.ts
        - packages/adapters/src/mappers/ChallengeVoteMapper.ts
        - packages/trpc/src/api/routers/challengeVote.ts

  scoring:
    max_score: 100
    passing_threshold: 85
    weights:
      domain_layer: 25
      value_objects: 10
      use_cases: 20
      controller: 15
      repository: 15
      framework_layer: 15
    penalties:
      dependency_violation: -5
      missing_tests: -10
      build_failure: -20
      test_failure: -20
      router_too_long: -15

  judge_instructions: |
    # ChallengeVote Extraction Evaluation Guide

    ## Evaluation Process

    1. **File Inventory**: Verify all required files exist using global_requirements
    2. **Layer-by-Layer Review**: Evaluate each layer independently
    3. **Architecture Check**: Run dependency-cruiser and verify rules
    4. **Test Execution**: Run bun test to verify all tests pass
    5. **Build Check**: Run bun run build to verify compilation

    ## Key Things to Verify

    ### Domain Purity
    - Domain layer imports NOTHING from outside packages/domain
    - All business logic uses pure functions
    - Result<T,E> used throughout (not try/catch or exceptions)

    ### Use Case Orchestration
    - Use cases don't duplicate business logic
    - Use cases properly orchestrate repositories and domain
    - Repository interfaces are in use-cases/ports/

    ### Adapter Responsibility
    - Controller only validates and delegates
    - Gateway implements repository interface
    - Mapper handles all Prisma <-> Domain conversions

    ### Framework Thinning
    - Router must be <50 lines
    - Router has NO business logic
    - Router only wires controller to tRPC

    ## Common Issues to Watch For

    1. **Domain Leak**: Prisma types or tRPC types in domain
    2. **Logic Duplication**: Business rules in use cases instead of domain
    3. **Fat Controller**: Validation + transformation + orchestration in controller
    4. **Router Bloat**: Router still has >100 lines with business logic
    5. **Missing Tests**: No co-located tests for domain or use cases

    ## Scoring Calculation

    1. Calculate weighted scores for each layer
    2. Apply architecture rule penalties
    3. Subtract penalties for failures
    4. Final score must be >= 85 to pass

    ## Decision Matrix

    | Condition | Action |
    |-----------|--------|
    | Score >= 85 AND all must_pass checks pass | APPROVE |
    | Score < 85 OR any must_pass check fails | REJECT |
    | Router >50 lines | Automatic REJECT |
    | Build fails | Automatic REJECT |
    | Tests fail | Automatic REJECT |
    | Dependency violation in Domain | Automatic REJECT |
