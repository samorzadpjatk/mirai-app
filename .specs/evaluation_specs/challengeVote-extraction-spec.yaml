          scoring:
            meets_all: 5
            meets_most: 4
            meets_some: 3
            meets_few: 2
            missing: 0

        - criterion: Business Logic
          weight: 30
          description: Pure business logic without external dependencies
          checks:
            - "All business logic is pure (no side effects)"
            - "No imports from external frameworks (no Prisma, no tRPC, etc.)"
            - "Proper validation of business invariants"
            - "Business methods return new instances (immutable updates)"
          scoring:
            meets_all: 5
            meets_most: 4
            meets_some: 3
            meets_few: 2
            missing: 0

        - criterion: Testing
          weight: 20
          description: Comprehensive co-located unit tests
          checks:
