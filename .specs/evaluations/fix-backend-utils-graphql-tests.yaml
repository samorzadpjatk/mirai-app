  - target: apps/backend-server/src/utils/__tests__/headers.test.ts
    fixes:
      - type: create_missing_module
        description: Create the missing headers.ts utility module
        module_path: apps/backend-server/src/utils/headers.ts
        implementation: |
          import type { FastifyRequest } from "fastify";

          /**
           * Convert Fastify headers to Fetch API Headers
           * Handles string values, array values (multi-value headers), 
           * undefined values, and type conversions.
           */
          export function fastifyHeadersToFetchHeaders(
            headers: FastifyRequest["headers"],
          ): Headers {
            const result = new Headers();
            
            if (!headers || typeof headers !== "object") {
              return result;
            }
            
            for (const [key, value] of Object.entries(headers)) {
              if (value === undefined) {
                continue;
              }
              
              if (Array.isArray(value)) {
                for (const item of value) {
                  if (typeof item === "string") {
                    result.append(key, item);
                  }
                }
              } else if (typeof value === "string") {
                result.set(key, value);
              } else if (value !== null) {
                // Convert non-string values (numbers, booleans) to string
                result.set(key, String(value));
              }
            }
            
            console.log("Converted Fastify headers to Fetch headers:", result);
            return result;
          }
        reason: |
          The app migrated from Fastify to Hono but the test file still 
          exists and expects this utility. Create the missing module to 
          satisfy the test imports and preserve test coverage.

    verification_commands:
      - bun test apps/backend-server/src/utils/__tests__/headers.test.ts

    success_criteria:
