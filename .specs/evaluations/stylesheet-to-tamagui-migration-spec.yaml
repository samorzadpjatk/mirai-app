# Reusable Evaluation Specification: StyleSheet to Tamagui Migration
# Applies to: ANY React Native component file undergoing migration
# Version: 1.0.0

evaluation_spec:
  # ===============================
  # MIGRATION TASK DESCRIPTION
  # ===============================
  task:
    name: "StyleSheet to Tamagui Migration"
    description: >
      Migrate a React Native component file from StyleSheet.create() based styling
      to Tamagui UI component library styling using @mirai-app/ui package.

  # ===============================
  # PASS/FAIL CRITERIA (Binary Checks)
  # ===============================
  binary_checks:
    - id: "CHECK-001"
      name: "No StyleSheet Import"
      description: "StyleSheet import from 'react-native' must be removed"
      severity: "BLOCKING"
      condition: |
        The target file MUST NOT contain:
        - import { ..., StyleSheet, ... } from 'react-native'
        - import { StyleSheet } from 'react-native'
        - Any StyleSheet reference in imports
      pass_criteria: |
        - No StyleSheet import exists in the file
        - Other react-native imports (View, Text, etc.) may remain or be replaced

    - id: "CHECK-002"
      name: "No StyleSheet.create Call"
      description: "All StyleSheet.create() calls must be removed"
      severity: "BLOCKING"
      condition: |
        The target file MUST NOT contain:
        - const styles = StyleSheet.create({...})
        - Any StyleSheet.create() invocation
      pass_criteria: |
        - No StyleSheet.create() call exists in the file
        - No 'styles' object is defined via StyleSheet.create()
        - Existing style objects may be converted to Tamagui props or kept as plain objects

    - id: "CHECK-003"
      name: "No Invalid Styles Imports"
      description: "Imports from ~/styles or relative paths to styles must be removed"
      severity: "BLOCKING"
      condition: |
        The target file MUST NOT contain imports from:
        - '~/styles' (aliased path to styles)
        - '../../../styles' (relative path up to styles)
        - '../../../../styles' (deeper relative path to styles)
        - Any path ending in '/styles' for non-Tamagui imports
        - Specific named imports: colors, spacing, typography, borderRadius, shadows, etc. from styles paths
      pass_criteria: |
        - No import statement references '~/styles' or relative paths to 'styles'
        - No named imports (colors, spacing, typography, borderRadius, shadows) from styles paths
        - Theme tokens from Tamagui (e.g., '$color', '$spacing') are allowed and encouraged

    - id: "CHECK-004"
      name: "Valid Tamagui Imports Present"
      description: "Required Tamagui components imported from @mirai-app/ui"
      severity: "BLOCKING"
      condition: |
        The target file MUST import necessary Tamagui components from @mirai-app/ui:
        - At minimum: YStack, XStack, or ZStack for layouts
        - Text for typography (if file contains text)
        - View, ScrollView from tamagui (if needed)
        - styled utility (if creating styled variants)
      pass_criteria: |
        - import statement exists from '@mirai-app/ui'
        - At least one Tamagui layout component (YStack/XStack/ZStack) is imported
        - If file had Text components, Text from Tamagui is imported
        - Tamagui imports replace or supplement react-native imports

    - id: "CHECK-005"
      name: "No Runtime Errors"
      description: "Migration must not introduce JavaScript/TypeScript runtime errors"
      severity: "BLOCKING"
      condition: |
        The target file MUST be syntactically valid and runnable
      pass_criteria: |
        - No undefined variable references (e.g., referencing old 'styles' object)
        - No missing imports for components being used
        - All JSX elements have matching closing tags
        - Props are valid for Tamagui components

    - id: "CHECK-006"
      name: "No TypeScript Errors"
      description: "Migration must not introduce TypeScript type errors"
      severity: "BLOCKING"
      condition: |
        The target file MUST pass TypeScript type checking
      pass_criteria: |
        - No type errors on component imports
        - No type errors on prop usage
        - TypeScript recognizes Tamagui component props correctly

  # ===============================
  # QUALITY CRITERIA (Graded Checks)
  # ===============================
  quality_checks:
    - id: "QUAL-001"
      name: "Style Props Converted to Tamagui Format"
      weight: 20
      max_score: 5
      description: "Inline styles properly converted to Tamagui-compatible props"
      scoring_rubric:
        5: |
          Excellent: All style properties converted to Tamagui props with theme tokens:
          - padding, margin use '$' tokens (e.g., padding="$4", margin="$2")
          - Colors use theme tokens (e.g., color="$color", backgroundColor="$background")
          - Flex layout uses Tamachi props (flex, alignItems, justifyContent)
          - No inline style={{}} objects on Tamagui components
        4: |
          Good: Most style properties converted:
          - Mix of theme tokens and numeric values where appropriate
          - Some inline styles may remain for edge cases
          - Overall Tamagui-first approach
        3: |
          Acceptable: Basic conversion done:
          - StyleSheet references removed
          - Some Tamagui props used but inconsistent
          - May still have style={{}} on some components
        2: |
          Poor: Partial conversion:
          - StyleSheet removed but replaced with inline style={{}} objects
          - Minimal use of Tamagui theme tokens
          - Many numeric values instead of token references
        1: |
          Minimal: Token effort:
          - StyleSheet.create removed but props not properly converted
          - Relies heavily on style={{}} with old style object content
        0: |
          Failed: No meaningful conversion of style properties

    - id: "QUAL-002"
      name: "Visual Appearance Preserved"
      weight: 25
      max_score: 5
      description: "Spacing, colors, and layout appearance maintained after migration"
      scoring_rubric:
        5: |
          Excellent: Visual fidelity fully preserved:
          - All padding values maintained or mapped to equivalent tokens
          - All margin values maintained or mapped to equivalent tokens
          - Background colors maintained using theme tokens
          - Text colors and typography maintained
          - Border radius values preserved
          - Layout structure (flex, alignment) preserved
          - Shadows/effects maintained or reasonably approximated
        4: |
          Good: Minor visual differences:
          - Slight differences in spacing due to token approximation
          - Color shifts due to theme token mapping
          - Overall layout and structure intact
        3: |
          Acceptable: Some visual differences:
          - Noticeable but acceptable changes in spacing
          - Colors may differ but within theme palette
          - Core layout preserved
        2: |
          Poor: Significant visual changes:
          - Major spacing differences
          - Layout structure compromised
          - Visual hierarchy affected
        1: |
          Minimal: Major visual regression:
          - Layout broken
          - Colors/scheme vastly different
          - Component appearance unrecognizable
        0: |
          Failed: Visual appearance completely broken or not assessable

    - id: "QUAL-003"
      name: "Component Semantics Correct"
      weight: 15
      max_score: 5
      description: "Appropriate Tamagui components used for each UI element"
      scoring_rubric:
        5: |
          Excellent: Perfect component mapping:
          - View replaced with YStack/XStack as appropriate for layout direction
          - Text replaced with Tamagui Text
          - ScrollView replaced with Tamagui ScrollView
          - TouchableOpacity/Pressable use Tamagui-compatible patterns
          - Proper stack nesting (YStack for vertical, XStack for horizontal)
        4: |
          Good: Appropriate component choices:
          - Mostly correct component replacements
          - May use View in some places where stack would be better
          - Overall Tamagui component usage
        3: |
          Acceptable: Basic component replacement:
          - Components replaced but not always optimal choice
          - May over-use YStack where XStack would be semantically better
          - Still achieves functional layout
        2: |
          Poor: Inconsistent component usage:
          - Mix of react-native and Tamagui components without strategy
          - Component choices don't match layout intent
        1: |
          Minimal: Minimal component replacement:
          - Mostly still using react-native components
          - Tamagui components only sporadically used
        0: |
          Failed: No component replacement done

    - id: "QUAL-004"
      name: "Code Quality and Idiomatic Usage"
      weight: 15
      max_score: 5
      description: "Tamagui code follows idiomatic patterns and best practices"
      scoring_rubric:
        5: |
          Excellent: Idiomatic Tamagui usage:
          - Uses theme tokens consistently ($color, $background, $spacing values)
          - Leverages Tamagui's prop shorthand (p, m, px, py, gap, etc.)
          - Proper use of styled() for repeated patterns
          - Clean, readable prop usage
          - No leftover code or comments from migration
        4: |
          Good: Mostly idiomatic:
          - Good use of theme tokens
          - Some prop shorthand usage
          - Clean code structure
        3: |
          Acceptable: Basic Tamagui usage:
          - Uses some theme tokens
          - Full prop names instead of shorthands
          - Functional but not optimized
        2: |
          Poor: Inconsistent patterns:
          - Mix of Tamagui and non-idiomatic patterns
          - Hardcoded values where tokens exist
          - Some confusion in prop usage
        1: |
          Minimal: Poor Tamagui usage:
          - Mostly hardcoded values
          - No use of theme tokens
          - Doesn't leverage Tamagui features
        0: |
          Failed: Anti-patterns or doesn't use Tamagui correctly

    - id: "QUAL-005"
      name: "No Regressions or New Issues"
      weight: 15
      max_score: 5
      description: "Migration doesn't introduce new bugs, warnings, or issues"
      scoring_rubric:
        5: |
          Excellent: Clean migration:
          - No console warnings
          - No prop type warnings
          - No accessibility regressions
          - No performance regressions
          - All functionality preserved
        4: |
          Good: Minor issues:
          - Non-critical console warnings
          - Minor prop warnings that don't affect functionality
        3: |
          Acceptable: Some issues:
          - Warnings present but functionality works
          - Minor accessibility considerations missed
        2: |
          Poor: Notable issues:
          - Console errors that don't break functionality
          - Some functionality affected
        1: |
          Minimal: Major issues:
          - Significant warnings or errors
          - Some functionality broken
        0: |
          Failed: Critical issues introduced

    - id: "QUAL-006"
      name: "Complete File Coverage"
      weight: 10
      max_score: 5
      description: "All components and styles in the file fully migrated"
      scoring_rubric:
        5: |
          Excellent: Complete coverage:
          - All StyleSheet styles removed
          - All components in the file migrated
          - No TODO or FIXME comments left
          - All imports cleaned up
        4: |
          Good: Nearly complete:
          - 90%+ of styles migrated
          - Minor non-critical styles may remain
        3: |
          Acceptable: Mostly complete:
          - 75%+ of styles migrated
          - Some components may still use old patterns
        2: |
          Poor: Incomplete:
          - 50-75% migrated
          - Noticeable portions still using StyleSheet patterns
        1: |
          Minimal: Barely started:
          - 25-50% migrated
          - Majority still old pattern
        0: |
          Failed: Incomplete migration (<25% or not started)

  # ===============================
  # SCORING
  # ===============================
  scoring:
    # Binary checks must all pass for overall pass
    binary_required: true

    # Quality threshold for passing
    min_quality_score: 3.0 # Average across quality checks

    # Weighted scoring formula
    calculation: |
      Binary checks: ALL MUST PASS (blocking)
      Quality score: Weighted average of quality checks

      Final Score = sum(quality_score_i * weight_i) / sum(weights)

      Pass: All binary checks pass AND Final Score >= 3.0
      Fail: Any binary check fails OR Final Score < 3.0

    scale:
      - grade: "A (Excellent)"
        range: "4.5 - 5.0"
        description: "Migration exemplary, exceeds expectations"
      - grade: "B (Good)"
        range: "3.5 - 4.4"
        description: "Migration solid, minor improvements possible"
      - grade: "C (Acceptable)"
        range: "3.0 - 3.4"
        description: "Migration acceptable, meets minimum requirements"
      - grade: "D (Below Standard)"
        range: "2.0 - 2.9"
        description: "Below standards, needs revision"
      - grade: "F (Failed)"
        range: "0.0 - 1.9"
        description: "Unacceptable, requires complete rework"

  # ===============================
  # VALIDATION COMMANDS (Optional)
  # ===============================
  validation_commands:
    - name: "TypeScript Check"
      command: "tsc --noEmit"
      description: "Verify no TypeScript errors"

    - name: "Lint Check"
      command: "eslint <target_file>"
      description: "Verify no lint errors"

  # ===============================
  # EVALUATION NOTES
  # ===============================
  evaluation_notes: |
    1. Judge ONLY the target file provided, not other files in the project.
    2. Use this exact specification for consistency across all judges.
    3. Binary checks are PASS/FAIL - any failure blocks overall pass.
    4. Quality checks are scored 0-5 with provided rubric.
    5. Be lenient on QUAL-002 (Visual) since exact visual match may vary.
    6. Theme token usage ($4, $color, etc.) is preferred over hardcoded values.
    7. Tamagui shorthand props (p, m, px, py, gap, etc.) are encouraged.
    8. Some inline style={{}} may remain for dynamic/runtime styles - this is acceptable.
    9. Focus on whether the migration achieves the goal: StyleSheet -> Tamagui.
    10. Document any partial passes with specific observations.
