# Evaluation Specification: 100% Test Prefix Compliance
# Target: Achieve complete compliance with [UNIT] or [INTEGRATION] prefixes in all test files
# Artifact Type: Code (Test File Updates)

specification:
  name: "Test Prefix Compliance Enforcement"
  version: "1.0"
  description: |
    Verify that all test files in the Mirai App monorepo have been updated to use 
    proper [UNIT] or [INTEGRATION] prefixes in their describe() blocks, achieving
    100% compliance as measured by the validation script.

  target_scope:
    directories:
      - "apps/**"
      - "packages/**"
    file_patterns:
      - "**/*.test.ts"
      - "**/*.spec.ts"
    validation_script: "scripts/validate-test-prefixes.ts"

  compliance_requirements:
    valid_prefixes:
      - "[UNIT]"
      - "[INTEGRATION]"
      - "[DEBUG]"
      - "[E2E]"
    target_compliance_rate: "100%"
    target_violation_count: 0

  scoring_rubrics:
    - id: "R1"
      name: "Validation Script Exit Code"
      weight: 25
      description: "The validation script must exit with code 0 (success)"
      criteria:
        - "Script execution completes without errors"
        - "Exit code is 0 (not 1)"
        - "Output contains success message"
      scoring:
        excellent: "Exit code 0 with success message displayed"
        good: "Exit code 0 but minor output formatting issues"
        fair: "Script runs but exit code inconsistent"
        poor: "Exit code 1 (failure) or script errors"

    - id: "R2"
      name: "Violation Count"
      weight: 40
      description: "Total number of describe() blocks with missing or invalid prefixes"
      criteria:
        - "All describe() blocks must start with [UNIT], [INTEGRATION], [DEBUG], or [E2E]"
        - "No bare describe() blocks without prefixes"
        - "No deprecated or invalid prefixes"
      scoring:
        excellent: "0 violations (100% compliance)"
        good: "1-5 violations remaining"
        fair: "6-15 violations remaining"
        poor: "16+ violations remaining"

    - id: "R3"
      name: "Test File Coverage"
      weight: 20
      description: "Percentage of test files with proper prefixes"
      criteria:
        - "All .test.ts files updated"
        - "All .spec.ts files updated"
        - "Files in apps/ directory compliant"
        - "Files in packages/ directory compliant"
      scoring:
        excellent: "100% of test files compliant (253/253)"
        good: "95-99% compliant (240-252 files)"
        fair: "90-94% compliant (228-239 files)"
        poor: "<90% compliant (<228 files)"

    - id: "R4"
      name: "Prefix Appropriateness"
      weight: 15
      description: "Correct prefix selection based on test type"
      criteria:
        - "[UNIT] for pure logic tests (domain entities, value objects, utilities)"
        - "[INTEGRATION] for tests involving external services, DB, APIs"
        - "[DEBUG] for temporary debugging tests only"
        - "[E2E] for end-to-end flow tests"
      scoring:
        excellent: "All prefixes correctly match test nature"
        good: "Minor mismatches (<5% of files)"
        fair: "Some mismatches (5-10% of files)"
        poor: "Significant mismatches (>10% of files)"

  validation_checklist:
    - item: "Run 'bun run scripts/validate-test-prefixes.ts'"
      required: true
      expected_result: "Script exits with code 0"
      verification_command: "bun run scripts/validate-test-prefixes.ts && echo 'SUCCESS' || echo 'FAILED'"

    - item: "Check violation count in output"
      required: true
      expected_result: "Output shows '0 violation(s)' or no violations listed"
      verification_command: "bun run scripts/validate-test-prefixes.ts 2>&1 | grep -E '(0 violation|All test files validated)'"

    - item: "Verify files checked count"
      required: true
      expected_result: "Script processes all 253 test files"
      verification_command: "bun run scripts/validate-test-prefixes.ts 2>&1 | grep -oE '[0-9]+ test file' | head -1"

    - item: "Sample test files for prefix presence"
      required: true
      expected_result: "All sampled files have [UNIT] or [INTEGRATION] in describe blocks"
      sample_files:
        - "apps/native/src/utils/__tests__/utils.test.ts"
        - "apps/native/src/hooks/location/__tests__/useLocationPermissions.test.ts"
        - "apps/seed/src/seed.test.ts"
        - "packages/adapters/src/services/__tests__/coin-transaction.test.ts"
      verification_command: >-
        grep -E 'describe.*\[UNIT\]' <file>

    - item: "Check for bare describe() blocks without prefixes"
      required: true
      expected_result: "No bare describe() blocks found"
      verification_command: |
        find apps packages -name "*.test.ts" -o -name "*.spec.ts" | \
        xargs grep -l 'describe("[^[]' 2>/dev/null || echo "No bare describes found"

  minimum_acceptance_threshold:
    total_score: 90
    required_rubrics:
      - id: "R1"
        minimum_score: "excellent"
      - id: "R2"
        minimum_score: "excellent"
      - id: "R3"
        minimum_score: "good"
    critical_failures:
      - "Validation script exits with code 1"
      - "More than 5 violations remain"
      - "Less than 95% of files compliant"

  evaluation_procedure:
    steps:
      - step: 1
        action: "Execute validation script"
        command: "bun run scripts/validate-test-prefixes.ts"
        capture: ["exit_code", "stdout", "stderr", "violation_count"]

      - step: 2
        action: "Count total test files"
        command: "find apps packages -name '*.test.ts' -o -name '*.spec.ts' | wc -l"
        capture: ["file_count"]

      - step: 3
        action: "Verify describe block patterns"
        command: |
          find apps packages \( -name "*.test.ts" -o -name "*.spec.ts" \) -exec \
          grep -H 'describe(' {} \; | grep -v '\[UNIT\]' | grep -v '\[INTEGRATION\]' | \
          grep -v '\[DEBUG\]' | grep -v '\[E2E\]' | wc -l
        capture: ["non_compliant_describe_count"]

      - step: 4
        action: "Sample verification of fixed files"
        sample_size: 10
        method: "Random selection from previously non-compliant files"

    pass_criteria:
      - "Validation script returns exit code 0"
      - "Violation count is exactly 0"
      - "All test files processed (253 expected)"
      - "No bare describe() blocks without prefixes"

    fail_criteria:
      - "Validation script returns exit code 1"
      - "Any violations remain in output"
      - "Significant portion of files still non-compliant"
      - "Prefix mismatches where [UNIT] used for integration tests or vice versa"

  artifact_verification:
    expected_changes:
      - type: "file_modification"
        pattern: 'describe\s*\(\s*["'']([^"'']*)["'']'
        before_example: 'describe("validation utilities", () => {'
        after_example: 'describe("[UNIT] validation utilities", () => {'

      - type: "file_modification"
        pattern: 'describe\s*\(\s*["'']([^"'']*)["'']'
        before_example: 'describe("useLocationPermissions", () => {'
        after_example: 'describe("[UNIT] useLocationPermissions", () => {'

    verifiable_metrics:
      - name: "total_test_files"
        expected_value: 253
        tolerance: 0

      - name: "compliant_files"
        expected_value: 253
        tolerance: 0

      - name: "violation_count"
        expected_value: 0
        tolerance: 0

      - name: "compliance_rate"
        expected_value: "100%"
        tolerance: "0%"

  edge_cases:
    - scenario: "Nested describe blocks"
      handling: "Both parent and nested describes must have prefixes"
      example: |
        describe("[UNIT] User Entity", () => {
          describe("[UNIT] User.create", () => {  // Nested also needs prefix
            it("should create user", () => {});
          });
        });

    - scenario: "Files with multiple describe blocks"
      handling: "Every describe() block must have a prefix"
      validation: "Script checks all describes in file, not just first"

    - scenario: "Debug or temporary tests"
      handling: "Can use [DEBUG] prefix but should be minimal"
      note: "[DEBUG] is valid but should not be overused"

  output_format:
    success_report: |
      ✅ Test Prefix Compliance: PASSED

      Summary:
      - Total test files: {total_files}
      - Compliant files: {compliant_files}
      - Violations: {violation_count}
      - Compliance rate: {compliance_rate}%

      All test files now use proper [UNIT] or [INTEGRATION] prefixes!

    failure_report: |
      ❌ Test Prefix Compliance: FAILED

      Issues found:
      - Violations remaining: {violation_count}
      - Files non-compliant: {non_compliant_count}
      - Compliance rate: {compliance_rate}%

      Remaining violations:
      {violation_details}

      Required: 100% compliance (0 violations)

  references:
    - document: "AGENTS.md"
      section: "Test output"
      requirement: 'describe("[UNIT] EntityName", ...)'

    - script: "scripts/validate-test-prefixes.ts"
      purpose: "Validates test file prefixes"
      valid_prefixes: ["[UNIT]", "[INTEGRATION]"]

    - convention: "TDD: Test-driven development"
      rule: "Test tagging with [UNIT] or [INTEGRATION]"
