# Evaluation Specification: ChallengeSubmission Phase 1 Refactoring
# Refactor ChallengeSubmission.ts to use Phase 1 utilities following CEK patterns

metadata:
  task_id: "refactor-challenge-submission-phase1"
  entity_file: "/Users/rafalopilowski/Projekty/migration/pjapp/packages/domain/src/entities/ChallengeSubmission.ts"
  test_file: "/Users/rafalopilowski/Projekty/migration/pjapp/packages/domain/src/entities/ChallengeSubmission.test.ts"
  priority: "high"
  estimated_effort: "medium"

evaluation_criteria:
  # ============================================================================
  # 1. IMPORTS VERIFICATION
  # ============================================================================
  imports_requirements:
    - id: "import-validate"
      description: "Import validate utilities from utils"
      required_imports:
        - "validate"
      pattern: "validate.*from.*utils"
      severity: "blocking"

    - id: "import-state-machine"
      description: "Import createStateMachine from utils"
      required_imports:
        - "createStateMachine"
      pattern: "createStateMachine.*from.*utils"
      severity: "blocking"

    - id: "import-timestamps"
      description: "Import timestamps helper from utils"
      required_imports:
        - "timestamps"
      pattern: "timestamps.*from.*utils"
      severity: "blocking"

    - id: "import-update-entity"
      description: "Import updateEntity from utils"
      required_imports:
        - "updateEntity"
      pattern: "updateEntity.*from.*utils"
      severity: "blocking"

    - id: "import-errors"
      description: "Import ValidationError and StateTransitionError"
      required_imports:
        - "ValidationError"
        - "StateTransitionError"
      pattern: "ValidationError.*StateTransitionError.*from.*utils"
      severity: "blocking"

    - id: "import-result-helpers"
      description: "Import ok, err, isError from result utils"
      required_imports:
        - "ok"
        - "err"
        - "isError"
      severity: "blocking"

  # ============================================================================
  # 2. CONSTANTS AND STATE MACHINE
  # ============================================================================
  constants_requirements:
    - id: "remove-validation-rules"
      description: "Delete VALIDATION_RULES constant - replaced by validate utilities"
      forbidden_pattern: "const VALIDATION_RULES"
      severity: "blocking"

    - id: "state-machine-definition"
      description: "Create state machine for SubmissionStatus with correct transitions"
      required_elements:
        - "const submissionStateMachine"
        - "createStateMachine<SubmissionStatus>"
        - "initial: 'PENDING'"
        - "PENDING: { to: ['APPROVED', 'REJECTED'] }"
        - "APPROVED: { to: [] }"
        - "REJECTED: { to: [] }"
      severity: "blocking"
      validation_checks:
        - "PENDING can transition to APPROVED"
        - "PENDING can transition to REJECTED"
        - "APPROVED is terminal (empty to array)"
        - "REJECTED is terminal (empty to array)"

  # ============================================================================
  # 3. TYPE SIGNATURES
  # ============================================================================
  type_requirements:
    - id: "result-error-type"
      description: "Change Result error type from string to ValidationError | StateTransitionError"
      forbidden_pattern: "Result<ChallengeSubmission, string>"
      required_pattern: "Result<ChallengeSubmission, ValidationError | StateTransitionError>"
      locations:
        - "create method return type"
        - "updateEntity method return type"
      severity: "blocking"

  # ============================================================================
  # 4. VALIDATION LOGIC REPLACEMENT
  # ============================================================================
  validation_requirements:
    - id: "validate-challenge-id"
      description: "Replace manual challengeId validation with validate.id()"
      old_code_fragment: 'if (!props.challengeId || props.challengeId.trim() === "")'
      required_pattern: "validate.id(props.challengeId"
      severity: "blocking"

    - id: "validate-group-id"
      description: "Replace manual groupId validation with validate.id()"
      old_code_fragment: 'if (!props.groupId || props.groupId.trim() === "")'
      required_pattern: "validate.id(props.groupId"
      severity: "blocking"

    - id: "validate-text-content"
      description: "Replace manual textContent validation with validate.string()"
      forbidden_pattern: "VALIDATION_RULES.textContent.maxLength"
      required_pattern: "validate.string(props.textContent"
      severity: "blocking"

    - id: "validate-rejection-reason"
      description: "Replace manual rejectionReason validation with validate.string()"
      forbidden_pattern: "VALIDATION_RULES.rejectionReason.maxLength"
      required_pattern: "validate.string(props.rejectionReason"
      severity: "blocking"

    - id: "validate-image-ids"
      description: "Replace manual imageIds validation with validate.array()"
      forbidden_pattern: "VALIDATION_RULES.imageIds.maxCount"
      required_pattern: "validate.array(props.imageIds"
      severity: "blocking"

    - id: "validate-latitude"
      description: "Replace manual latitude validation with validate.number()"
      forbidden_pattern: "VALIDATION_RULES.location.minLatitude"
      required_pattern: "validate.number(props.latitude"
      severity: "blocking"

    - id: "validate-longitude"
      description: "Replace manual longitude validation with validate.number()"
      forbidden_pattern: "VALIDATION_RULES.location.minLongitude"
      required_pattern: "validate.number(props.longitude"
      severity: "blocking"

    - id: "validate-ranking"
      description: "Replace manual ranking validation with validate.number()"
      old_code_fragment: "if (props.ranking < 1)"
      required_pattern: "validate.number(props.ranking"
      severity: "blocking"

    - id: "validate-awarded-points"
      description: "Replace manual awardedPoints validation with validate.number()"
      old_code_fragment: "awardedPoints < 0"
      required_pattern: "validate.number(props.awardedPoints"
      severity: "blocking"

    - id: "validate-bonus-points"
      description: "Replace manual bonusPoints validation with validate.number()"
      old_code_fragment: "bonusPoints < 0"
      required_pattern: "validate.number(props.bonusPoints"
      severity: "blocking"

  # ============================================================================
  # 5. TIMESTAMP HELPER USAGE
  # ============================================================================
  timestamp_requirements:
    - id: "use-timestamps-helper"
      description: "Replace manual timestamp logic with timestamps() helper"
      old_code_fragment: "const now = new Date()"
      required_pattern: "timestamps(props)"
      severity: "blocking"
      notes: "timestamps() helper should be called once and destructured for createdAt/updatedAt"

  # ============================================================================
  # 6. ENTITY UPDATE PATTERN (CRITICAL)
  # ============================================================================
  entity_update_requirements:
    - id: "remove-update-content"
      description: "Remove updateContent() method - replaced by updateEntity + state machine"
      forbidden_pattern: "updateContent(props:"
      severity: "blocking"

    - id: "remove-approve-method"
      description: "Remove approve() method - replaced by updateEntity + state machine"
      forbidden_pattern: "approve(props:"
      severity: "blocking"

    - id: "remove-reject-method"
      description: "Remove reject() method - replaced by updateEntity + state machine"
      forbidden_pattern: "reject(props:"
      severity: "blocking"

    - id: "remove-auto-approve-method"
      description: "Remove autoApprove() method - replaced by updateEntity + state machine"
      forbidden_pattern: "autoApprove(props:"
      severity: "blocking"

    - id: "remove-update-vote-stats-method"
      description: "Remove updateVoteStats() method - replaced by updateEntity"
      forbidden_pattern: "updateVoteStats(props:"
      severity: "blocking"

    - id: "add-update-entity-method"
      description: "Add updateEntity() method following Phase 1 pattern"
      required_pattern: "updateEntity("
      required_elements:
        - "Uses validate utilities for field validation"
        - "Uses state machine for status transition validation"
        - "Returns Result with ValidationError | StateTransitionError"
        - "Uses timestamps or preserves existing timestamps"
      severity: "blocking"

    - id: "state-transition-check"
      description: "State transitions must be validated using state machine"
      required_pattern: "canTransition"
      severity: "blocking"

  # ============================================================================
  # 7. IMMUTABILITY PRESERVATION
  # ============================================================================
  immutability_requirements:
    - id: "immutable-return-pattern"
      description: "All update methods must return new ChallengeSubmission instances"
      required_pattern: "new ChallengeSubmission("
      locations:
        - "create method"
        - "updateEntity method"
      severity: "blocking"

    - id: "preserve-immutable-fields"
      description: "Immutable fields must be preserved in updates"
      preserved_fields:
        - "id"
        - "challengeId"
        - "groupId"
        - "createdAt"
      severity: "critical"

  # ============================================================================
  # 8. UTILITY INTEGRATION
  # ============================================================================
  utility_integration:
    - id: "use-is-error-helper"
      description: "Use isError() helper for result error checking where appropriate"
      pattern: "isError("
      optional: true

    - id: "error-accumulation-pattern"
      description: "Validate all fields and accumulate errors"
      pattern: "errors: ValidationError[]"
      severity: "recommended"

# ============================================================================
# TEST FILE EVALUATION CRITERIA
# ============================================================================
test_requirements:
  - id: "test-error-types"
    description: "Tests must check for typed errors (ValidationError, StateTransitionError) not strings"
    forbidden_patterns:
      - 'result.error).toBe("challengeId is required")'
      - 'result.error).toBe("Cannot edit submission that is not pending")'
      - 'result.error).toBe("Cannot approve a rejected submission")'
      - 'result.error).toBe("Rejection reason is required")'
      - 'result.error).toBe("Cannot reject an approved submission")'
    required_patterns:
      - "toBeInstanceOf(ValidationError)"
      - "toBeInstanceOf(StateTransitionError)"
    severity: "blocking"

  - id: "test-import-error-types"
    description: "Tests must import ValidationError and StateTransitionError"
    required_imports:
      - "ValidationError"
      - "StateTransitionError"
    severity: "blocking"

  - id: "test-ok-result-access"
    description: "Tests must use proper Result type narrowing"
    required_pattern: "if (result.kind === 'ok')"
    severity: "critical"

  - id: "test-err-result-access"
    description: "Tests must handle error result type correctly"
    required_pattern: "if (result.kind === 'err')"
    severity: "critical"

  - id: "test-state-transitions"
    description: "Tests must verify state machine transitions"
    test_cases:
      - "PENDING to APPROVED works"
      - "PENDING to REJECTED works"
      - "APPROVED to any fails"
      - "REJECTED to any fails"
    severity: "blocking"

  - id: "test-typed-validation-errors"
    description: "Validation error tests check error properties not messages"
    examples:
      - "expect(result.error.field).toBe('textContent')"
      - "expect(result.error.constraint).toBe('maxLength')"
    severity: "blocking"

# ============================================================================
# ACCEPTANCE CRITERIA
# ============================================================================
acceptance_criteria:
  functional:
    - id: "ac-01"
      description: "All existing entity behavior is preserved"
      verification: "All existing tests pass (modified for typed errors)"

    - id: "ac-02"
      description: "Validation uses validate.*() utilities"
      verification: "No manual if/throw or if/return err() validation patterns"

    - id: "ac-03"
      description: "State machine controls all status transitions"
      verification: "All status changes go through state machine canTransition/transition"

    - id: "ac-04"
      description: "Errors are typed (ValidationError | StateTransitionError)"
      verification: "No string error types; all errors have _tag discriminator"

    - id: "ac-05"
      description: "Entity remains immutable"
      verification: "All methods return new instances; no mutations"

  quality:
    - id: "ac-06"
      description: "Code follows DDD domain layer purity"
      verification: "No external dependencies; pure functions only"

    - id: "ac-07"
      description: "Consistent with Phase 1 entity patterns"
      verification: "Structure matches other Phase 1 refactored entities"

    - id: "ac-08"
      description: "Tests are updated to check typed errors"
      verification: "All error assertions use instanceof or _tag checks"

# ============================================================================
# VERIFICATION COMMANDS
# ============================================================================
verification_commands:
  - name: "Run entity tests"
    command: "bun test packages/domain/src/entities/ChallengeSubmission.test.ts"
    expected_exit_code: 0

  - name: "Type check"
    command: "bun tsc --noEmit -p packages/domain/tsconfig.json"
    expected_exit_code: 0

  - name: "Run all domain tests"
    command: "bun test packages/domain"
    expected_exit_code: 0

# ============================================================================
# RUBRIC
# ============================================================================
rubric:
  - category: "Phase 1 Compliance"
    weight: 0.40
    criteria:
      - "Uses all required utilities (validate, timestamps, state machine, updateEntity)"
      - "Proper error types (ValidationError, StateTransitionError)"
      - "Result type correctly parameterized"

  - category: "Functional Correctness"
    weight: 0.30
    criteria:
      - "All validation rules preserved"
      - "State machine transitions correct"
      - "Immutable updates work correctly"

  - category: "Test Quality"
    weight: 0.20
    criteria:
      - "Tests updated for typed errors"
      - "All existing test coverage preserved"
      - "Error type assertions correct"

  - category: "Code Quality"
    weight: 0.10
    criteria:
      - "Clean, readable code"
      - "Consistent with existing patterns"
      - "No redundant code"

scoring:
  - "4.5-5.0: Excellent - Ready to merge"
  - "4.0-4.4: Good - Minor issues to address"
  - "3.5-3.9: Acceptable - Issues must be fixed"
  - "Below 3.5: Needs significant work"
