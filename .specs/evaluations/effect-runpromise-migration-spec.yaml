        penalty: 5

  # ============================================================================
  # PATTERN EXAMPLES - Reference for judges
  # ============================================================================
  pattern_examples:
    anti_patterns_to_eliminate:
      - name: "Nested runPromise"
        before: |
          const result = await Effect.runPromise(
            Effect.flatMap(someEffect, async (x) => {
              const y = await Effect.runPromise(otherEffect);
              return transform(x, y);
            })
          );
        after: |
          const result = await Effect.runPromise(
            Effect.gen(function* () {
              const x = yield* someEffect;
              const y = yield* otherEffect;
              return transform(x, y);
            })
          );

      - name: "Sequential await with runPromise"
        before: |
          const user = await Effect.runPromise(getUserEffect);
          const orders = await Effect.runPromise(getOrdersEffect(user.id));
          const result = await Effect.runPromise(processOrdersEffect(orders));
        after: |
          const result = await Effect.runPromise(
            Effect.gen(function* () {
              const user = yield* getUserEffect;
              const orders = yield* getOrdersEffect(user.id);
              return yield* processOrdersEffect(orders);
            })
          );

      - name: "Promise.all with runPromise"
        before: |
          const [a, b] = await Promise.all([
            Effect.runPromise(effectA),
            Effect.runPromise(effectB)
          ]);
        after: |
          const [a, b] = await Effect.runPromise(
            Effect.all([effectA, effectB])
          );

      - name: "Map with intermediate runPromise"
        before: |
          const results = await Promise.all(
            items.map(async (item) => {
              const transformed = await Effect.runPromise(transformEffect(item));
              return await Effect.runPromise(saveEffect(transformed));
            })
          );
        after: |
          const results = await Effect.runPromise(
            Effect.all(
              items.map((item) =>
                Effect.gen(function* () {
                  const transformed = yield* transformEffect(item);
                  return yield* saveEffect(transformed);
                })
              )
            )
          );

    patterns_to_keep:
      - name: "Router boundary"
        location: "apps/*/src/routers/*.ts"
        example: |
          .query(async ({ ctx, input }) => {
            const controller = ctx.container.resolve("userController");
            return Effect.runPromise(controller.getById(input, ctx.container));
          })
        reason: "runPromise at framework boundary is correct"

      - name: "Controller response"
        location: "adapters/src/controllers/*.ts"
        example: |
          async getById(input: GetByIdInput, di: DIContext) {
            const result = this.useCase.execute(input).pipe(
              Effect.provide(this.createLayer(di))
            );
            return Effect.runPromise(result);
          }
        reason: "Controller returns Promise to router; runPromise here is the edge"

      - name: "Test assertions"
        location: "*.test.ts"
        example: |
          const result = await Effect.runPromise(program);
          expect(result).toBe(expected);
        reason: "Tests expect Promises; Effect.runPromise is appropriate"

  # ============================================================================
  # LAYER-SPECIFIC RULES
  # ============================================================================
  layer_rules:
    domain:
      allowed: []
      forbidden: ["Effect.runPromise", "Promise", "async/await"]
      note: "Domain must be pure Effect<T,E,never> with no runtime execution"

    use_cases:
      allowed: []
      forbidden: ["Effect.runPromise"]
      note: "Use cases compose Effects; execution happens at adapter level"
      exception: "Main entry point functions that export to adapters may have single runPromise"

    adapters:
      allowed: ["Effect.runPromise"]
      location: "controllers, framework adapters"
      note: "runPromise allowed at boundary when returning to framework"
      forbidden_internally: ["runPromise in gateways, mappers, middleware"]

    frameworks:
      allowed: ["Effect.runPromise"]
      location: "routers, CLI entry points, main() functions"
      note: "Framework layer is the ultimate edge where Effects meet runtime"

