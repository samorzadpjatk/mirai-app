# Evaluation Specification: Step 3 - Compose AppLayer
# Migration: awilix-modular DI → Effect Context/Layer System

metadata:
  step: 3
  title: "Compose AppLayer by Merging RepositoryLayer and ServiceLayer"
  artifact_type: code
  evaluation_type: implementation_review
  previous_steps:
    - step_1: "RepositoryLayer.ts with 17 repository bindings"
    - step_2: "ServiceLayer.ts with 5 service bindings"

evaluation_scope:
  description: |
    Evaluate the implementation of AppLayer which composes RepositoryLayer and ServiceLayer
    using Effect's Layer.mergeAll. The AppLayer is the unified dependency layer used by
    controllers and application entry points.

  target_files:
    - "packages/frameworks/src/layers/AppLayer.ts"
    - "packages/frameworks/src/layers/index.ts"
    - "packages/frameworks/src/index.ts"

  dependencies:
    - "packages/frameworks/src/layers/RepositoryLayer.ts"
    - "packages/frameworks/src/layers/ServiceLayer.ts"

rubrics:
  - id: R1
    name: "AppLayer.ts Structure and Implementation"
    weight: 35
    description: |
      The AppLayer.ts file must correctly implement Layer.mergeAll to compose
      RepositoryLayer and ServiceLayer into a single unified layer.

    criteria:
      - criterion: "File exists at correct location"
        points: 5
        required: true
        check: |
          File packages/frameworks/src/layers/AppLayer.ts must exist

      - criterion: "Correct imports from Effect"
        points: 5
        required: true
        check: |
          Must import { Layer } from "effect"

      - criterion: "Imports RepositoryLayer and ServiceLayer"
        points: 5
        required: true
        check: |
          Must import { RepositoryLayer } from "./RepositoryLayer"
          Must import { ServiceLayer } from "./ServiceLayer"

      - criterion: "Uses Layer.mergeAll correctly"
        points: 10
        required: true
        check: |
          AppLayer must be created using Layer.mergeAll(RepositoryLayer, ServiceLayer)
          or equivalent composition pattern

      - criterion: "Proper type exports"
        points: 5
        required: true
        check: |
          Must export AppLayer type for use in other packages
          Type should be Layer.Layer<RepositoryLayer | ServiceLayer, never, DbConfig | SupabaseConfig>

      - criterion: "Factory function makeAppLayer"
        points: 5
        required: true
        check: |
          Must export factory function: makeAppLayer(config: { db: Database, supabase: SupabaseClient })
          Function should return Layer.Layer<AppRequirements, never, never>

    passing_threshold: 25/35

    examples:
      good: |
        // packages/frameworks/src/layers/AppLayer.ts
        import { Layer } from "effect";
        import { RepositoryLayer } from "./RepositoryLayer";
        import { ServiceLayer } from "./ServiceLayer";

        export type AppRequirements = RepositoryLayer | ServiceLayer;

        export const makeAppLayer = (config: {
          db: Database;
          supabase: SupabaseClient;
        }): Layer.Layer<AppRequirements, never, never> => {
          const repositoryLayer = RepositoryLayer.make(config.db);
          const serviceLayer = ServiceLayer.make(config);
          return Layer.mergeAll(repositoryLayer, serviceLayer);
        };

      bad: |
        // Missing factory function
        export const AppLayer = Layer.mergeAll(RepositoryLayer, ServiceLayer);

        // Wrong: Using awilix patterns
        export const container = createContainer();
        container.register({ ...RepositoryLayer, ...ServiceLayer });

  - id: R2
    name: "Barrel Export in layers/index.ts"
    weight: 20
    description: |
      The layers/index.ts barrel file must export all layer modules including
      the newly created AppLayer for convenient importing.

    criteria:
      - criterion: "File exists at correct location"
        points: 5
        required: true
        check: |
          File packages/frameworks/src/layers/index.ts must exist

      - criterion: "Exports AppLayer"
        points: 5
        required: true
        check: |
          Must include: export * from "./AppLayer"

      - criterion: "Exports RepositoryLayer"
        points: 5
        required: true
        check: |
          Must include: export * from "./RepositoryLayer"

      - criterion: "Exports ServiceLayer"
        points: 5
        required: true
        check: |
          Must include: export * from "./ServiceLayer"

    passing_threshold: 15/20

    examples:
      good: |
        // packages/frameworks/src/layers/index.ts
        export * from "./RepositoryLayer";
        export * from "./ServiceLayer";
        export * from "./AppLayer";

      bad: |
        // Missing AppLayer export
        export * from "./RepositoryLayer";
        export * from "./ServiceLayer";
        // ❌ AppLayer not exported

  - id: R3
    name: "Framework Package Export"
    weight: 20
    description: |
      The frameworks package's main index.ts must export the layers module
      so external packages can import AppLayer and related utilities.

    criteria:
      - criterion: "File exists at correct location"
        points: 5
        required: true
        check: |
          File packages/frameworks/src/index.ts must exist

      - criterion: "Exports layers module"
        points: 10
        required: true
        check: |
          Must include: export * as Layers from "./layers"
          OR: export * from "./layers"

      - criterion: "Convenient AppLayer export"
        points: 5
        required: false
        check: |
          Should also export AppLayer directly: export { makeAppLayer, AppRequirements } from "./layers"

    passing_threshold: 15/20

    examples:
      good: |
        // packages/frameworks/src/index.ts
        export * as Layers from "./layers";
        export { makeAppLayer, AppRequirements } from "./layers/AppLayer";

      bad: |
        // No layers export - breaks external imports
        export { createContainer } from "./di";
        // ❌ Layers not exported

  - id: R4
    name: "Effect Patterns and Best Practices"
    weight: 15
    description: |
      The implementation must follow Effect patterns for Layer composition
      and avoid anti-patterns or mixing with other DI systems.

    criteria:
      - criterion: "No awilix dependencies in layer code"
        points: 5
        required: true
        check: |
          AppLayer.ts must not import from "awilix" or "awilix-modular"

      - criterion: "Pure Layer composition"
        points: 5
        required: true
        check: |
          No side effects in layer creation
          No imperative container manipulation

      - criterion: "Proper type safety"
        points: 5
        required: true
        check: |
          Exported types are explicit and not 'any'
          Layer types properly parameterized

    passing_threshold: 10/15

  - id: R5
    name: "Code Quality and Documentation"
    weight: 10
    description: |
      Code should be clean, well-documented, and follow project conventions.

    criteria:
      - criterion: "JSDoc for factory function"
        points: 3
        required: false
        check: |
          makeAppLayer should have JSDoc explaining parameters and return type

      - criterion: "Consistent naming conventions"
        points: 3
        required: true
        check: |
          camelCase for functions (makeAppLayer)
          PascalCase for types (AppRequirements)

      - criterion: "No unused imports or variables"
        points: 2
        required: true
        check: |
          All imports are used
          No dead code

      - criterion: "Proper file organization"
        points: 2
        required: true
        check: |
          Imports grouped logically (Effect, internal)
          Exports at end of file

    passing_threshold: 7/10

checklist:
  required_artifacts:
    - path: "packages/frameworks/src/layers/AppLayer.ts"
      description: "Main AppLayer implementation with Layer.mergeAll"
      must_contain:
        - 'import { Layer } from "effect"'
        - "Layer.mergeAll"
        - "makeAppLayer"
        - "RepositoryLayer"
        - "ServiceLayer"
      must_not_contain:
        - "awilix"
        - "createContainer"
        - "asClass"
        - "asFunction"

    - path: "packages/frameworks/src/layers/index.ts"
      description: "Barrel export for all layer modules"
      must_contain:
        - 'export * from "./AppLayer"'
        - 'export * from "./RepositoryLayer"'
        - 'export * from "./ServiceLayer"'

    - path: "packages/frameworks/src/index.ts"
      description: "Main framework package exports"
      must_contain:
        - "export *"
        - "./layers"

  functional_requirements:
    - description: "AppLayer correctly merges RepositoryLayer and ServiceLayer"
      verification: |
        The makeAppLayer factory should return a Layer that provides
        all repository and service tags when provided with db and supabase config.

    - description: "Factory function signature is correct"
      verification: |
        makeAppLayer({ db, supabase }) should return Layer.Layer<AppRequirements, never, never>

    - description: "Exports enable external usage"
      verification: |
        External packages should be able to import:
        import { makeAppLayer } from "@mirai-app/frameworks";
        import { Layers } from "@mirai-app/frameworks";

scoring:
  total_points: 100
  passing_threshold: 70

  grade_scale:
    excellent: { min: 90, label: "Exceeds Expectations" }
    good: { min: 80, label: "Meets Expectations" }
    acceptable: { min: 70, label: "Acceptable" }
    needs_work: { min: 50, label: "Needs Improvement" }
    insufficient: { min: 0, label: "Does Not Meet Requirements" }

  weights:
    R1_AppLayer_Implementation: 35%
    R2_Barrel_Export: 20%
    R3_Framework_Export: 20%
    R4_Effect_Patterns: 15%
    R5_Code_Quality: 10%

automated_checks:
  file_existence:
    - "packages/frameworks/src/layers/AppLayer.ts"
    - "packages/frameworks/src/layers/index.ts"
    - "packages/frameworks/src/index.ts"

  import_validation:
    - source: "packages/frameworks/src/layers/AppLayer.ts"
      must_import:
        - "effect"
        - "./RepositoryLayer"
        - "./ServiceLayer"
      must_not_import:
        - "awilix"
        - "awilix-modular"

  export_validation:
    - source: "packages/frameworks/src/layers/index.ts"
      must_export_from:
        - "./AppLayer"
        - "./RepositoryLayer"
        - "./ServiceLayer"

judge_instructions:
  pre_evaluation:
    - Verify all target files exist
    - Check that RepositoryLayer and ServiceLayer from previous steps are in place
    - Read the AppLayer.ts implementation thoroughly

  evaluation_process:
    - Score each rubric criterion individually
    - Verify checklist items are satisfied
    - Run automated checks if tooling available
    - Calculate final score

  decision_matrix:
    - if_score: ">= 90"
      decision: "APPROVE"
      action: "Mark Step 3 as complete, proceed to Step 4"
    - if_score: ">= 70"
      decision: "APPROVE_WITH_FEEDBACK"
      action: "Mark complete but note areas for improvement"
    - if_score: ">= 50"
      decision: "REVISE"
      action: "Request revisions for identified issues"
    - if_score: "< 50"
      decision: "REJECT"
      action: "Request significant rework, may need to revisit previous steps"

  common_issues:
    - issue: "Missing factory function"
      severity: "HIGH"
      remediation: "Add makeAppLayer({ db, supabase }) factory that returns composed Layer"

    - issue: "Wrong Layer composition method"
      severity: "HIGH"
      remediation: "Use Layer.mergeAll(repositoryLayer, serviceLayer), not manual merging"

    - issue: "Missing barrel export"
      severity: "MEDIUM"
      remediation: "Add export * from './AppLayer' to layers/index.ts"

    - issue: "Framework package doesn't export layers"
      severity: "MEDIUM"
      remediation: "Add export * as Layers from './layers' to frameworks/src/index.ts"

    - issue: "Mixed awilix and Effect patterns"
      severity: "CRITICAL"
      remediation: "Remove all awilix imports and use pure Effect Layer patterns"

context_for_judge:
  previous_step_context: |
    Step 1 created RepositoryLayer with 17 repository bindings:
    - UserRepository, PostRepository, CommentRepository, etc.
    - Factory: RepositoryLayer.make(db) returns Layer.mergeAll of all repos

    Step 2 created ServiceLayer with 5 service bindings:
    - AuthService, NotificationService, UploadService, etc.
    - Factory: ServiceLayer.make({ supabase, db }) returns Layer.mergeAll of all services

  expected_usage: |
    The AppLayer will be used by controllers and application entry points like:

    import { makeAppLayer } from "@mirai-app/frameworks";

    const appLayer = makeAppLayer({ db, supabase });
    const program = Effect.provide(someEffect, appLayer);

  migration_context: |
    This is Step 3 of 7 in migrating from awilix-modular to Effect Context/Layer.
    Previous steps established individual layers.
    This step composes them into the unified AppLayer.
    Next steps will integrate AppLayer into controllers and application bootstrap.
